<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - OK Mart</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HEADER -->
<header>
    <div>🛒 Your Cart</div>
</header>

<!-- TOP SUMMARY -->
<div class="cart-top">
    <h3>Quick Basket (<span id="itemCount">0</span>)</h3>
    <h3 id="topTotal">₹0</h3>
</div>

<!-- FREE DELIVERY -->
<div class="free-box">
    Yay! You get Free delivery with this Basket
</div>

<!-- CART ITEMS -->
<div id="cartItems" class="cart-container"></div>

<!-- PAYMENT SUMMARY -->
<div class="summary">
    <h3>Payment Details</h3>

    <div class="row">
        <span>MRP Total</span>
        <span id="mrp"></span>
    </div>

    <div class="row">
        <span>Discount</span>
        <span id="discount" class="green"></span>
    </div>

    <div class="row">
        <span>Delivery</span>
        <span id="delivery"></span>
    </div>

    <div class="row total">
        <span>Total</span>
        <span id="grandTotal"></span>
    </div>
</div>

<!-- STICKY BOTTOM BAR -->
<div class="checkout-bar">
    <span id="bottomTotal">₹0</span>
    <button onclick="goCheckout()">Place Order</button>
</div>

<script src="js/main.js"></script>
<script src="js/cart.js"></script>

<script>

/* =========================
   LOAD CART UI
========================= */
function loadCartUI() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let container = document.getElementById("cartItems");

    container.innerHTML = "";

    let total = 0;

    if (cart.length === 0) {
        container.innerHTML = "<p>Cart empty ❌</p>";
        return;
    }

    cart.forEach((item, i) => {

        total += item.price * item.qty;

        container.innerHTML += `
        <div class="cart-card">
            
            <img src="https://via.placeholder.com/80">

            <div class="cart-info">
                <h4>${item.name}</h4>
                <p>₹${item.price}</p>

                <div class="qty-box">
                    <button onclick="changeQty(${i},-1)">-</button>
                    <span>${item.qty}</span>
                    <button onclick="changeQty(${i},1)">+</button>
                </div>
            </div>

        </div>
        `;
    });

    // calculations
    let delivery = total >= 300 ? 0 : 20;
    let discount = total >= 300 ? 20 : 0;

    document.getElementById("itemCount").innerText = cart.length;
    document.getElementById("topTotal").innerText = "₹" + total;
    document.getElementById("mrp").innerText = "₹" + (total + discount);
    document.getElementById("discount").innerText = "-₹" + discount;
    document.getElementById("delivery").innerText = delivery === 0 ? "FREE" : "₹20";
    document.getElementById("grandTotal").innerText = "₹" + (total + delivery);
    document.getElementById("bottomTotal").innerText = "₹" + (total + delivery);
}

/* =========================
   INIT
========================= */
loadCartUI();

</script>

</body>
</html>
