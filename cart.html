<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Cart · OK Mart</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>
  <header class="app-header" id="mainHeader">
    <div class="header-container">
      <a href="index.html" class="logo-link">
        <span class="logo-text">🛒 OK Mart</span>
      </a>
      <a href="cart.html" class="cart-icon-link" aria-label="cart">
        <span class="cart-icon">🛍️</span>
        <span class="cart-badge" id="cartCountPlaceholder">0</span>
      </a>
    </div>
  </header>

  <main class="cart-main">
    <h1 class="page-title">your basket</h1>
    <div class="cart-items-container" id="cartItemsContainer">
      <!-- cart items will be rendered by cart.js -->
    </div>
    <div class="cart-summary" id="cartSummary">
      <!-- subtotal, delivery etc -->
    </div>
    <div class="cart-actions">
      <a href="checkout.html" class="btn-primary checkout-btn">proceed to checkout →</a>
    </div>
  </main>

  <div class="sticky-bottom-bar">
    <div class="bottom-bar-inner">
      <span class="delivery-message">🚀 delivery in 10 mins</span>
      <span class="min-order">min order ₹99</span>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
