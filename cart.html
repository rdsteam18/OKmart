<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Your Cart | OK Mart</title>
  <meta name="theme-color" content="#2ecc71">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/cart.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1a1e2b;min-height:100vh}
    .container{max-width:480px;margin:0 auto;padding:0 16px 120px}
    .header{display:flex;align-items:center;gap:12px;padding:12px 0;position:sticky;top:0;background:#f8fafc;z-index:10}
    .back-btn{width:40px;height:40px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.5rem;border:1px solid #e5e7eb}
    h1{font-size:1.3rem;font-weight:700}
    .summary-bar{background:white;border-radius:16px;padding:14px 18px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.03)}
    .cart-item{background:white;border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.03)}
    .cart-item img{width:70px;height:70px;border-radius:12px;object-fit:cover;background:#f1f5f9}
    .cart-item-info{flex:1}
    .cart-item-name{font-weight:600;font-size:.9rem;margin-bottom:4px}
    .cart-item-price{font-weight:700;color:#27ae60}
    .qty-control{display:flex;align-items:center;gap:6px;background:#f8fafc;padding:3px;border-radius:30px}
    .qty-btn{width:30px;height:30px;border-radius:50%;background:white;border:1px solid #e5e7eb;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#2ecc71;font-weight:600}
    .qty-num{min-width:22px;text-align:center;font-weight:600}
    .remove-btn{background:none;border:none;color:#ef4444;font-size:1.2rem;cursor:pointer;padding:4px}
    .free-badge{background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:20px;font-size:.6rem;font-weight:600}
    .empty-cart{text-align:center;padding:80px 20px}
    .empty-cart span{font-size:4rem;opacity:.5;display:block;margin-bottom:16px}
    .shop-btn{display:inline-block;margin-top:20px;background:#2ecc71;color:white;padding:14px 28px;border-radius:40px;text-decoration:none;font-weight:600}
    .summary-section{background:white;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
    .summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem}
    .summary-row.total{font-weight:700;font-size:1.1rem;border-top:1px solid #e5e7eb;margin-top:8px;padding-top:12px}
    .checkout-bar{position:fixed;bottom:0;left:0;right:0;background:white;padding:14px 16px;box-shadow:0 -4px 20px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:space-between;max-width:480px;margin:0 auto}
    .checkout-btn{background:#2ecc71;color:white;padding:14px 28px;border-radius:40px;text-decoration:none;font-weight:700;font-size:1rem}
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><a href="/index.html" class="back-btn">←</a><h1>Your Cart</h1></div>
    
    <div id="cartItems"></div>
    <div id="emptyCart" class="empty-cart" style="display:none;">
      <span>🛒</span><h2>Your cart is empty</h2><p>Add some products to get started!</p>
      <a href="/index.html" class="shop-btn">Start Shopping →</a>
    </div>
    <div class="summary-section" id="summary" style="display:none;">
      <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
      <div class="summary-row"><span>Delivery</span><span id="deliveryFee">₹20</span></div>
      <div class="summary-row total"><span>Total</span><span id="grandTotal">₹0</span></div>
    </div>
  </div>
  
  <div class="checkout-bar" id="checkoutBar" style="display:none;">
    <div><span style="font-size:.75rem;color:#6b7280;">Total</span><br><span style="font-weight:700;font-size:1.2rem;" id="barTotal">₹0</span></div>
    <a href="/checkout.html" class="checkout-btn">Place Order →</a>
  </div>

  <script src="/js/common.js"></script>
  <script>
    const FREE_THRESHOLD = 199;
    const DELIVERY_CHARGE = 20;
    
    function renderCart() {
      const cart = window.OKMart.getCart();
      const container = document.getElementById('cartItems');
      const emptyCart = document.getElementById('emptyCart');
      const summary = document.getElementById('summary');
      const bar = document.getElementById('checkoutBar');
      
      if (cart.length === 0) {
        container.innerHTML = '';
        emptyCart.style.display = 'block';
        summary.style.display = 'none';
        bar.style.display = 'none';
        return;
      }
      
      emptyCart.style.display = 'none';
      summary.style.display = 'block';
      bar.style.display = 'flex';
      
      container.innerHTML = cart.map(item => {
        const isFree = item.isFree || item.id === 'free_onion';
        return `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/70'">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name} ${isFree ? '<span class="free-badge">🎁 FREE</span>' : ''}</div>
              <div class="cart-item-price">${isFree ? 'FREE' : '₹' + item.price}</div>
              <div class="cart-item-unit">${item.unit || ''}</div>
            </div>
            ${!isFree ? `
              <div class="qty-control">
                <button class="qty-btn" onclick="updateQty('${item.id}', ${item.quantity - 1})">−</button>
                <span class="qty-num">${item.quantity}</span>
                <button class="qty-btn" onclick="updateQty('${item.id}', ${item.quantity + 1})">+</button>
              </div>
              <button class="remove-btn" onclick="removeItem('${item.id}')">🗑️</button>
            ` : ''}
          </div>`;
      }).join('');
      
      updateTotals();
    }
    
    function updateQty(id, qty) {
      if (qty <= 0) { window.OKMart.removeFromCart(id); }
      else { window.OKMart.updateQty(id, qty); }
      renderCart();
    }
    
    function removeItem(id) { window.OKMart.removeFromCart(id); renderCart(); }
    
    function updateTotals() {
      const cart = window.OKMart.getCart();
      const subtotal = cart.filter(i => !i.isFree).reduce((s, i) => s + (i.price * i.quantity), 0);
      const delivery = subtotal >= FREE_THRESHOLD ? 0 : DELIVERY_CHARGE;
      const total = subtotal + delivery;
      
      document.getElementById('subtotal').textContent = `₹${subtotal}`;
      document.getElementById('deliveryFee').textContent = delivery === 0 ? 'FREE' : `₹${delivery}`;
      document.getElementById('grandTotal').textContent = `₹${total}`;
      document.getElementById('barTotal').textContent = `₹${total}`;
    }
    
    renderCart();
  </script>
</body>
</html>
