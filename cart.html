<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no">
  
  <title>My Cart | OK Mart</title>
  <meta name="description" content="Review your cart and checkout at OK Mart. Fresh groceries delivered fast.">
  <meta name="theme-color" content="#2ecc71">
  
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/cart.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- ========== HEADER ========== -->
    <header class="cart-header">
      <div class="header-inner">
        <a href="/index.html" class="back-btn">←</a>
        <h1 class="header-title">My Cart</h1>
        <span class="cart-count-badge" id="headerCartCount">0</span>
      </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="cart-main">
      
      <!-- Cart Items -->
      <div class="cart-items-section" id="cartItemsSection">
        <div class="cart-items-list" id="cartItemsList"></div>
      </div>

      <!-- Empty Cart -->
      <div class="empty-cart" id="emptyCart" style="display: none;">
        <span class="empty-icon">🛒</span>
        <h2>Your cart is empty</h2>
        <p>Looks like you haven't added anything yet</p>
        <a href="/index.html" class="shop-now-btn">Shop Now →</a>
      </div>

      <!-- Coupon Section -->
      <div class="coupon-section" id="couponSection" style="display: none;">
        <div class="coupon-header">
          <span>🏷️ Apply Coupon</span>
        </div>
        <div class="coupon-input-row">
          <input type="text" id="couponInput" placeholder="Enter coupon code (e.g., SAVE20)" autocomplete="off">
          <button id="applyCouponBtn">Apply</button>
        </div>
        <div class="coupon-message" id="couponMessage"></div>
        <div class="applied-coupon" id="appliedCoupon" style="display: none;">
          <span class="applied-code" id="appliedCode"></span>
          <span class="applied-discount" id="appliedDiscount"></span>
          <button class="remove-coupon" id="removeCouponBtn">✕</button>
        </div>
      </div>

      <!-- Price Summary -->
      <div class="price-summary" id="priceSummary" style="display: none;">
        <h3>Bill Details</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">₹0</span>
        </div>
        <div class="summary-row" id="couponRow" style="display: none;">
          <span style="color:#10b981;">Coupon Discount</span>
          <span style="color:#10b981;" id="couponDiscount">-₹0</span>
        </div>
        <div class="summary-row" id="freeOnionRow" style="display: none;">
          <span>🧅 Free Onion (1kg)</span>
          <span style="color:#10b981;">FREE</span>
        </div>
        <div class="summary-row">
          <span>Delivery Charge</span>
          <span id="deliveryCharge">₹20</span>
        </div>
        <div class="summary-row total-row">
          <span>Total Amount</span>
          <span id="totalAmount">₹0</span>
        </div>
        <div class="delivery-message" id="deliveryMessage"></div>
      </div>

      <!-- Recommended Products -->
      <div class="recommended-section" id="recommendedSection">
        <div class="section-header">
          <h3>❤️ You may also like</h3>
        </div>
        <div class="recommended-slider" id="recommendedSlider">
          <div class="loading-skeleton">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>
      </div>

    </main>

    <!-- ========== STICKY CHECKOUT BAR ========== -->
    <div class="sticky-checkout-bar" id="stickyCheckoutBar" style="display: none;">
      <div class="checkout-bar-inner">
        <div class="checkout-total">
          <span class="total-label">Total</span>
          <span class="total-value" id="barTotal">₹0</span>
        </div>
        <a href="/checkout.html" class="checkout-btn">
          Proceed to Checkout →
        </a>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast-message" id="toastMessage"></div>
    
  </div>

  <script src="/js/firebase.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
