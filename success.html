<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Order Confirmed | OK Mart</title>
  <meta name="theme-color" content="#84c225">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1a1e2b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .success-card{background:white;border-radius:32px;padding:48px 24px;text-align:center;max-width:400px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.05)}
    .success-icon{font-size:5rem;margin-bottom:20px;animation:bounce 1s ease}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    h1{font-size:1.6rem;font-weight:800;margin-bottom:8px}
    p{color:#6b7280;margin-bottom:24px}
    .order-id{background:#f1f5f9;padding:12px 16px;border-radius:12px;font-family:monospace;font-weight:700;color:#5f930e;display:inline-block;margin-bottom:8px}
    .actions{display:flex;flex-direction:column;gap:12px;margin-top:24px}
    .btn{padding:14px 24px;border-radius:40px;font-weight:600;text-decoration:none;display:block;text-align:center}
    .btn-primary{background:#84c225;color:white}
    .btn-secondary{background:#f8fafc;border:1.5px solid #e5e7eb;color:#1a1e2b}
    .track-link{color:#5f930e;font-weight:600;text-decoration:none;margin-top:8px;display:inline-block}
  </style>
</head>
<body>
  <div class="success-card">
    <div class="success-icon">✅</div>
    <h1>Order Placed Successfully!</h1>
    <p>Thank you for shopping with OK Mart</p>
    <div class="order-id" id="orderId">#ORD-XXXX</div>
    <p style="font-size:.85rem;">We'll contact you shortly for confirmation</p>
    <div class="actions">
      <a href="/index.html" class="btn btn-primary">← Continue Shopping</a>
      <a href="/tracking.html" class="btn btn-secondary">📦 Track Your Order</a>
      <a href="#" class="track-link" id="repeatOrder">🔄 Repeat Last Order</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const orderId = params.get('order');
    if (orderId) document.getElementById('orderId').textContent = `#${orderId}`;
    
    document.getElementById('repeatOrder').addEventListener('click', (e) => {
      e.preventDefault();
      const orders = JSON.parse(localStorage.getItem('okmart_orders') || '[]');
      if (orders.length === 0) return alert('No previous order found');
      const last = orders[orders.length - 1];
      const cart = last.items.map(i => ({ ...i, quantity: i.quantity }));
      localStorage.setItem('okmart_cart', JSON.stringify(cart));
      location.href = '/cart.html';
    });
  </script>
</body>
</html>
