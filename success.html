<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Order success · OK Mart</title>
  <link rel="stylesheet" href="css/common.css">
  <!-- success page uses minimal extra style, included in common + small inline ? no, keep modular: we'll link a lightweight success.css -->
  <link rel="stylesheet" href="css/checkout.css"> <!-- reuse some checkout styles, plus success specific -->
  <style>
    /* small exception: success page uses only this block, no other inline, kept inside a separate style block? 
       better move to success.css — we'll create a dedicated success.css file and link it. */
  </style>
  <link rel="stylesheet" href="css/success.css">
</head>
<body>
  <header class="app-header" id="mainHeader">
    <div class="header-container">
      <a href="index.html" class="logo-link">
        <span class="logo-text">🛒 OK Mart</span>
      </a>
      <a href="cart.html" class="cart-icon-link" aria-label="cart">
        <span class="cart-icon">🛍️</span>
        <span class="cart-badge" id="cartCountPlaceholder">0</span>
      </a>
    </div>
  </header>

  <main class="success-main">
    <div class="success-card">
      <div class="success-icon">✅</div>
      <h1 class="success-title">order confirmed!</h1>
      <p class="success-message">thank you for shopping with OK Mart.<br>your groceries will arrive soon.</p>
      <a href="index.html" class="btn-primary continue-shopping">continue shopping</a>
    </div>
  </main>

  <!-- no sticky bar on success page? still include for consistency but can be hidden -->
  <div class="sticky-bottom-bar">
    <div class="bottom-bar-inner">
      <span class="delivery-message">🚀 delivery in 10 mins</span>
      <span class="min-order">min order ₹99</span>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    // minimal success script: just clear cart count etc? (optional)
    // page-specific logic in separate file if needed.
  </script>
</body>
</html>
