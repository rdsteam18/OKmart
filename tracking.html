<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no">
  
  <title>Track Your Order | OK Mart</title>
  <meta name="description" content="Track your OK Mart grocery order status. Enter phone number or order ID.">
  <meta name="theme-color" content="#2ecc71">
  
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/tracking.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- ========== HEADER ========== -->
    <header class="tracking-header">
      <div class="header-inner">
        <a href="/index.html" class="back-btn">←</a>
        <h1 class="header-title">Track Your Order</h1>
        <span></span>
      </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="tracking-main">
      
      <!-- Search Section -->
      <div class="search-section">
        <div class="search-icon-large">📦</div>
        <h2>Track Your Order</h2>
        <p>Enter your phone number or order ID to check status</p>
        
        <div class="search-input-group">
          <input 
            type="text" 
            id="trackInput" 
            class="track-input" 
            placeholder="Phone number or Order ID (e.g., ORD-XXX)"
            autocomplete="off"
          >
          <button class="track-btn" id="trackBtn">
            <span id="trackBtnText">🔍 Track Order</span>
            <span class="btn-spinner" id="trackSpinner" style="display: none;"></span>
          </button>
        </div>
        
        <p class="search-hint">Try: 9876543210 or ORD-XXXXXX</p>
      </div>

      <!-- Loading State -->
      <div class="loading-state" id="loadingState" style="display: none;">
        <div class="spinner"></div>
        <p>Searching for your order...</p>
      </div>

      <!-- Single Order Result -->
      <div class="order-result" id="singleOrderResult" style="display: none;"></div>

      <!-- Multiple Orders -->
      <div class="multiple-orders" id="multipleOrders" style="display: none;">
        <h3>📋 Orders Found</h3>
        <div class="order-list" id="orderList"></div>
      </div>

      <!-- No Results -->
      <div class="no-result" id="noResult" style="display: none;">
        <span class="no-result-icon">🔍</span>
        <h3>No order found</h3>
        <p>We couldn't find any order with this information</p>
        <button class="retry-btn" onclick="document.getElementById('trackInput').focus()">Try Again</button>
      </div>

      <!-- Recent Orders (from localStorage) -->
      <div class="recent-orders-section" id="recentOrdersSection">
        <h3>📋 Your Recent Orders</h3>
        <div class="recent-orders-list" id="recentOrdersList">
          <p class="no-orders-text" id="noRecentOrders">No recent orders on this device</p>
        </div>
      </div>

    </main>

    <!-- Toast -->
    <div class="toast-message" id="toastMessage"></div>
    
  </div>

  <script src="/js/firebase.js"></script>
  <script src="/js/tracking.js"></script>
</body>
</html>
