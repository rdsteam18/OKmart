<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Search Products | OK Mart</title>
  <meta name="theme-color" content="#2ecc71">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/search.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1a1e2b;min-height:100vh}
    .container{max-width:480px;margin:0 auto;padding:0 16px 100px}
    .search-header{display:flex;align-items:center;gap:8px;padding:10px 0;position:sticky;top:0;background:#f8fafc;z-index:10}
    .back-btn{width:40px;height:40px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.5rem;border:1px solid #e5e7eb;flex-shrink:0}
    .search-input-wrapper{flex:1;position:relative}
    .search-input-wrapper input{width:100%;padding:14px 40px 14px 16px;border:1.5px solid #e5e7eb;border-radius:30px;font-size:.95rem}
    .search-input-wrapper input:focus{outline:none;border-color:#2ecc71}
    .clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:1.1rem;cursor:pointer;display:none}
    .results-header{padding:16px 0;display:flex;justify-content:space-between;align-items:baseline}
    .results-header h2{font-size:1.1rem}
    .results-count{color:#6b7280;font-size:.85rem}
    .product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .empty-state{text-align:center;padding:60px 20px}
    .empty-state span{font-size:3rem;opacity:.5;display:block;margin-bottom:16px}
    .browse-btn{display:inline-block;margin-top:20px;background:#2ecc71;color:white;padding:12px 24px;border-radius:40px;text-decoration:none;font-weight:600}
    .loading{text-align:center;padding:40px;color:#6b7280}
    .spinner{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#2ecc71;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="container">
    <div class="search-header">
      <a href="/index.html" class="back-btn">←</a>
      <div class="search-input-wrapper">
        <input type="text" id="searchInput" placeholder="Search products..." autocomplete="off" autofocus>
        <button class="clear-btn" id="clearBtn">✕</button>
      </div>
    </div>
    
    <div class="loading" id="loading"><div class="spinner"></div><p>Searching...</p></div>
    
    <div id="resultsContent" style="display:none;">
      <div class="results-header"><h2 id="resultsTitle">Search Results</h2><span class="results-count" id="resultsCount">0 items</span></div>
      <div class="product-grid" id="productGrid"></div>
    </div>
    
    <div class="empty-state" id="emptyState" style="display:none;">
      <span>🔍</span><h2>No products found</h2><p>Try searching with a different term</p>
      <a href="/index.html" class="browse-btn">Browse All Products →</a>
    </div>
  </div>

  <script src="/js/firebase.js"></script>
  <script src="/js/common.js"></script>
  <script>
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    let allProducts = [];
    let searchTimeout;
    
    // Load all products for client-side search
    async function loadAllProducts() {
      const snapshot = await db.collection('products').get();
      allProducts = [];
      snapshot.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));
    }
    
    function performSearch(query) {
      searchInput.value = query;
      clearBtn.style.display = query ? 'block' : 'none';
      
      if (!query || query.length < 2) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('resultsContent').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      
      document.getElementById('loading').style.display = 'block';
      document.getElementById('resultsContent').style.display = 'none';
      document.getElementById('emptyState').style.display = 'none';
      
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const q = query.toLowerCase();
        const results = allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.category && p.category.toLowerCase().includes(q)));
        
        document.getElementById('loading').style.display = 'none';
        
        if (results.length === 0) {
          document.getElementById('emptyState').style.display = 'block';
          return;
        }
        
        document.getElementById('resultsContent').style.display = 'block';
        document.getElementById('resultsCount').textContent = `${results.length} item${results.length !== 1 ? 's' : ''}`;
        document.getElementById('resultsTitle').textContent = `Results for "${query}"`;
        
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        results.slice(0, 20).forEach(p => grid.appendChild(window.OKMart.renderProductCard(p)));
      }, 300);
    }
    
    searchInput.addEventListener('input', e => performSearch(e.target.value));
    clearBtn.addEventListener('click', () => { searchInput.value = ''; clearBtn.style.display = 'none'; searchInput.focus(); });
    
    // Check URL params
    const params = new URLSearchParams(location.search);
    const urlQuery = params.get('query');
    
    async function init() {
      await loadAllProducts();
      if (urlQuery) performSearch(urlQuery);
      else document.getElementById('loading').style.display = 'none';
    }
    init();
  </script>
</body>
</html>
