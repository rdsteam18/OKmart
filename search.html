<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Search | OK Mart</title>
  <meta name="theme-color" content="#2ecc71">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/search.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-container">
        <a href="/index.html" class="back-button">
          <span class="back-icon">←</span>
        </a>
        <div class="search-wrapper-header">
          <span class="search-icon-header">🔍</span>
          <input type="text" id="headerSearchInput" class="header-search-input" placeholder="Search products..." autocomplete="off">
          <button class="clear-search-header" id="clearHeaderSearch">✕</button>
        </div>
        <a href="/cart.html" class="cart-icon-link">
          <span class="cart-icon">🛒</span>
          <span class="cart-badge" id="cartCountPlaceholder">0</span>
        </a>
      </div>
    </header>

    <main class="search-main">
      <div class="results-header">
        <h2 id="searchTitle">Search Results</h2>
        <span id="resultCount">0 items</span>
      </div>
      
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>Searching...</p>
      </div>
      
      <div class="product-grid" id="searchResultsGrid"></div>
      
      <div class="empty-state" id="emptyState" style="display: none;">
        <span class="empty-icon">🔍</span>
        <h3>No products found</h3>
        <p>Try searching with a different term</p>
        <a href="/index.html" class="browse-btn">Browse All Products</a>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="/index.html" class="nav-item">🏠<span>Home</span></a>
      <a href="/search.html" class="nav-item active">🔍<span>Search</span></a>
      <a href="/offers.html" class="nav-item">🏷️<span>Offers</span></a>
      <a href="/orders.html" class="nav-item">📋<span>Orders</span></a>
      <a href="/cart.html" class="nav-item">🛒<span>Cart</span></a>
    </nav>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
