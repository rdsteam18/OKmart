<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Search Products | OK Mart</title>
  <meta name="description" content="Search for fresh fruits, vegetables, dairy, snacks, beverages and household products on OK Mart.">
  <meta name="theme-color" content="#006b22">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/a/AVvXsEjqUODVL4iyLalUMIzsfwPSpjOSA_8OEz7zn7WiCOxVySl8TqcLxulYNt7tBT9C85tto_EoafNkIMbgV1AMPkOJjkeZ52VLY5PR02z06GFwwFPb9WQBAun4WHcd3JB2Heky3Q2WdDGPy8DGZn7suo0_8RdY7Wd7i7wTMA4osYIiL6NZ1CbuPJHGzmeX">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/search.css">
  <link rel="stylesheet" href="/css/qc.css">
</head>
<body class="search-page">
  <div class="app-container">

    <!-- ========== SEARCH TOP HEADER (IMAGE 3 & 4) ========== -->
    <header class="search-top-header">
      <button class="search-back-btn" onclick="if(history.length>1){history.back();}else{location.href='/';}" aria-label="Back">
        <span>←</span>
      </button>
      <div class="search-input-pill">
        <span class="search-pill-icon">🔍</span>
        <input type="text" id="searchInput" class="search-main-input" placeholder="Search in OKmart" autocomplete="off" autofocus>
        <button class="clear-search-icon-btn" id="clearSearchBtn" aria-label="Clear">✕</button>
        <button class="mic-search-icon-btn" id="voiceSearchBtn" aria-label="Voice Search">🎙️</button>
      </div>
    </header>

    <!-- ========== LIVE SEARCH DROPDOWN SUGGESTIONS (IMAGE 4) ========== -->
    <div class="live-suggestions-container" id="liveSuggestionsContainer" style="display: none;">
      <div id="suggestionsList"></div>
    </div>

    <!-- ========== DEFAULT SEARCH CONTENT (WHEN NOT TYPING) ========== -->
    <div id="defaultSearchContent">

      <!-- 1. Past Searches (Image 3) -->
      <section class="past-searches-section" id="pastSearchesSection">
        <div class="section-title-row">
          <h2 class="section-main-title">Past searches</h2>
          <button class="section-link-action" id="clearPastSearchesBtn">Clear</button>
        </div>
        <div class="past-chips-row" id="pastChipsContainer">
          <!-- Populated from localStorage -->
          <div class="past-search-chip" onclick="executeSearch('santoor soap')">santoor soap</div>
          <div class="past-search-chip" onclick="executeSearch('madhur sugar')">madhur sugar</div>
          <div class="past-search-chip" onclick="executeSearch('jasmine hair oil')">jasmine hair oil</div>
          <div class="past-search-chip" onclick="executeSearch('milk')">milk</div>
        </div>
      </section>

      <!-- 2. Your Quick Picks (Image 3 & 4) -->
      <section class="search-shelf-section" id="quickPicksSection">
        <div class="section-title-row">
          <h2 class="section-main-title">Your quick picks</h2>
          <a href="/categories/all.html" class="section-link-action">View all</a>
        </div>
        <div class="shelf-horizontal-scroll" id="quickPicksScroll">
          <!-- Skeleton while loading -->
        </div>
      </section>

      <!-- 3. Trending Today (Image 3) -->
      <section class="search-shelf-section" id="trendingSection">
        <div class="section-title-row">
          <h2 class="section-main-title">Trending today</h2>
          <a href="/categories/all.html" class="section-link-action">View all</a>
        </div>
        <div class="shelf-horizontal-scroll" id="trendingScroll">
          <!-- Skeleton while loading -->
        </div>
      </section>

    </div>

    <!-- ========== SEARCH RESULTS GRID (WHEN QUERY SUBMITTED) ========== -->
    <div class="search-results-section" id="searchResultsSection" style="display: none;">
      <div class="section-title-row" style="margin-bottom: 12px;">
        <h2 class="section-main-title" id="resultsTitle">Search Results</h2>
        <span style="font-size: 0.8rem; font-weight: 600; color: #6b7280;" id="resultsCount">0 products</span>
      </div>
      <div class="search-results-grid" id="searchResultsGrid">
        <!-- Search cards inserted here -->
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-message" id="toastMessage" style="position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:8px 16px; border-radius:20px; font-size:0.8rem; font-weight:600; z-index:200; display:none;"></div>

    <!-- Floating Bottom Navigation (Search is reached via the search pill;
         the four tabs are Home / Categories / Buy Again / Basket) -->
    <nav class="qc-bottom-nav">
      <a href="/index.html" class="qc-nav-item">
        <span class="qc-nav-icon"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5.5h5V20"/></svg></span>
        <span>Home</span>
      </a>
      <a href="/categories.html" class="qc-nav-item">
        <span class="qc-nav-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>
        <span>Categories</span>
      </a>
      <a href="/buy-again.html" class="qc-nav-item">
        <span class="qc-nav-icon"><svg viewBox="0 0 24 24"><path d="M5.5 8h13l-1 12h-11L5.5 8Z"/><path d="M9 10.5V6.5a3 3 0 0 1 6 0v4"/><path d="M17.5 4.5a3.2 3.2 0 1 1-2.4 1.1"/><path d="M17.6 2.6v1.9h-1.9"/></svg></span>
        <span>Buy Again</span>
      </a>
      <a href="/cart.html" class="qc-nav-item">
        <span class="qc-nav-icon"><svg viewBox="0 0 24 24"><path d="M5.5 8h13l-1 12h-11L5.5 8Z"/><path d="M9 10.5V6.5a3 3 0 0 1 6 0v4"/></svg></span>
        <span>Basket</span>
        <span class="qc-nav-badge" id="bottomNavCartCount">0</span>
      </a>
    </nav>

  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/search.js"></script>
  <script src="/js/qc-nav.js"></script>
</body>
</html>
