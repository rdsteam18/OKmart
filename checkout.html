<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Checkout · OK Mart</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/checkout.css">
</head>
<body>
  <header class="app-header" id="mainHeader">
    <div class="header-container">
      <a href="index.html" class="logo-link">
        <span class="logo-text">🛒 OK Mart</span>
      </a>
      <a href="cart.html" class="cart-icon-link" aria-label="cart">
        <span class="cart-icon">🛍️</span>
        <span class="cart-badge" id="cartCountPlaceholder">0</span>
      </a>
    </div>
  </header>

  <main class="checkout-main">
    <h1 class="page-title">checkout</h1>
    <!-- delivery form + payment placeholder -->
    <form id="checkoutForm" class="checkout-form">
      <fieldset class="address-fieldset">
        <legend>📍 delivery address</legend>
        <div class="input-group">
          <label for="fullName">full name</label>
          <input type="text" id="fullName" placeholder="e.g., Riya Sharma" required>
        </div>
        <div class="input-group">
          <label for="mobile">mobile number</label>
          <input type="tel" id="mobile" placeholder="9876543210" required>
        </div>
        <div class="input-group">
          <label for="address">street / locality</label>
          <textarea id="address" rows="2" placeholder="house no, area" required></textarea>
        </div>
        <div class="input-group">
          <label for="pincode">pincode</label>
          <input type="text" id="pincode" placeholder="110001" required>
        </div>
      </fieldset>

      <div class="payment-section">
        <h3 class="payment-heading">💳 payment method</h3>
        <div class="payment-options">
          <label class="radio-card">
            <input type="radio" name="payment" value="cod" checked> cash on delivery
          </label>
          <label class="radio-card">
            <input type="radio" name="payment" value="upi"> UPI / card (demo)
          </label>
        </div>
      </div>

      <div class="order-summary-mini" id="checkoutSummary">
        <!-- summary injected by checkout.js -->
      </div>

      <button type="submit" class="btn-primary place-order-btn">place order →</button>
    </form>
  </main>

  <div class="sticky-bottom-bar">
    <div class="bottom-bar-inner">
      <span class="delivery-message">🚀 delivery in 10 mins</span>
      <span class="min-order">min order ₹99</span>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
