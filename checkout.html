<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Checkout | OK Mart</title>
  <meta name="theme-color" content="#2ecc71">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/checkout.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-container">
        <a href="/cart.html" class="back-button">
          <span class="back-icon">←</span>
        </a>
        <h1 class="page-title">Checkout</h1>
        <div class="header-spacer"></div>
      </div>
    </header>

    <main class="checkout-main">
      <!-- Delivery Address Card -->
      <div class="address-card">
        <div class="address-header">
          <span class="address-icon">📍</span>
          <h3>Delivery Address</h3>
          <a href="/profile.html" class="change-btn">Change</a>
        </div>
        <div class="address-content" id="deliveryAddress">
          <p class="address-name" id="displayName">Loading...</p>
          <p class="address-phone" id="displayPhone"></p>
          <p class="address-full" id="displayAddress"></p>
          <p class="address-pincode" id="displayPincode"></p>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="order-summary-card">
        <div class="summary-header">
          <h3>Order Summary</h3>
          <button class="view-items-btn" id="viewItemsToggle">View Items ▼</button>
        </div>
        <div class="order-items-list" id="orderItemsList"></div>
        
        <div class="price-breakdown">
          <div class="price-row">
            <span>Subtotal</span>
            <span id="checkoutSubtotal">₹0</span>
          </div>
          <div class="price-row" id="couponRow" style="display: none;">
            <span>Coupon Discount</span>
            <span class="discount-value" id="couponDiscount">-₹0</span>
          </div>
          <div class="price-row">
            <span>Delivery</span>
            <span id="checkoutDelivery">₹20</span>
          </div>
          <div class="price-row total-row">
            <span>Total</span>
            <span id="checkoutTotal">₹0</span>
          </div>
        </div>
      </div>

      <!-- Payment Method -->
      <div class="payment-card">
        <h3>Payment Method</h3>
        <label class="payment-option">
          <input type="radio" name="payment" value="cod" checked>
          <span class="payment-label">💵 Cash on Delivery</span>
        </label>
        <label class="payment-option">
          <input type="radio" name="payment" value="upi">
          <span class="payment-label">📱 UPI / Card</span>
        </label>
      </div>

      <!-- Coupon Section -->
      <div class="coupon-card">
        <div class="coupon-input-wrapper">
          <input type="text" id="couponInput" placeholder="Enter coupon code" autocomplete="off">
          <button id="applyCouponBtn">Apply</button>
        </div>
        <div class="coupon-message" id="couponMessage"></div>
      </div>
    </main>

    <div class="sticky-checkout-bar">
      <div class="checkout-bar-inner">
        <div class="total-info">
          <span class="total-label">Total</span>
          <span class="total-value" id="stickyTotal">₹0</span>
        </div>
        <button class="place-order-btn" id="placeOrderBtn">Place Order →</button>
      </div>
    </div>

    <div class="toast-message" id="toastMessage"></div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
