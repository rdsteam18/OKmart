<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no">
  
  <title>Checkout | OK Mart</title>
  <meta name="description" content="Complete your order at OK Mart. Fast grocery delivery.">
  <meta name="theme-color" content="#2ecc71">
  
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/checkout.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- ========== HEADER ========== -->
    <header class="checkout-header">
      <div class="header-inner">
        <a href="/cart.html" class="back-btn">←</a>
        <h1 class="header-title">Checkout</h1>
        <span class="step-indicator">1/2</span>
      </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="checkout-main">
      
      <!-- User Details Section -->
      <div class="section-card" id="userDetailsSection">
        <div class="section-header">
          <h2>👤 Delivery Details</h2>
          <button class="edit-toggle-btn" id="editDetailsToggle">
            <span id="editToggleText">Edit</span>
          </button>
        </div>
        
        <!-- Display Mode -->
        <div class="details-display" id="detailsDisplay">
          <div class="detail-row"><span class="detail-icon">👤</span><span class="detail-value" id="displayName">-</span></div>
          <div class="detail-row"><span class="detail-icon">📱</span><span class="detail-value" id="displayPhone">-</span></div>
          <div class="detail-row"><span class="detail-icon">🏠</span><span class="detail-value" id="displayAddress">-</span></div>
          <div class="detail-row"><span class="detail-icon">📮</span><span class="detail-value" id="displayPincode">-</span></div>
        </div>
        
        <!-- Edit Mode (hidden by default) -->
        <div class="details-edit" id="detailsEdit" style="display: none;">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="editName" placeholder="Your full name" required>
          </div>
          <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" id="editPhone" placeholder="10-digit number" maxlength="10" required>
          </div>
          <div class="form-group">
            <label>Delivery Address *</label>
            <textarea id="editAddress" placeholder="House/Flat No., Street, Area, City" rows="2" required></textarea>
          </div>
          <div class="form-group">
            <label>Pincode *</label>
            <input type="text" id="editPincode" placeholder="6-digit pincode" maxlength="6" required>
          </div>
          <button class="save-details-btn" id="saveDetailsBtn">Save Details</button>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="section-card">
        <h2>🛒 Order Summary</h2>
        <div class="order-items-list" id="orderItemsList"></div>
        
        <div class="price-breakdown">
          <div class="price-row">
            <span>Subtotal</span>
            <span id="summarySubtotal">₹0</span>
          </div>
          <div class="price-row" id="couponRow" style="display: none;">
            <span style="color:#10b981;">Coupon Discount</span>
            <span style="color:#10b981;" id="summaryCouponDiscount">-₹0</span>
          </div>
          <div class="price-row" id="freeOnionRow" style="display: none;">
            <span>🧅 Free Onion (1kg)</span>
            <span style="color:#10b981;">FREE</span>
          </div>
          <div class="price-row">
            <span>Delivery</span>
            <span id="summaryDelivery">₹20</span>
          </div>
          <div class="price-row total-row">
            <span>Total</span>
            <span id="summaryTotal">₹0</span>
          </div>
        </div>

        <div class="delivery-estimate">
          <span>🚚</span> Estimated delivery: <strong>10-15 mins</strong>
        </div>
      </div>

      <!-- Applied Coupon -->
      <div class="section-card" id="appliedCouponCard" style="display: none;">
        <div class="coupon-info">
          <span>🏷️ Coupon Applied:</span>
          <span class="coupon-code-label" id="checkoutCouponCode"></span>
          <span class="coupon-savings" id="checkoutCouponSavings"></span>
        </div>
      </div>

      <!-- Add More Items (Upsell) -->
      <div class="section-card">
        <h2>➕ Add More Items</h2>
        <div class="upsell-slider" id="upsellSlider">
          <div class="loading-skeleton">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>
      </div>

    </main>

    <!-- ========== STICKY PLACE ORDER BAR ========== -->
    <div class="sticky-order-bar">
      <div class="order-bar-inner">
        <div class="order-total-info">
          <span class="total-label">Total</span>
          <span class="total-value" id="barTotal">₹0</span>
        </div>
        <button class="place-order-btn" id="placeOrderBtn">
          <span id="placeOrderText">Place Order →</span>
          <span class="loading-spinner" id="orderSpinner" style="display: none;"></span>
        </button>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast-message" id="toastMessage"></div>
    
  </div>

  <script src="/js/firebase.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
