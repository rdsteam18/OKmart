<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - OK Mart</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div>Checkout</div>
</header>

<div style="padding:10px;">

    <!-- USER INPUT -->
    <input id="name" placeholder="Name"><br><br>
    <input id="phone" placeholder="Phone"><br><br>
    <textarea id="address" placeholder="Address"></textarea><br><br>
    <input id="pincode" placeholder="Pincode"><br><br>

    <button onclick="placeOrder()">Place Order</button>

</div>

<script src="js/main.js"></script>
<script src="js/checkout.js"></script>

<script>

/* =========================
   AUTO FILL USER DATA
========================= */
window.onload = function () {
    let user = JSON.parse(localStorage.getItem("user"));

    if (user) {
        document.getElementById("name").value = user.name;
        document.getElementById("phone").value = user.phone;
        document.getElementById("address").value = user.address;
        document.getElementById("pincode").value = user.pincode;
    }
};

/* =========================
   PLACE ORDER (MAIN LOGIC)
========================= */

function placeOrder() {

    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let address = document.getElementById("address").value;
    let pincode = document.getElementById("pincode").value;

    // Basic validation
    if (!name || !phone || !address || !pincode) {
        alert("Fill all details ❌");
        return;
    }

    // PIN CHECK
    const allowed = ["400052","400051"];

    if (!allowed.includes(pincode)) {
        alert("Delivery not available ❌");
        return;
    }

    // SAVE USER
    let user = {name, phone, address, pincode};
    localStorage.setItem("user", JSON.stringify(user));

    // GET CART
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
        alert("Cart empty ❌");
        return;
    }

    // CALCULATE TOTAL
    let total = 0;
    let itemsText = "";

    cart.forEach(item => {
        total += item.price * item.qty;
        itemsText += `${item.name} x${item.qty}\n`;
    });

    let delivery = total >= 300 ? 0 : 20;
    let grandTotal = total + delivery;

    // SAVE LAST ORDER
    localStorage.setItem("lastOrder", JSON.stringify(cart));

    /* =========================
       WHATSAPP
    ========================= */

    let msg = `🛒 OK Mart Order

Name: ${name}
Phone: ${phone}
Address: ${address}
Pincode: ${pincode}

Items:
${itemsText}

Total: ₹${grandTotal}`;

    let url = `https://wa.me/9982239821?text=${encodeURIComponent(msg)}`;

    window.open(url, "_blank");

    /* =========================
       SUCCESS
    ========================= */

    alert("Order placed ✅");

    localStorage.removeItem("cart");

    window.location.href = "success.html";
}

</script>

</body>
</html>
