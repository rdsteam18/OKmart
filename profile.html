<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>My Profile | OK Mart</title>
  <meta name="theme-color" content="#2ecc71">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1a1e2b;min-height:100vh}
    .container{max-width:480px;margin:0 auto;padding:0 16px 100px}
    .header{display:flex;align-items:center;gap:12px;padding:12px 0}
    .back-btn{width:40px;height:40px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.5rem;border:1px solid #e5e7eb}
    h1{font-size:1.3rem;font-weight:700}
    .profile-card{background:linear-gradient(135deg,#2ecc71,#27ae60);border-radius:24px;padding:20px;margin:16px 0;display:flex;align-items:center;gap:14px;color:white}
    .avatar{width:60px;height:60px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem}
    .profile-info{flex:1}
    .profile-name{font-size:1.2rem;font-weight:700}
    .profile-phone{font-size:.85rem;opacity:.9}
    .menu-section{background:white;border-radius:20px;overflow:hidden;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
    .menu-item{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;text-decoration:none;color:#1a1e2b;border-bottom:1px solid #f1f5f9;transition:background .15s}
    .menu-item:last-child{border-bottom:none}
    .menu-item:active{background:#f8fafc}
    .menu-left{display:flex;align-items:center;gap:12px}
    .menu-icon{font-size:1.3rem}
    .menu-label{font-weight:500}
    .menu-badge{background:#2ecc71;color:white;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600}
    .menu-arrow{color:#6b7280}
    .logout-btn{width:100%;padding:16px;background:white;border:1.5px solid #fee2e2;border-radius:20px;color:#dc2626;font-weight:600;cursor:pointer;margin-top:8px}
    .version{text-align:center;color:#6b7280;font-size:.75rem;padding:20px 0}
    .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:40px;font-weight:500;z-index:999;opacity:0;transition:.3s;white-space:nowrap}
    .toast.show{opacity:1}
    .toast.success{background:#10b981;color:white}
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><a href="/index.html" class="back-btn">←</a><h1>My Profile</h1></div>
    
    <div class="profile-card">
      <div class="avatar" id="avatarIcon">👤</div>
      <div class="profile-info">
        <div class="profile-name" id="profileName">Guest User</div>
        <div class="profile-phone" id="profilePhone">Add phone number</div>
      </div>
    </div>
    
    <div class="menu-section">
      <a href="/orders.html" class="menu-item">
        <div class="menu-left"><span class="menu-icon">📋</span><span class="menu-label">Your Orders</span></div>
        <span class="menu-badge" id="ordersBadge">0</span>
      </a>
      <a href="/wishlist.html" class="menu-item">
        <div class="menu-left"><span class="menu-icon">❤️</span><span class="menu-label">Wishlist</span></div>
        <span class="menu-badge" id="wishlistBadge">0</span>
      </a>
      <a href="/tracking.html" class="menu-item">
        <div class="menu-left"><span class="menu-icon">📦</span><span class="menu-label">Track Order</span></div>
        <span class="menu-arrow">›</span>
      </a>
      <a href="/offers.html" class="menu-item">
        <div class="menu-left"><span class="menu-icon">🏷️</span><span class="menu-label">Offers & Deals</span></div>
        <span class="menu-arrow">›</span>
      </a>
      <div class="menu-item" onclick="openWhatsApp()">
        <div class="menu-left"><span class="menu-icon">💬</span><span class="menu-label">Help & Support</span></div>
        <span class="menu-arrow">›</span>
      </div>
      <a href="/terms.html" class="menu-item">
        <div class="menu-left"><span class="menu-icon">📄</span><span class="menu-label">Terms & Conditions</span></div>
        <span class="menu-arrow">›</span>
      </a>
    </div>
    
    <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    <p class="version">OK Mart v2.0 · Firebase Powered</p>
  </div>

  <div class="toast" id="toastMessage"></div>

  <script src="/js/common.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('okmart_user') || '{}');
    document.getElementById('profileName').textContent = user.name || 'Guest User';
    document.getElementById('profilePhone').textContent = user.phone ? `+91 ${user.phone}` : 'Add phone number';
    document.getElementById('avatarIcon').textContent = (user.name || 'G').charAt(0).toUpperCase();
    
    document.getElementById('ordersBadge').textContent = JSON.parse(localStorage.getItem('okmart_orders') || '[]').length;
    document.getElementById('wishlistBadge').textContent = window.OKMart.getWishlist().length;
    
    function openWhatsApp() {
      window.open('https://wa.me/919982239821?text=Hello%20OK%20Mart,%20I%20need%20help.', '_blank');
    }
    
    function logout() {
      if (confirm('Clear your profile data?')) {
        localStorage.removeItem('okmart_user');
        location.reload();
      }
    }
  </script>
</body>
</html>
