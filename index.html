<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>OK Mart | Fresh Grocery Delivery</title>
  <meta name="description" content="Order fresh groceries online - milk, bread, fruits, vegetables. Fast delivery.">
  <meta name="theme-color" content="#2ecc71">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/home.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-container">
        <a href="/index.html" class="logo-link"><span class="logo-text">🛒 OK Mart</span><span class="delivery-tag">10 min</span></a>
        <div class="header-actions">
          <a href="/profile.html" class="icon-link">👤</a>
          <a href="/cart.html" class="cart-icon-link"><span class="cart-icon">🛒</span><span class="cart-badge" id="cartCountPlaceholder">0</span></a>
        </div>
      </div>
    </header>

    <main class="home-main">
      <div class="search-container">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search for milk, bread, snacks..." autocomplete="off">
        </div>
      </div>

      <div class="banner-container">
        <a href="/offers.html" class="banner-link">
          <img src="https://images.pexels.com/photos/5650026/pexels-photo-5650026.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Offers" class="banner-image">
          <div class="banner-overlay"><span class="banner-tag">🔥 Limited Time</span><span class="banner-text">Up to 30% OFF</span></div>
        </a>
      </div>

      <section class="category-section">
        <h2 class="section-title">📂 Shop by Category</h2>
        <div class="category-grid" id="categoryGrid">
          <a href="/categories/dairy.html" class="category-item"><span class="category-emoji">🥛</span><span>Dairy</span></a>
          <a href="/categories/fruits.html" class="category-item"><span class="category-emoji">🍎</span><span>Fruits</span></a>
          <a href="/categories/vegetables.html" class="category-item"><span class="category-emoji">🥕</span><span>Vegetables</span></a>
          <a href="/categories/snacks.html" class="category-item"><span class="category-emoji">🍿</span><span>Snacks</span></a>
          <a href="/categories/beverages.html" class="category-item"><span class="category-emoji">🥤</span><span>Drinks</span></a>
          <a href="/categories/grocery.html" class="category-item"><span class="category-emoji">🧺</span><span>Grocery</span></a>
          <a href="/categories/electronics.html" class="category-item"><span class="category-emoji">📱</span><span>Electronics</span></a>
          <a href="/offers.html" class="category-item highlight"><span class="category-emoji">🏷️</span><span>Offers</span></a>
        </div>
      </section>

      <section class="products-section">
        <h2 class="section-title">🛒 All Products</h2>
        <div class="product-grid" id="productGrid"><div class="loading-state"><div class="spinner"></div><p>Loading products...</p></div></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="/index.html" class="nav-item active">🏠<span>Home</span></a>
      <a href="/search.html" class="nav-item">🔍<span>Search</span></a>
      <a href="/offers.html" class="nav-item">🏷️<span>Offers</span></a>
      <a href="/tracking.html" class="nav-item">📦<span>Track</span></a>
      <a href="/cart.html" class="nav-item">🛒<span>Cart</span></a>
    </nav>

    <div class="bottom-cart-bar" id="bottomCartBar" style="display:none;">
      <div class="cart-bar-content">
        <div class="cart-info"><span>🛒</span><span id="bottomCartCount">0 items</span></div>
        <a href="/cart.html" class="checkout-btn">View Cart · <span id="bottomCartTotal">₹0</span></a>
      </div>
    </div>

    <a href="https://wa.me/919982239821" class="fab-whatsapp" target="_blank">💬</a>
    <a href="tel:+919982239821" class="fab-call">📞</a>
    <div class="toast-message" id="toastMessage"></div>
  </div>

  <script src="/js/firebase.js"></script>
  <script src="/js/common.js"></script>
  <script>
    // Load products from Firebase
    async function loadProducts() {
      const grid = document.getElementById('productGrid');
      try {
        const snapshot = await db.collection('products').limit(20).get();
        grid.innerHTML = '';
        if (snapshot.empty) { grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:40px;">No products available</p>'; return; }
        snapshot.forEach(doc => {
          const p = { id: doc.id, ...doc.data() };
          grid.appendChild(window.OKMart.renderProductCard(p));
        });
      } catch (err) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:40px;color:#ef4444;">Failed to load products</p>';
      }
    }
    
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') { const q = e.target.value.trim(); if (q) location.href = `/search.html?query=${encodeURIComponent(q)}`; }
    });
    
    loadProducts();
    window.OKMart.updateCartUI();
  </script>
</body>
</html>
