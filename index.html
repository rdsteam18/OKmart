    "geo": {

    },
    "openingHoursSpecification": {

      "dayOfWeek": [
        "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"
      ],

    },
    "sameAs": [
      "https://www.instagram.com/okmart",
      "https://wa.me/919982239821"
    ],
    "priceRange": "₹",
    "currenciesAccepted": "INR",
    "paymentAccepted": "Cash, UPI, Card",
    "areaServed": "Your City, Your Area",
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Grocery Delivery Services",
      "itemListElement": [
        {
          "@type": "Offer",
          "itemOffered": {

</head>
<body>
  <!-- STICKY HEADER -->
  <header class="app-header" id="mainHeader">
    <div class="header-container">
      <a href="/index.html" class="logo-link" aria-label="OK Mart Home">
        <span class="logo-text">🛒 OK Mart</span>
      </a>
      <a href="/cart.html" class="cart-icon-link" id="cartIcon" aria-label="View Cart">
        <span class="cart-icon">🛍️</span>
        <span class="cart-badge" id="cartCountPlaceholder">0</span>
      </a>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="home-main">
    <!-- Search Bar -->
    <div class="search-container">
      <div class="search-wrapper">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search for milk, snacks, atta..."
          autocomplete="off"
          aria-label="Search products"
        >
        <button class="clear-search" id="clearSearchBtn" aria-label="Clear search">✕</button>
      </div>
    </div>

    <!-- Category Navigation Grid -->
    <section class="category-nav-section" aria-label="Shop by category">
      <!-- Group 1: Fruits & Vegetables -->
      <div class="category-group">
        <div class="group-header">
          <h2 class="group-title">🍎 Fruits & Vegetables</h2>
          <a href="#" class="view-all-link" data-category="fruits">View All →</a>
        </div>
        <div class="category-grid" id="fruitsVegGrid"></div>
      </div>

      <!-- Group 2: Dairy & Bakery -->
      <div class="category-group">
        <div class="group-header">
          <h2 class="group-title">🥛 Dairy & Bakery</h2>
          <a href="/categories/dairy.html" class="view-all-link">View All →</a>
        </div>
        <div class="category-grid" id="dairyBakeryGrid"></div>
      </div>

      <!-- Group 3: Snacks & Packaged -->
      <div class="category-group">
        <div class="group-header">
          <h2 class="group-title">🍿 Snacks & Packaged</h2>
          <a href="/categories/snacks.html" class="view-all-link">View All →</a>
        </div>
        <div class="category-grid" id="snacksPackagedGrid"></div>
      </div>

      <!-- Group 4: Grocery Staples -->
      <div class="category-group">
        <div class="group-header">
          <h2 class="group-title">🧺 Grocery Staples</h2>
          <a href="/categories/grocery.html" class="view-all-link">View All →</a>
        </div>
        <div class="category-grid" id="groceryStaplesGrid"></div>
      </div>
    </section>

    <!-- Quick Order Section -->
    <section class="quick-order-section" aria-label="Daily essentials quick order">
      <div class="section-header">
        <h2 class="section-title">⚡ Daily Essentials</h2>
        <span class="quick-badge">Quick Add</span>
      </div>
      <div class="quick-order-grid" id="quickOrderGrid"></div>
    </section>

    <!-- Results Info -->
    <div class="results-info" id="resultsInfo">
      <span class="results-count" id="resultsCount">0 items</span>
      <span class="filter-badge" id="activeFilterBadge"></span>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="productGrid">
      <div class="loading-state" id="loadingState">
        <div class="loading-spinner" role="status"></div>
        <p>Loading fresh groceries...</p>
      </div>
    </div>
  </main>

  <!-- STICKY BOTTOM BAR -->
  <div class="sticky-bottom-bar">
    <div class="bottom-bar-inner">
      <span class="delivery-message">🚀 delivery in 10 mins</span>
      <span class="min-order">min order ₹99</span>
    </div>
  </div>

  <!-- Floating Call Button -->
  <a href="tel:+919982239821" class="floating-call-btn" aria-label="Call OK Mart for support">
    <span class="call-icon">📞</span>
  </a>

  <script src="/js/common.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
