<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no">
  
  <title>OK Mart | Fresh Grocery Delivery in 10-15 Minutes</title>
  <meta name="description" content="Order fresh groceries online - milk, bread, fruits, vegetables, snacks. Fast delivery in 10-15 minutes. Free delivery on orders above ₹199.">
  <meta name="theme-color" content="#2ecc71">
  
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">
  
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/home.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- ========== HEADER ========== -->
    <header class="app-header">
      <div class="location-bar">
        <div class="location-info">
          <span class="location-icon">📍</span>
          <div class="location-text">
            <span class="delivery-time">Delivery in 10-15 mins</span>
            <span class="location-address">Home ▼</span>
          </div>
        </div>
        <a href="/profile.html" class="profile-btn">👤</a>
      </div>
      <div class="header-actions">
        <div class="search-bar" onclick="location.href='/search.html'">
          <span class="search-icon">🔍</span>
          <span class="search-placeholder">Search for grocery...</span>
        </div>
        <a href="/cart.html" class="cart-icon-link">
          <span class="cart-icon">🛒</span>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
      </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="home-main">
      
      <!-- Banner Carousel (Admin Controlled) -->
      <div class="banner-carousel" id="bannerCarousel">
        <div class="banner-track" id="bannerTrack">
          <div class="loading-placeholder" style="padding:20px;text-align:center;color:#6b7280;">Loading offers...</div>
        </div>
        <div class="banner-dots" id="bannerDots"></div>
      </div>

      <!-- Category Sections (Dynamic from Firebase) -->
      <div id="categorySections">
        <div class="loading-section">
          <div class="skeleton-title"></div>
          <div class="skeleton-scroll">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>
      </div>

    </main>

    <!-- ========== FLOATING CART BAR ========== -->
    <div class="floating-cart-bar" id="floatingCartBar">
      <div class="cart-bar-inner">
        <div class="cart-bar-info">
          <span class="cart-bar-icon">🛒</span>
          <span class="cart-bar-count" id="barCartCount">0 items</span>
        </div>
        <a href="/cart.html" class="cart-bar-btn">View Cart · <span id="barCartTotal">₹0</span></a>
      </div>
    </div>

    <!-- ========== BOTTOM NAVIGATION ========== -->
    <nav class="bottom-nav">
      <a href="/index.html" class="nav-item active">🏠<span>Home</span></a>
      <a href="/search.html" class="nav-item">🔍<span>Search</span></a>
      <a href="/offers.html" class="nav-item">🏷️<span>Offers</span></a>
      <a href="/tracking.html" class="nav-item">📦<span>Track</span></a>
      <a href="/cart.html" class="nav-item">🛒<span>Cart</span></a>
    </nav>

    <!-- Floating Buttons -->
    <a href="https://wa.me/919982239821" class="fab-whatsapp" target="_blank">💬</a>
    <a href="tel:+919982239821" class="fab-call">📞</a>

    <!-- Toast -->
    <div class="toast-message" id="toastMessage"></div>
    
  </div>

  <script src="/js/firebase.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
