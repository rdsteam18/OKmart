<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>OK Mart · fresh grocery</title>
  <!-- CSS (modular, no inline styles) -->
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <!-- HEADER (reusable component – will be styled via common.css) -->
  <header class="app-header" id="mainHeader">
    <div class="header-container">
      <a href="index.html" class="logo-link">
        <span class="logo-text">🛒 OK Mart</span>
      </a>
      <a href="cart.html" class="cart-icon-link" aria-label="cart">
        <span class="cart-icon">🛍️</span>
        <span class="cart-badge" id="cartCountPlaceholder">0</span>
      </a>
    </div>
  </header>

  <!-- MAIN CONTENT (home page specific) -->
  <main class="home-main">
    <!-- welcome / category quick links (static structure) -->
    <section class="category-pills-section">
      <h2 class="section-title">shop by category</h2>
      <div class="category-pills" id="categoryPillsContainer">
        <!-- will be populated from products.json via home.js -->
      </div>
    </section>

    <!-- product grid (2-col mobile, 3-4 desktop) -->
    <section class="product-grid-section">
      <div class="section-header">
        <h2 class="section-title">✨ trending groceries</h2>
      </div>
      <div class="product-grid" id="productGrid">
        <!-- all product cards injected from home.js (using data/products.json) -->
      </div>
    </section>
  </main>

  <!-- STICKY BOTTOM BAR (common component) -->
  <div class="sticky-bottom-bar">
    <div class="bottom-bar-inner">
      <span class="delivery-message">🚀 delivery in 10 mins</span>
      <span class="min-order">min order ₹99</span>
    </div>
  </div>

  <!-- SCRIPTS (common + page-specific) -->
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
