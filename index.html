<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>OK Mart · 10 min grocery delivery</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/home.css">
  
  <!-- Google Fonts (optional but clean) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- STICKY HEADER -->
  <header class="app-header" id="mainHeader">
    <div class="header-container">
      <a href="index.html" class="logo-link">
        <span class="logo-text">🛒 OK Mart</span>
      </a>
      <a href="cart.html" class="cart-icon-link" aria-label="cart">
        <span class="cart-icon">🛍️</span>
        <span class="cart-badge" id="cartCountPlaceholder">0</span>
      </a>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="home-main">
    <!-- Search Bar -->
    <div class="search-container">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search for milk, snacks, atta..."
          autocomplete="off"
        >
        <button class="clear-search" id="clearSearchBtn" aria-label="clear search">✕</button>
      </div>
    </div>

    <!-- Category Filter - Horizontal Scroll -->
    <div class="category-filter-section">
      <div class="category-scroll" id="categoryFilterContainer">
        <!-- Category buttons will be injected dynamically -->
      </div>
    </div>

    <!-- Results Info -->
    <div class="results-info" id="resultsInfo">
      <span class="results-count" id="resultsCount">0 items</span>
      <span class="filter-badge" id="activeFilterBadge"></span>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="productGrid">
      <!-- Loading state -->
      <div class="loading-state" id="loadingState">
        <div class="loading-spinner"></div>
        <p>Loading fresh groceries...</p>
      </div>
    </div>
  </main>

  <!-- STICKY BOTTOM BAR -->
  <div class="sticky-bottom-bar">
    <div class="bottom-bar-inner">
      <span class="delivery-message">🚀 delivery in 10 mins</span>
      <span class="min-order">min order ₹99</span>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
