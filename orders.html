<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>My Orders | OK Mart</title>
  <meta name="theme-color" content="#84c225">
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1a1e2b;min-height:100vh}
    .container{max-width:480px;margin:0 auto;padding:0 16px 100px}
    .header{display:flex;align-items:center;gap:12px;padding:12px 0}
    .back-btn{width:40px;height:40px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.5rem;border:1px solid #e5e7eb}
    h1{font-size:1.3rem;font-weight:700}
    .order-card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.03);cursor:pointer}
    .order-header{display:flex;justify-content:space-between;margin-bottom:8px}
    .order-id{font-weight:700;font-family:monospace;color:#5f930e}
    .status-badge{padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
    .status-received{background:#fef3c7;color:#92400e}
    .status-preparing{background:#dbeafe;color:#1e40af}
    .status-outfordelivery{background:#d1fae5;color:#065f46}
    .status-delivered{background:#e0e7ff;color:#3730a3}
    .order-total{font-weight:700;margin-top:4px}
    .order-date{font-size:.8rem;color:#6b7280}
    .order-again-btn{background:#f3f9eb;border:1.5px solid #84c225;color:#5f930e;padding:6px 14px;border-radius:30px;font-weight:600;font-size:.75rem;cursor:pointer}
    .empty-state{text-align:center;padding:80px 20px}
    .empty-state span{font-size:4rem;opacity:.5;display:block;margin-bottom:16px}
    .shop-btn{display:inline-block;margin-top:20px;background:#84c225;color:white;padding:14px 28px;border-radius:40px;text-decoration:none;font-weight:600}
  </style>
  <link rel="stylesheet" href="/css/qc.css">
</head>
<body>
  <div class="container">
    <div class="header"><a href="/profile.html" class="back-btn">←</a><h1>My Orders</h1></div>
    <div id="ordersList"></div>
    <div id="emptyState" class="empty-state" style="display:none;">
      <span>📦</span><h2>No orders yet</h2><p>Your order history will appear here</p>
      <a href="/index.html" class="shop-btn">Start Shopping →</a>
    </div>
  </div>

  <script src="/js/firebase.js"></script>
  <script src="/js/common.js"></script>
  <script>
    async function loadAndRenderOrders() {
      let orders = [];
      
      // ✅ Try Firebase first — phones from login AND checkout address,
      // so history works with or without login.
      try {
        const phones = [];
        const addPhone = (p) => {
          if (!p) return;
          let digits = String(p).replace(/[^0-9]/g, '');
          if (digits.length === 12 && digits.startsWith('91')) digits = digits.slice(2);
          if (digits.length === 11 && digits.startsWith('0')) digits = digits.slice(1);
          if (!/^\d{10}$/.test(digits)) return;
          if (!phones.includes(digits)) phones.push(digits);
          const withCode = '+91' + digits;
          if (!phones.includes(withCode)) phones.push(withCode);
        };
        try {
          const user = JSON.parse(localStorage.getItem('okmart_user') || 'null');
          if (user) addPhone(user.phone);
        } catch (e) {}
        try {
          const addr = JSON.parse(localStorage.getItem('okmart_user_address') || 'null');
          if (addr) addPhone(addr.phone);
        } catch (e) {}

        if (phones.length > 0 && typeof db !== 'undefined') {
          const seen = new Set();
          for (const phone of phones) {
            const snapshot = await db.collection('orders')
              .where('phone', '==', phone)
              .orderBy('createdAt', 'desc')
              .limit(30)
              .get();
            snapshot.forEach(doc => {
              if (seen.has(doc.id)) return;
              seen.add(doc.id);
              const data = doc.data();
              orders.push({
                ...data,
                id: doc.id,
                date: data.createdAt
                  ? (data.createdAt.toDate ? data.createdAt.toDate().toISOString() : data.createdAt)
                  : (data.date || new Date().toISOString())
              });
            });
          }
          orders.sort((a, b) => new Date(b.date) - new Date(a.date));
        }
      } catch(e) {
        console.warn('Firebase orders error:', e.message);
      }

      // Fallback to localStorage
      if (orders.length === 0) {
        orders = JSON.parse(localStorage.getItem('okmart_orders') || '[]');
        orders.sort((a,b) => new Date(b.date||b.orderDate) - new Date(a.date||a.orderDate));
      }
      
      const container = document.getElementById('ordersList');
      
      if (orders.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
      } else {
        container.innerHTML = orders.map(o => `
          <div class="order-card" onclick="location.href='/track-order.html?order=${o.orderId||o.id||''}'">
            <div class="order-header">
              <span class="order-id">#${o.orderId || o.id || 'ORD-XXXX'}</span>
              <span class="status-badge status-${o.status || 'received'}">${o.status || 'Received'}</span>
            </div>
            <div class="order-date">📅 ${new Date(o.date||o.orderDate||Date.now()).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'})}</div>
            <div class="order-total">₹${Number(o.total || 0).toLocaleString('en-IN')}</div>
            <div style="margin-top:8px;">
              <button class="order-again-btn" onclick="event.stopPropagation();orderAgain(${JSON.stringify(o).replace(/"/g,'&quot;')})">🔄 Order Again</button>
            </div>
          </div>
        `).join('');
        
        window._allOrders = orders;
      }
    }
    
    function orderAgain(order) {
      if (!order) return;
      const o = typeof order === 'string' ? JSON.parse(order) : order;
      if (o && o.items && o.items.length > 0) {
        localStorage.setItem('okmart_cart', JSON.stringify(
          o.items.map(i => ({...i, quantity: i.quantity || 1}))
        ));
        location.href = '/cart.html';
      }
    }
    
    loadAndRenderOrders();
  </script>
    <!-- ========== FLOATING BOTTOM NAVIGATION ========== -->
    <nav class="qc-bottom-nav">
      <a href="/index.html" class="qc-nav-item">
        <span class="qc-nav-icon"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5.5h5V20"/></svg></span>
        <span>Home</span>
      </a>
      <a href="/categories.html" class="qc-nav-item">
        <span class="qc-nav-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>
        <span>Categories</span>
      </a>
      <a href="/buy-again.html" class="qc-nav-item">
        <span class="qc-nav-icon"><svg viewBox="0 0 24 24"><path d="M5.5 8h13l-1 12h-11L5.5 8Z"/><path d="M9 10.5V6.5a3 3 0 0 1 6 0v4"/><path d="M17.5 4.5a3.2 3.2 0 1 1-2.4 1.1"/><path d="M17.6 2.6v1.9h-1.9"/></svg></span>
        <span>Buy Again</span>
      </a>
      <a href="/cart.html" class="qc-nav-item">
        <span class="qc-nav-icon"><svg viewBox="0 0 24 24"><path d="M5.5 8h13l-1 12h-11L5.5 8Z"/><path d="M9 10.5V6.5a3 3 0 0 1 6 0v4"/></svg></span>
        <span>Basket</span>
        <span class="qc-nav-badge" id="bottomNavCartCount">0</span>
      </a>
    </nav>
    <script src="/js/qc-nav.js"></script>
</body>
</html>
