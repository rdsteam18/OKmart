<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>My Orders | OK Mart</title>
  <meta name="theme-color" content="#2ecc71">
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1a1e2b;min-height:100vh}
    .container{max-width:480px;margin:0 auto;padding:0 16px 100px}
    .header{display:flex;align-items:center;gap:12px;padding:12px 0}
    .back-btn{width:40px;height:40px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.5rem;border:1px solid #e5e7eb}
    h1{font-size:1.3rem;font-weight:700}
    .order-card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.03);cursor:pointer}
    .order-header{display:flex;justify-content:space-between;margin-bottom:8px}
    .order-id{font-weight:700;font-family:monospace;color:#27ae60}
    .status-badge{padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
    .status-received{background:#fef3c7;color:#92400e}
    .status-preparing{background:#dbeafe;color:#1e40af}
    .status-outfordelivery{background:#d1fae5;color:#065f46}
    .status-delivered{background:#e0e7ff;color:#3730a3}
    .order-total{font-weight:700;margin-top:4px}
    .order-date{font-size:.8rem;color:#6b7280}
    .order-again-btn{background:#e8f8ef;border:1.5px solid #2ecc71;color:#27ae60;padding:6px 14px;border-radius:30px;font-weight:600;font-size:.75rem;cursor:pointer}
    .empty-state{text-align:center;padding:80px 20px}
    .empty-state span{font-size:4rem;opacity:.5;display:block;margin-bottom:16px}
    .shop-btn{display:inline-block;margin-top:20px;background:#2ecc71;color:white;padding:14px 28px;border-radius:40px;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><a href="/profile.html" class="back-btn">←</a><h1>My Orders</h1></div>
    <div id="ordersList"></div>
    <div id="emptyState" class="empty-state" style="display:none;">
      <span>📦</span><h2>No orders yet</h2><p>Your order history will appear here</p>
      <a href="/index.html" class="shop-btn">Start Shopping →</a>
    </div>
  </div>

  <script src="/js/firebase.js"></script>
  <script src="/js/common.js"></script>
  <script>
    async function loadAndRenderOrders() {
      let orders = [];
      
      // ✅ Try Firebase first
      try {
        const userJson = localStorage.getItem('okmart_user');
        const user = userJson ? JSON.parse(userJson) : null;
        
        if (user && user.phone && typeof db !== 'undefined') {
          const phone = user.phone.replace('+91','').replace(/\s/g,'');
          const snapshot = await db.collection('orders')
            .where('phone', '==', phone)
            .orderBy('createdAt', 'desc')
            .limit(30)
            .get();
          
          if (!snapshot.empty) {
            snapshot.forEach(doc => {
              const data = doc.data();
              orders.push({
                ...data,
                id: doc.id,
                date: data.createdAt
                  ? (data.createdAt.toDate ? data.createdAt.toDate().toISOString() : data.createdAt)
                  : (data.date || new Date().toISOString())
              });
            });
          }
        }
      } catch(e) {
        console.warn('Firebase orders error:', e.message);
      }
      
      // Fallback to localStorage
      if (orders.length === 0) {
        orders = JSON.parse(localStorage.getItem('okmart_orders') || '[]');
        orders.sort((a,b) => new Date(b.date||b.orderDate) - new Date(a.date||a.orderDate));
      }
      
      const container = document.getElementById('ordersList');
      
      if (orders.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
      } else {
        container.innerHTML = orders.map(o => `
          <div class="order-card" onclick="location.href='/track-order.html?order=${o.orderId||o.id||''}'">
            <div class="order-header">
              <span class="order-id">#${o.orderId || o.id || 'ORD-XXXX'}</span>
              <span class="status-badge status-${o.status || 'received'}">${o.status || 'Received'}</span>
            </div>
            <div class="order-date">📅 ${new Date(o.date||o.orderDate||Date.now()).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'})}</div>
            <div class="order-total">₹${Number(o.total || 0).toLocaleString('en-IN')}</div>
            <div style="margin-top:8px;">
              <button class="order-again-btn" onclick="event.stopPropagation();orderAgain(${JSON.stringify(o).replace(/"/g,'&quot;')})">🔄 Order Again</button>
            </div>
          </div>
        `).join('');
        
        window._allOrders = orders;
      }
    }
    
    function orderAgain(order) {
      if (!order) return;
      const o = typeof order === 'string' ? JSON.parse(order) : order;
      if (o && o.items && o.items.length > 0) {
        localStorage.setItem('okmart_cart', JSON.stringify(
          o.items.map(i => ({...i, quantity: i.quantity || 1}))
        ));
        location.href = '/cart.html';
      }
    }
    
    loadAndRenderOrders();
  </script>
</body>
</html>
