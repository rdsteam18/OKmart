<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Coupon Management | OK Mart Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2ecc71">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #2ecc71;
      --primary-dark: #27ae60;
      --primary-light: #e8f8ef;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1a1e2b;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --info: #3b82f6;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.04);
      --shadow-md: 0 8px 24px rgba(0,0,0,.06);
      --radius: 16px;
      --transition: all .2s ease;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    
    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    @keyframes slideIn {
      from { transform: translateX(-20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .admin-layout { display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #1a1e2b 0%, #0f1119 100%);
      color: white;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .sidebar-brand {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .sidebar-logo { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sidebar-badge {
      background: var(--primary);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: .65rem;
      font-weight: 600;
    }
    
    .sidebar-nav { flex: 1; padding: 20px 0; }
    .sidebar-nav a {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 24px; color: rgba(255,255,255,.7);
      text-decoration: none; font-weight: 500;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .sidebar-nav a::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 100%;
      background: rgba(46,204,113,.1);
      transition: width .3s;
    }
    .sidebar-nav a:hover::before { width: 100%; }
    .sidebar-nav a:hover { color: white; padding-left: 28px; }
    .sidebar-nav a.active {
      background: rgba(46,204,113,.15);
      color: var(--primary);
      border-left: 3px solid var(--primary);
    }
    
    .sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,.1); }
    .sidebar-footer button {
      width: 100%; padding: 12px; background: rgba(255,255,255,.08);
      border: none; color: rgba(255,255,255,.7); border-radius: 10px;
      cursor: pointer; transition: var(--transition);
    }
    .sidebar-footer button:hover { background: rgba(239,68,68,.2); color: var(--danger); transform: translateY(-2px); }
    
    .mobile-header {
      display: none; padding: 12px 16px; background: var(--card);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
      align-items: center; justify-content: space-between;
    }
    .menu-toggle {
      background: var(--bg); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 8px; cursor: pointer;
    }
    
    /* Main Content */
    .main-content { flex: 1; margin-left: 260px; padding: 24px; max-width: 1400px; animation: fadeIn .3s ease; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-header h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, var(--text), var(--primary-dark)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .add-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white; border: none; padding: 12px 24px; border-radius: 30px;
      font-weight: 600; cursor: pointer; transition: var(--transition);
      box-shadow: 0 4px 12px rgba(46,204,113,.3);
    }
    .add-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(46,204,113,.4); }
    .add-btn:active { transform: translateY(0); }
    
    /* Stats Grid */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card); border-radius: var(--radius);
      padding: 20px; border: 1px solid var(--border);
      transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--primary-light); }
    .stat-card .stat-value { font-size: 2rem; font-weight: 800; color: var(--primary); }
    .stat-card .stat-label { font-size: .85rem; color: var(--muted); margin-top: 4px; }
    
    /* Controls Bar */
    .controls-bar {
      display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
      background: var(--card); padding: 16px; border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .search-input {
      flex: 2; min-width: 200px; padding: 12px 16px;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 12px; transition: var(--transition);
    }
    .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    
    .filter-select {
      padding: 12px 16px; background: var(--bg);
      border: 1.5px solid var(--border); border-radius: 12px;
      cursor: pointer;
    }
    
    .bulk-actions {
      display: flex; gap: 8px; margin-left: auto;
      animation: fadeIn .3s ease;
    }
    .bulk-btn {
      padding: 10px 16px; border-radius: 10px; font-weight: 500;
      cursor: pointer; transition: var(--transition); border: none;
    }
    .bulk-btn-success { background: #d1fae5; color: var(--success); }
    .bulk-btn-warning { background: #fef3c7; color: var(--warning); }
    .bulk-btn-danger { background: #fee2e2; color: var(--danger); }
    .bulk-btn:hover { transform: translateY(-2px); }
    
    /* Coupon Grid */
    .coupon-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px; animation: fadeIn .4s ease;
    }
    .coupon-card {
      background: var(--card); border-radius: var(--radius);
      border: 1px solid var(--border); overflow: hidden;
      transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeIn .3s ease;
    }
    .coupon-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
    
    .coupon-header {
      background: linear-gradient(135deg, var(--primary-light), var(--card));
      padding: 20px; position: relative;
      border-bottom: 2px dashed var(--border);
    }
    .coupon-code {
      font-size: 1.6rem; font-weight: 800; font-family: monospace;
      letter-spacing: 2px; color: var(--primary-dark);
    }
    .coupon-badge {
      position: absolute; top: 20px; right: 20px;
    }
    .badge {
      padding: 4px 10px; border-radius: 20px; font-size: .7rem; font-weight: 600;
    }
    .badge-active { background: #d1fae5; color: #065f46; }
    .badge-inactive { background: #fee2e2; color: #991b1b; }
    .badge-flat { background: #dbeafe; color: #1e40af; }
    .badge-percent { background: #ede9fe; color: #5b21b6; }
    .badge-expired { background: #f1f5f9; color: #64748b; }
    
    .coupon-body { padding: 20px; }
    .coupon-discount { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .coupon-desc { color: var(--muted); margin: 8px 0; }
    .coupon-info { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; font-size: .8rem; }
    .info-tag { background: var(--bg); padding: 4px 10px; border-radius: 20px; color: var(--muted); }
    .usage-bar { margin: 12px 0; }
    .usage-progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .usage-progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width .3s; }
    
    .coupon-footer {
      padding: 16px 20px; background: var(--bg);
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--border);
    }
    .action-btns { display: flex; gap: 8px; }
    .action-btn {
      padding: 6px 12px; border-radius: 8px; font-size: .75rem;
      cursor: pointer; border: 1px solid var(--border); background: var(--card);
      transition: var(--transition);
    }
    .action-btn:hover { transform: translateY(-2px); }
    .action-btn.edit:hover { background: var(--primary-light); border-color: var(--primary); }
    .action-btn.delete:hover { background: #fee2e2; border-color: var(--danger); color: var(--danger); }
    
    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,.5); z-index: 200;
      display: none; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; animation: fadeIn .2s ease; }
    .modal-card {
      background: var(--card); border-radius: 24px;
      width: 95%; max-width: 550px; max-height: 85vh;
      overflow-y: auto; padding: 28px;
      animation: slideIn .3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .modal-header h2 { font-size: 1.3rem; font-weight: 700; }
    .modal-close {
      width: 36px; height: 36px; border-radius: 50%; background: var(--bg);
      border: none; cursor: pointer; transition: var(--transition);
    }
    .modal-close:hover { transform: rotate(90deg); background: var(--border); }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px; background: var(--bg);
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: .9rem; transition: var(--transition);
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .form-check { display: flex; align-items: center; gap: 8px; margin: 16px 0; }
    .save-btn {
      width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer;
      transition: var(--transition);
    }
    .save-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(46,204,113,.3); }
    
    /* Checkbox */
    .select-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
    
    /* Loading Shimmer */
    .shimmer-card {
      background: var(--card); border-radius: var(--radius); padding: 20px;
      border: 1px solid var(--border);
    }
    .shimmer { background: linear-gradient(90deg, var(--bg) 25%, var(--border) 50%, var(--bg) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    
    .no-data { text-align: center; padding: 60px; color: var(--muted); }
    
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: white; padding: 12px 24px;
      border-radius: 40px; font-weight: 500; z-index: 300;
      opacity: 0; transition: all .3s ease;
    }
    .toast.show { opacity: 1; bottom: 50px; }
    .toast.success { background: #10b981; }
    .toast.error { background: var(--danger); }
    
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); display: flex; }
      .main-content { margin-left: 0; padding: 16px; }
      .mobile-header { display: flex; }
      .form-row { flex-direction: column; }
      .coupon-grid { grid-template-columns: 1fr; }
    }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="admin-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-logo">🛒 OK Mart</span>
        <span class="sidebar-badge">Admin</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="orders.html">📋 Orders</a>
        <a href="products.html">📦 Products</a>
        <a href="offers.html" class="active">🏷️ Coupons</a>
        <a href="settings.html">⚙️ Settings</a>
      </nav>
      <div class="sidebar-footer">
        <button onclick="adminLogout()">🚪 Logout</button>
        <button onclick="location.href='/'" style="margin-top:8px;">🏠 View Store</button>
      </div>
    </aside>

    <!-- Mobile Header -->
    <div class="mobile-header">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <span style="font-weight:700;">🏷️ Coupons</span>
      <button class="add-btn" onclick="openCouponModal()" style="padding:8px 16px;">➕ Add</button>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Page Header -->
      <div class="page-header">
        <h1>🏷️ Coupon Management</h1>
        <button class="add-btn" onclick="openCouponModal()">➕ Create Coupon</button>
      </div>

      <!-- Stats Cards -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-value" id="totalCoupons">0</div><div class="stat-label">Total Coupons</div></div>
        <div class="stat-card"><div class="stat-value" id="activeCoupons">0</div><div class="stat-label">Active</div></div>
        <div class="stat-card"><div class="stat-value" id="totalUses">0</div><div class="stat-label">Total Uses</div></div>
        <div class="stat-card"><div class="stat-value" id="expiredCoupons">0</div><div class="stat-label">Expired</div></div>
      </div>

      <!-- Controls Bar -->
      <div class="controls-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search by coupon code..." oninput="filterCoupons()">
        <select class="filter-select" id="typeFilter" onchange="filterCoupons()">
          <option value="">All Types</option>
          <option value="flat">Flat (₹)</option>
          <option value="percent">Percent (%)</option>
        </select>
        <select class="filter-select" id="statusFilter" onchange="filterCoupons()">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
          <option value="expired">Expired</option>
        </select>
        <div class="bulk-actions" id="bulkActions" style="display:none;">
          <button class="bulk-btn bulk-btn-success" onclick="bulkActivate()">✅ Activate</button>
          <button class="bulk-btn bulk-btn-warning" onclick="bulkDeactivate()">⛔ Deactivate</button>
          <button class="bulk-btn bulk-btn-danger" onclick="bulkDelete()">🗑️ Delete</button>
        </div>
      </div>

      <!-- Coupons Grid -->
      <div class="coupon-grid" id="couponsGrid">
        <div class="shimmer-card"><div class="shimmer" style="height:200px;"></div></div>
      </div>
    </main>
  </div>

  <!-- Coupon Modal -->
  <div class="modal-overlay" id="couponModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Create Coupon</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <form id="couponForm">
        <input type="hidden" id="couponId">
        
        <div class="form-group">
          <label>Coupon Code *</label>
          <input type="text" id="couponCode" required placeholder="e.g., SAVE20" style="text-transform:uppercase;">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Type *</label>
            <select id="couponType" required>
              <option value="flat">Flat Discount (₹)</option>
              <option value="percent">Percentage Discount (%)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Discount Value *</label>
            <input type="number" id="couponDiscount" required placeholder="20">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Min Order (₹)</label>
            <input type="number" id="couponMinOrder" placeholder="250" value="0">
          </div>
          <div class="form-group">
            <label>Max Discount (₹)</label>
            <input type="number" id="couponMaxDiscount" placeholder="Optional">
          </div>
        </div>
        
        <div class="form-group">
          <label>Description</label>
          <input type="text" id="couponDesc" placeholder="Save ₹20 on orders above ₹250">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Valid From</label>
            <input type="datetime-local" id="couponValidFrom">
          </div>
          <div class="form-group">
            <label>Valid To</label>
            <input type="datetime-local" id="couponValidTo">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Apply to Category</label>
            <select id="couponCategory">
              <option value="">All Categories</option>
              <option value="dairy">🥛 Dairy</option>
              <option value="fruits">🍎 Fruits</option>
              <option value="snacks">🍿 Snacks</option>
              <option value="beverages">🥤 Beverages</option>
              <option value="grocery">🛒 Grocery</option>
              <option value="vegetables">🥬 Vegetables</option>
            </select>
          </div>
          <div class="form-group">
            <label>Apply to Product ID</label>
            <input type="text" id="couponProductId" placeholder="Optional product ID">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Total Usage Limit</label>
            <input type="number" id="couponUsageLimit" placeholder="Unlimited">
          </div>
          <div class="form-group">
            <label>Per User Limit</label>
            <input type="number" id="couponPerUserLimit" placeholder="1" value="1">
          </div>
        </div>
        
        <div class="form-check">
          <input type="checkbox" id="couponActive" checked>
          <label>✅ Active (visible to customers)</label>
        </div>
        
        <button type="submit" class="save-btn">💾 Save Coupon</button>
      </form>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-card" style="text-align:center;max-width:400px;">
      <div style="font-size:3rem;margin-bottom:12px;">⚠️</div>
      <h3>Delete Coupon?</h3>
      <p id="deleteMessage" style="margin:12px 0;color:var(--muted);">This action cannot be undone.</p>
      <div style="display:flex;gap:12px;margin-top:20px;">
        <button class="bulk-btn" style="flex:1;" onclick="closeDeleteModal()">Cancel</button>
        <button class="bulk-btn bulk-btn-danger" style="flex:1;" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/firebase.js"></script>
  <script>
    // ===== ADVANCED COUPON MANAGEMENT SYSTEM =====
    
    let allCoupons = [];
    let editingId = null;
    let deleteId = null;
    let deleteMultipleIds = [];
    let selectedCoupons = new Set();
    let filteredCoupons = [];
    
    // ========== LOAD COUPONS ==========
    if (db && db.collection) {
      db.collection('offers').onSnapshot((snapshot) => {
        allCoupons = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          allCoupons.push({ id: doc.id, ...data, usageCount: data.usageCount || 0 });
        });
        updateStats();
        filterCoupons();
      });
    }
    
    // ========== UPDATE STATISTICS ==========
    function updateStats() {
      const total = allCoupons.length;
      const active = allCoupons.filter(c => c.active === true && !isExpired(c)).length;
      const totalUses = allCoupons.reduce((sum, c) => sum + (c.usageCount || 0), 0);
      const expired = allCoupons.filter(c => isExpired(c)).length;
      
      document.getElementById('totalCoupons').textContent = total;
      document.getElementById('activeCoupons').textContent = active;
      document.getElementById('totalUses').textContent = totalUses;
      document.getElementById('expiredCoupons').textContent = expired;
    }
    
    // ========== CHECK EXPIRY ==========
    function isExpired(coupon) {
      if (coupon.validTo) {
        const expiryDate = new Date(coupon.validTo);
        return expiryDate < new Date();
      }
      return false;
    }
    
    // ========== FILTER COUPONS ==========
    function filterCoupons() {
      const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
      const type = document.getElementById('typeFilter')?.value || '';
      const status = document.getElementById('statusFilter')?.value || '';
      
      filteredCoupons = allCoupons.filter(c => {
        if (search && !c.code?.toLowerCase().includes(search)) return false;
        if (type && c.type !== type) return false;
        if (status === 'active' && (c.active !== true || isExpired(c))) return false;
        if (status === 'inactive' && c.active === true && !isExpired(c)) return false;
        if (status === 'expired' && !isExpired(c)) return false;
        return true;
      });
      
      renderCoupons();
    }
    
    // ========== RENDER COUPONS ==========
    function renderCoupons() {
      const grid = document.getElementById('couponsGrid');
      const showBulk = selectedCoupons.size > 0;
      document.getElementById('bulkActions').style.display = showBulk ? 'flex' : 'none';
      
      if (filteredCoupons.length === 0) {
        grid.innerHTML = '<div class="no-data">🏷️ No coupons found. Click "Create Coupon" to add one.</div>';
        return;
      }
      
      grid.innerHTML = filteredCoupons.map(c => {
        const expired = isExpired(c);
        const isActive = c.active === true && !expired;
        const usagePercent = c.usageLimit ? ((c.usageCount || 0) / c.usageLimit) * 100 : 0;
        const discountDisplay = c.type === 'flat' ? `₹${c.discount} OFF` : `${c.discount}% OFF`;
        
        return `
          <div class="coupon-card" style="animation: fadeIn .3s ease;">
            <div class="coupon-header">
              <div class="coupon-code">${c.code}</div>
              <div class="coupon-badge">
                <span class="badge ${isActive ? 'badge-active' : (expired ? 'badge-expired' : 'badge-inactive')}">
                  ${isActive ? 'Active' : (expired ? 'Expired' : 'Inactive')}
                </span>
              </div>
            </div>
            <div class="coupon-body">
              <div class="coupon-discount">${discountDisplay}</div>
              <div class="coupon-desc">${c.description || (c.type === 'flat' ? `Get ₹${c.discount} off` : `Get ${c.discount}% off`)}</div>
              <div class="coupon-info">
                <span class="info-tag">🛒 Min: ₹${c.minOrder || 0}</span>
                <span class="info-tag ${c.type === 'flat' ? 'badge-flat' : 'badge-percent'}">${c.type === 'flat' ? '💰 Flat' : '📊 Percent'}</span>
                ${c.category ? `<span class="info-tag">📁 ${c.category}</span>` : ''}
              </div>
              ${c.usageLimit ? `
                <div class="usage-bar">
                  <div class="usage-progress"><div class="usage-progress-fill" style="width: ${Math.min(usagePercent, 100)}%"></div></div>
                  <div style="font-size:.7rem;color:var(--muted);margin-top:4px;">Used ${c.usageCount || 0} / ${c.usageLimit} times</div>
                </div>
              ` : ''}
              ${c.validTo ? `<div class="info-tag" style="background:var(--bg);padding:4px 10px;border-radius:20px;font-size:.7rem;">📅 Valid till: ${new Date(c.validTo).toLocaleDateString()}</div>` : ''}
            </div>
            <div class="coupon-footer">
              <div class="action-btns">
                <button class="action-btn edit" onclick="openEditModal('${c.id}')">✏️ Edit</button>
                <button class="action-btn delete" onclick="openDeleteModal('${c.id}', '${c.code}')">🗑️ Delete</button>
              </div>
              <input type="checkbox" class="select-checkbox" data-id="${c.id}" ${selectedCoupons.has(c.id) ? 'checked' : ''} onchange="toggleSelect('${c.id}', this.checked)">
            </div>
          </div>
        `;
      }).join('');
    }
    
    // ========== SELECTION HANDLERS ==========
    function toggleSelect(id, checked) {
      if (checked) selectedCoupons.add(id);
      else selectedCoupons.delete(id);
      renderCoupons();
    }
    
    function toggleSelectAll() {
      if (selectedCoupons.size === filteredCoupons.length) {
        selectedCoupons.clear();
      } else {
        filteredCoupons.forEach(c => selectedCoupons.add(c.id));
      }
      renderCoupons();
    }
    
    // ========== BULK ACTIONS ==========
    async function bulkActivate() {
      for (let id of selectedCoupons) {
        await db.collection('offers').doc(id).update({ active: true });
      }
      showToast(`✅ ${selectedCoupons.size} coupons activated`, 'success');
      selectedCoupons.clear();
    }
    
    async function bulkDeactivate() {
      for (let id of selectedCoupons) {
        await db.collection('offers').doc(id).update({ active: false });
      }
      showToast(`⛔ ${selectedCoupons.size} coupons deactivated`, 'success');
      selectedCoupons.clear();
    }
    
    async function bulkDelete() {
      if (confirm(`Delete ${selectedCoupons.size} coupons permanently?`)) {
        for (let id of selectedCoupons) {
          await db.collection('offers').doc(id).delete();
        }
        showToast(`🗑️ ${selectedCoupons.size} coupons deleted`, 'success');
        selectedCoupons.clear();
      }
    }
    
    // ========== MODAL FUNCTIONS ==========
    function openCouponModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Create Coupon';
      document.getElementById('couponForm').reset();
      document.getElementById('couponId').value = '';
      document.getElementById('couponActive').checked = true;
      document.getElementById('couponPerUserLimit').value = 1;
      document.getElementById('couponMinOrder').value = 0;
      document.getElementById('couponModal').classList.add('active');
    }
    
    window.openEditModal = function(id) {
      const c = allCoupons.find(c => c.id === id);
      if (!c) return;
      
      editingId = id;
      document.getElementById('modalTitle').textContent = 'Edit Coupon';
      document.getElementById('couponId').value = c.id;
      document.getElementById('couponCode').value = c.code || '';
      document.getElementById('couponType').value = c.type || 'flat';
      document.getElementById('couponDiscount').value = c.discount || '';
      document.getElementById('couponMinOrder').value = c.minOrder || 0;
      document.getElementById('couponMaxDiscount').value = c.maxDiscount || '';
      document.getElementById('couponDesc').value = c.description || '';
      document.getElementById('couponCategory').value = c.category || '';
      document.getElementById('couponProductId').value = c.productId || '';
      document.getElementById('couponUsageLimit').value = c.usageLimit || '';
      document.getElementById('couponPerUserLimit').value = c.perUserLimit || 1;
      document.getElementById('couponActive').checked = c.active !== false;
      
      if (c.validFrom) document.getElementById('couponValidFrom').value = c.validFrom.slice(0, 16);
      if (c.validTo) document.getElementById('couponValidTo').value = c.validTo.slice(0, 16);
      
      document.getElementById('couponModal').classList.add('active');
    };
    
    function closeModal() { document.getElementById('couponModal').classList.remove('active'); }
    
    window.openDeleteModal = function(id, code) {
      deleteId = id;
      document.getElementById('deleteMessage').innerHTML = `Delete coupon "<strong>${code}</strong>"? This action cannot be undone.`;
      document.getElementById('deleteModal').classList.add('active');
    };
    
    function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('active'); }
    
    window.confirmDelete = async function() {
      if (deleteId) {
        await db.collection('offers').doc(deleteId).delete();
        showToast('🗑️ Coupon deleted', 'success');
        deleteId = null;
      }
      closeDeleteModal();
    };
    
    // ========== SAVE COUPON ==========
    document.getElementById('couponForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const data = {
        code: document.getElementById('couponCode').value.toUpperCase().trim(),
        type: document.getElementById('couponType').value,
        discount: Number(document.getElementById('couponDiscount').value),
        minOrder: Number(document.getElementById('couponMinOrder').value) || 0,
        maxDiscount: Number(document.getElementById('couponMaxDiscount').value) || null,
        description: document.getElementById('couponDesc').value.trim(),
        category: document.getElementById('couponCategory').value || null,
        productId: document.getElementById('couponProductId').value || null,
        usageLimit: Number(document.getElementById('couponUsageLimit').value) || null,
        perUserLimit: Number(document.getElementById('couponPerUserLimit').value) || 1,
        active: document.getElementById('couponActive').checked,
        validFrom: document.getElementById('couponValidFrom').value || null,
        validTo: document.getElementById('couponValidTo').value || null,
        updatedAt: new Date().toISOString()
      };
      
      if (!data.code || !data.discount) {
        showToast('Please fill all required fields', 'error');
        return;
      }
      
      const saveBtn = document.querySelector('#couponForm .save-btn');
      saveBtn.textContent = '⏳ Saving...';
      saveBtn.disabled = true;
      
      try {
        if (editingId) {
          await db.collection('offers').doc(editingId).update(data);
          showToast('✅ Coupon updated!', 'success');
        } else {
          data.createdAt = new Date().toISOString();
          data.usageCount = 0;
          await db.collection('offers').add(data);
          showToast('✅ Coupon created!', 'success');
        }
        closeModal();
      } catch (err) {
        showToast('❌ Error saving coupon', 'error');
      }
      
      saveBtn.textContent = '💾 Save Coupon';
      saveBtn.disabled = false;
    });
    
    // ========== TOAST ==========
    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `toast ${type}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    // ========== LOGOUT ==========
    window.adminLogout = function() {
      localStorage.clear();
      window.location.href = 'login.html';
    };
    
    // Close modals on overlay click
    document.getElementById('couponModal').addEventListener('click', e => { if (e.target === document.getElementById('couponModal')) closeModal(); });
    document.getElementById('deleteModal').addEventListener('click', e => { if (e.target === document.getElementById('deleteModal')) closeDeleteModal(); });
    
    console.log('✅ Advanced coupon system ready!');
  </script>
</body>
</html>
