<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Order Details | OK Mart Admin</title>
  <meta name="theme-color" content="#84c225">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/a/AVvXsEjqUODVL4iyLalUMIzsfwPSpjOSA_8OEz7zn7WiCOxVySl8TqcLxulYNt7tBT9C85tto_EoafNkIMbgV1AMPkOJjkeZ52VLY5PR02z06GFwwFPb9WQBAun4WHcd3JB2Heky3Q2WdDGPy8DGZn7suo0_8RdY7Wd7i7wTMA4osYIiL6NZ1CbuPJHGzmeX">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --primary: #84c225;
      --primary-dark: #5f930e;
      --primary-light: #f3f9eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1a1e2b;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --info: #3b82f6;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.04);
      --shadow-md: 0 8px 24px rgba(0,0,0,.06);
      --radius: 20px;
      --transition: all .2s ease;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    
    /* Sidebar */
    .admin-layout {
      display: flex;
      min-height: 100vh;
    }
    
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, #1a1e2b 0%, #0f1119 100%);
      color: white;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
    }
    
    .sidebar-brand {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .sidebar-logo-img {
      width: 35px;
      height: 35px;
      border-radius: 10px;
    }
    
    .sidebar-logo-text {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .sidebar-badge {
      background: var(--primary);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: .6rem;
      font-weight: 600;
    }
    
    .sidebar-nav {
      flex: 1;
      padding: 20px 0;
    }
    
    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      color: rgba(255,255,255,.7);
      text-decoration: none;
      font-weight: 500;
      transition: var(--transition);
      position: relative;
    }
    
    .sidebar-nav a::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 100%;
      background: rgba(46,204,113,.1);
      transition: width .3s;
    }
    
    .sidebar-nav a:hover::before {
      width: 100%;
    }
    
    .sidebar-nav a:hover {
      color: white;
      padding-left: 28px;
    }
    
    .sidebar-nav a.active {
      background: rgba(46,204,113,.15);
      color: var(--primary);
      border-left: 3px solid var(--primary);
    }
    
    .sidebar-footer {
      padding: 20px;
      border-top: 1px solid rgba(255,255,255,.1);
    }
    
    .sidebar-footer button {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,.08);
      border: none;
      color: rgba(255,255,255,.7);
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .sidebar-footer button:hover {
      background: rgba(239,68,68,.2);
      color: var(--danger);
    }
    
    /* Mobile Header */
    .mobile-header {
      display: none;
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      align-items: center;
      justify-content: space-between;
    }
    
    .menu-toggle {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.2rem;
    }
    
    /* Main Content */
    .main-content {
      flex: 1;
      margin-left: 280px;
      padding: 24px;
      max-width: 1400px;
    }
    
    /* Order Detail Container */
    .order-detail-container {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Header */
    .order-header {
      background: linear-gradient(135deg, var(--primary-light), var(--card));
      padding: 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .order-id-section h1 {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }
    
    .order-date {
      font-size: .8rem;
      color: var(--muted);
    }
    
    .order-status-section {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .status-select {
      padding: 10px 16px;
      border: 1.5px solid var(--border);
      border-radius: 30px;
      font-weight: 500;
      background: white;
      cursor: pointer;
    }
    
    .update-status-btn {
      padding: 10px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .update-status-btn:hover {
      transform: translateY(-2px);
    }
    
    /* Status Badge */
    .status-badge {
      display: inline-flex;
      padding: 5px 12px;
      border-radius: 30px;
      font-size: .75rem;
      font-weight: 600;
    }
    
    .status-received { background: #fef3c7; color: #d97706; }
    .status-confirmed { background: #dbeafe; color: #2563eb; }
    .status-preparing { background: #fef3c7; color: #d97706; }
    .status-out_for_delivery { background: #e0e7ff; color: #4338ca; }
    .status-delivered { background: #d1fae5; color: #065f46; }
    .status-cancelled { background: #fee2e2; color: #dc2626; }
    
    /* Two Column Layout */
    .order-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 24px;
      padding: 24px;
    }
    
    @media (max-width: 900px) {
      .order-detail-grid {
        grid-template-columns: 1fr;
      }
    }
    
    /* Cards */
    .info-card {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    
    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }
    
    .card-header h3 {
      font-size: 1rem;
      font-weight: 600;
      flex: 1;
    }
    
    .card-icon {
      font-size: 1.2rem;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    
    .info-row:last-child {
      border-bottom: none;
    }
    
    .info-label {
      color: var(--muted);
      font-size: .8rem;
    }
    
    .info-value {
      font-weight: 600;
      font-size: .85rem;
    }
    
    /* Map */
    .order-map {
      height: 220px;
      border-radius: 16px;
      overflow: hidden;
      margin-top: 12px;
      background: #e2e8f0;
    }
    
    .map-link {
      display: inline-block;
      margin-top: 12px;
      color: var(--primary);
      text-decoration: none;
      font-size: .8rem;
    }
    
    /* Items List */
    .items-list {
      max-height: 400px;
      overflow-y: auto;
    }
    
    .order-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    
    .order-item:last-child {
      border-bottom: none;
    }
    
    .item-image {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      object-fit: cover;
    }
    
    .item-details {
      flex: 1;
    }
    
    .item-name {
      font-weight: 600;
      margin-bottom: 4px;
      font-size: .9rem;
    }
    
    .item-unit {
      font-size: .7rem;
      color: var(--muted);
    }
    
    .item-price-row {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
    }
    
    .item-quantity {
      font-size: .8rem;
      color: var(--muted);
    }
    
    .item-total {
      font-weight: 700;
      color: var(--primary-dark);
    }
    
    /* Summary */
    .summary-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
    }
    
    .discount-row {
      color: var(--success);
    }
    
    .total-row {
      font-weight: 800;
      font-size: 1.1rem;
      border-top: 2px solid var(--border);
      margin-top: 8px;
      padding-top: 12px;
    }
    
    /* Action Buttons */
    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    
    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      text-align: center;
      text-decoration: none;
    }
    
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    
    .btn-warning {
      background: var(--warning);
      color: white;
    }
    
    .btn-danger {
      background: var(--danger);
      color: white;
    }
    
    .btn-outline {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
    }
    
    .action-btn:hover {
      transform: translateY(-2px);
    }
    
    /* Timeline */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      padding-left: 20px;
    }
    
    .timeline::before {
      content: '';
      position: absolute;
      left: 18px;
      top: 10px;
      width: 2px;
      height: calc(100% - 20px);
      background: var(--border);
    }
    
    .timeline-item {
      display: flex;
      gap: 16px;
      position: relative;
      z-index: 1;
    }
    
    .timeline-icon {
      width: 36px;
      height: 36px;
      background: var(--bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      border: 2px solid var(--border);
    }
    
    .timeline-icon.completed {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    
    .timeline-icon.active {
      background: var(--primary-light);
      border-color: var(--primary);
      animation: pulse 1.5s ease infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    .timeline-content {
      flex: 1;
      padding-bottom: 8px;
    }
    
    .timeline-title {
      font-weight: 700;
      font-size: .9rem;
      margin-bottom: 4px;
    }
    
    .timeline-time {
      font-size: .7rem;
      color: var(--muted);
    }
    
    /* Loading State */
    .loading-state {
      text-align: center;
      padding: 80px;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: white;
      padding: 12px 24px;
      border-radius: 40px;
      z-index: 1000;
      opacity: 0;
      transition: all .3s;
    }
    
    .toast.show {
      opacity: 1;
      bottom: 50px;
    }
    
    .toast.success {
      background: var(--success);
    }
    
    .toast.error {
      background: var(--danger);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      
      .sidebar.open {
        transform: translateX(0);
      }
      
      .main-content {
        margin-left: 0;
        padding: 16px;
      }
      
      .mobile-header {
        display: flex;
      }
      
      .order-header {
        flex-direction: column;
        text-align: center;
      }
      
      .order-detail-grid {
        padding: 16px;
      }
      
      .action-buttons {
        flex-direction: column;
      }
      
      .timeline {
        padding-left: 12px;
      }
      
      .timeline-icon {
        width: 32px;
        height: 32px;
        font-size: .9rem;
      }
    }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <!-- Auth Protection -->
  <script src="../js/admin-auth.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="admin-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="https://blogger.googleusercontent.com/img/a/AVvXsEjqUODVL4iyLalUMIzsfwPSpjOSA_8OEz7zn7WiCOxVySl8TqcLxulYNt7tBT9C85tto_EoafNkIMbgV1AMPkOJjkeZ52VLY5PR02z06GFwwFPb9WQBAun4WHcd3JB2Heky3Q2WdDGPy8DGZn7suo0_8RdY7Wd7i7wTMA4osYIiL6NZ1CbuPJHGzmeX" alt="OK Mart" class="sidebar-logo-img">
        <span class="sidebar-logo-text">OK Mart</span>
        <span class="sidebar-badge">Admin</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html">📊 Dashboard</a>
        <a href="orders.html">📋 Orders</a>
        <a href="products.html">📦 Products</a>
        <a href="offers.html">🏷️ Offers</a>
        <a href="delivery.html">🚚 Delivery</a>
        <a href="customers.html">👥 Customers</a>
        <a href="settings.html">⚙️ Settings</a>
      </nav>
      <div class="sidebar-footer">
        <button onclick="logout()">🚪 Logout</button>
        <button onclick="window.open('../index.html','_blank')" style="margin-top:8px;">🏠 View Store</button>
      </div>
    </aside>

    <!-- Mobile Header -->
    <div class="mobile-header">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <span style="font-weight:700;">Order Details</span>
      <button class="menu-toggle" onclick="location.reload()">🔄</button>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Loading State -->
      <div id="loadingState" class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading order details...</p>
      </div>

      <!-- Order Detail Container -->
      <div id="orderDetailContainer" style="display: none;"></div>

    </main>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="../js/firebase.js"></script>
  <script>
    // ===== ORDER DETAIL PAGE =====
    
    // Get Order ID from URL
    function getOrderId() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('id');
    }
    
    // State
    let currentOrder = null;
    let map = null;
    let mapMarker = null;
    
    // Load Order
    async function loadOrder() {
      const orderId = getOrderId();
      if (!orderId) {
        showToast('No order ID provided', 'error');
        window.location.href = 'orders.html';
        return;
      }
      
      try {
        const doc = await db.collection('orders').doc(orderId).get();
        if (!doc.exists) {
          showToast('Order not found', 'error');
          window.location.href = 'orders.html';
          return;
        }
        
        currentOrder = { id: doc.id, ...doc.data() };
        renderOrderDetail();
        
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('orderDetailContainer').style.display = 'block';
        
      } catch (error) {
        console.error('Error loading order:', error);
        showToast('Error loading order', 'error');
      }
    }
    
    // Render Order Detail
    function renderOrderDetail() {
      const container = document.getElementById('orderDetailContainer');
      const order = currentOrder;
      const status = order.status || 'received';
      const isLocked = status === 'delivered' || status === 'cancelled';
      
      // Calculate totals
      const items = order.items || [];
      const subtotal = items.reduce((sum, item) => sum + (item.price * (item.quantity || 1)), 0);
      const deliveryCharge = order.deliveryCharge || 0;
      const discount = order.discount || 0;
      const total = subtotal + deliveryCharge - discount;
      
      // Items HTML
      const itemsHTML = items.map(item => `
        <div class="order-item">
          <img src="${item.image || 'https://via.placeholder.com/55'}" class="item-image" onerror="this.src='https://via.placeholder.com/55'">
          <div class="item-details">
            <div class="item-name">${escapeHtml(item.name)}</div>
            <div class="item-unit">${item.unit || ''}</div>
            <div class="item-price-row">
              <span class="item-quantity">Qty: ${item.quantity || 1} × ₹${item.price || 0}</span>
              <span class="item-total">₹${((item.price || 0) * (item.quantity || 1)).toFixed(2)}</span>
            </div>
          </div>
        </div>
      `).join('');
      
      // Timeline HTML
      const timelineHTML = renderTimeline(order);
      
      container.innerHTML = `
        <div class="order-detail-container">
          <!-- Order Header -->
          <div class="order-header">
            <div class="order-id-section">
              <h1>#${order.orderId || order.id.slice(0, 8).toUpperCase()}</h1>
              <div class="order-date">Placed on ${formatDate(order.orderDate)}</div>
            </div>
            <div class="order-status-section">
              <select class="status-select" id="orderStatusSelect" ${isLocked ? 'disabled' : ''}>
                <option value="received" ${status === 'received' ? 'selected' : ''}>📋 Received</option>
                <option value="confirmed" ${status === 'confirmed' ? 'selected' : ''}>✅ Confirmed</option>
                <option value="preparing" ${status === 'preparing' ? 'selected' : ''}>🍳 Preparing</option>
                <option value="out_for_delivery" ${status === 'out_for_delivery' ? 'selected' : ''}>🛵 Out for Delivery</option>
                <option value="delivered" ${status === 'delivered' ? 'selected' : ''}>🎉 Delivered</option>
                <option value="cancelled" ${status === 'cancelled' ? 'selected' : ''}>❌ Cancelled</option>
              </select>
              <button class="update-status-btn" id="updateStatusBtn" ${isLocked ? 'disabled' : ''}>Update Status</button>
            </div>
          </div>
          
          <!-- Two Column Layout -->
          <div class="order-detail-grid">
            
            <!-- LEFT COLUMN -->
            <div class="order-left-col">
              
              <!-- Customer Info -->
              <div class="info-card">
                <div class="card-header">
                  <span class="card-icon">👤</span>
                  <h3>Customer Information</h3>
                </div>
                <div class="info-content">
                  <div class="info-row">
                    <span class="info-label">Name:</span>
                    <span class="info-value">${escapeHtml(order.customerName || order.name || 'N/A')}</span>
                  </div>
                  <div class="info-row">
                    <span class="info-label">Phone:</span>
                    <span class="info-value">${order.customerPhone || order.phone || 'N/A'}</span>
                  </div>
                  <div class="info-row">
                    <span class="info-label">Email:</span>
                    <span class="info-value">${order.email || 'N/A'}</span>
                  </div>
                </div>
              </div>
              
              <!-- Delivery Info -->
              <div class="info-card">
                <div class="card-header">
                  <span class="card-icon">🚚</span>
                  <h3>Delivery Information</h3>
                </div>
                <div class="info-content">
                  <div class="info-row">
                    <span class="info-label">Address:</span>
                    <span class="info-value">${escapeHtml(order.customerAddress || order.address || 'N/A')}</span>
                  </div>
                  <div class="info-row">
                    <span class="info-label">City:</span>
                    <span class="info-value">${order.city || 'N/A'}</span>
                  </div>
                  <div class="info-row">
                    <span class="info-label">Pincode:</span>
                    <span class="info-value">${order.pincode || 'N/A'}</span>
                  </div>
                  <div class="info-row">
                    <span class="info-label">Delivery Type:</span>
                    <span class="info-value">${order.deliveryType === 'quick' ? '⚡ Quick (10-15 mins)' : '📅 Scheduled'}</span>
                  </div>
                  ${order.deliverySlot ? `<div class="info-row"><span class="info-label">Delivery Slot:</span><span class="info-value">${order.deliverySlot}</span></div>` : ''}
                </div>
              </div>
              
              <!-- Map Section -->
              ${order.location?.lat && order.location?.lng ? `
                <div class="info-card">
                  <div class="card-header">
                    <span class="card-icon">📍</span>
                    <h3>Delivery Location</h3>
                  </div>
                  <div id="orderMap" class="order-map"></div>
                  <a href="https://www.google.com/maps?q=${order.location.lat},${order.location.lng}" target="_blank" class="map-link">Open in Google Maps →</a>
                </div>
              ` : ''}
              
            </div>
            
            <!-- RIGHT COLUMN -->
            <div class="order-right-col">
              
              <!-- Order Items -->
              <div class="info-card">
                <div class="card-header">
                  <span class="card-icon">🛍️</span>
                  <h3>Order Items (${items.length})</h3>
                </div>
                <div class="items-list">${itemsHTML || '<div style="text-align:center;padding:20px;">No items</div>'}</div>
              </div>
              
              <!-- Order Summary -->
              <div class="info-card">
                <div class="card-header">
                  <span class="card-icon">💰</span>
                  <h3>Order Summary</h3>
                </div>
                <div class="summary-content">
                  <div class="summary-row">
                    <span>Subtotal:</span>
                    <span>₹${subtotal}</span>
                  </div>
                  ${deliveryCharge > 0 ? `<div class="summary-row"><span>Delivery Charge:</span><span>₹${deliveryCharge}</span></div>` : ''}
                  ${discount > 0 ? `<div class="summary-row discount-row"><span>Discount:</span><span>-₹${discount}</span></div>` : ''}
                  <div class="summary-row total-row">
                    <span>Total:</span>
                    <span>₹${total}</span>
                  </div>
                </div>
              </div>
              
              <!-- Action Buttons -->
              <div class="action-buttons">
                <button class="action-btn btn-primary" id="printOrderBtn">🖨️ Print Order</button>
                <button class="action-btn btn-warning" id="whatsappBtn">📱 WhatsApp</button>
                <button class="action-btn btn-danger" id="deleteOrderBtn" ${isLocked ? 'disabled' : ''}>🗑️ Delete Order</button>
                <a href="orders.html" class="action-btn btn-outline">← Back to Orders</a>
              </div>
              
              <!-- Order Timeline -->
              <div class="info-card">
                <div class="card-header">
                  <span class="card-icon">⏱️</span>
                  <h3>Order Timeline</h3>
                </div>
                <div class="timeline" id="orderTimeline">
                  ${timelineHTML}
                </div>
              </div>
              
            </div>
          </div>
        </div>
      `;
      
      // Initialize map if coordinates exist
      if (order.location?.lat && order.location?.lng) {
        setTimeout(() => {
          initMap(order.location.lat, order.location.lng);
        }, 100);
      }
      
      // Setup event listeners
      setupEventListeners();
    }
    
    // Render Timeline
    function renderTimeline(order) {
      const status = order.status || 'received';
      const createdAt = order.orderDate?.toDate ? order.orderDate.toDate() : new Date(order.orderDate);
      const confirmedAt = order.confirmedAt?.toDate ? order.confirmedAt.toDate() : null;
      const preparingAt = order.preparingAt?.toDate ? order.preparingAt.toDate() : null;
      const outForDeliveryAt = order.outForDeliveryAt?.toDate ? order.outForDeliveryAt.toDate() : null;
      const deliveredAt = order.deliveredAt?.toDate ? order.deliveredAt.toDate() : null;
      
      const steps = [
        { key: 'received', title: 'Order Received', icon: '📋', time: createdAt, completed: true },
        { key: 'confirmed', title: 'Order Confirmed', icon: '✅', time: confirmedAt, completed: status !== 'received' && status !== 'cancelled' },
        { key: 'preparing', title: 'Preparing', icon: '🍳', time: preparingAt, completed: status === 'preparing' || status === 'out_for_delivery' || status === 'delivered' },
        { key: 'out_for_delivery', title: 'Out for Delivery', icon: '🛵', time: outForDeliveryAt, completed: status === 'out_for_delivery' || status === 'delivered' },
        { key: 'delivered', title: 'Delivered', icon: '🎉', time: deliveredAt, completed: status === 'delivered' }
      ];
      
      let currentReached = false;
      
      return steps.map(step => {
        let isCompleted = step.completed;
        let isActive = false;
        
        if (!currentReached && !isCompleted && step.key !== 'delivered') {
          isActive = true;
          currentReached = true;
        }
        
        if (status === 'cancelled') {
          isCompleted = false;
          isActive = false;
        }
        
        const timeStr = step.time ? step.time.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';
        
        return `
          <div class="timeline-item">
            <div class="timeline-icon ${isCompleted ? 'completed' : (isActive ? 'active' : '')}">
              ${step.icon}
            </div>
            <div class="timeline-content">
              <div class="timeline-title">${step.title}</div>
              ${timeStr ? `<div class="timeline-time">${timeStr}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }
    
    // Initialize Map
    function initMap(lat, lng) {
      const mapContainer = document.getElementById('orderMap');
      if (!mapContainer) return;
      
      if (map) map.remove();
      
      map = L.map('orderMap').setView([lat, lng], 15);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
      }).addTo(map);
      
      L.marker([lat, lng]).addTo(map).bindPopup('<b>Delivery Location</b>').openPopup();
      L.circle([lat, lng], { radius: 500, color: '#84c225', fillColor: '#84c225', fillOpacity: 0.1 }).addTo(map);
    }
    
    // Update Order Status
    async function updateOrderStatus() {
      const newStatus = document.getElementById('orderStatusSelect').value;
      const confirmed = confirm(`Change order status to "${newStatus.toUpperCase()}"?`);
      if (!confirmed) return;
      
      try {
        const updateData = {
          status: newStatus,
          updatedAt: new Date().toISOString()
        };
        
        if (newStatus === 'delivered') {
          updateData.deliveredAt = new Date().toISOString();
        }
        
        await db.collection('orders').doc(currentOrder.id).update(updateData);
        currentOrder.status = newStatus;
        if (newStatus === 'delivered') currentOrder.deliveredAt = new Date().toISOString();
        
        // Re-render timeline
        const timelineContainer = document.getElementById('orderTimeline');
        if (timelineContainer) {
          timelineContainer.innerHTML = renderTimeline(currentOrder);
        }
        
        showToast(`Order status updated to ${newStatus}`, 'success');
      } catch (error) {
        showToast('Error updating status', 'error');
      }
    }
    
    // Delete Order
    async function deleteOrder() {
      const confirmed = confirm('⚠️ Are you sure you want to DELETE this order?\nThis action cannot be undone!');
      if (!confirmed) return;
      
      try {
        await db.collection('orders').doc(currentOrder.id).delete();
        showToast('Order deleted successfully', 'success');
        setTimeout(() => {
          window.location.href = 'orders.html';
        }, 1500);
      } catch (error) {
        showToast('Error deleting order', 'error');
      }
    }
    
    // Print Order
    function printOrder() {
      const printContent = document.getElementById('orderDetailContainer').cloneNode(true);
      const originalTitle = document.title;
      
      document.title = `Order_${currentOrder.id.slice(0, 8)}`;
      
      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <html>
          <head>
            <title>${document.title}</title>
            <style>
              body { font-family: Arial, sans-serif; padding: 20px; }
              .action-buttons, .update-status-btn, .status-select, .map-link { display: none; }
              .order-header { margin-top: 0; }
              table { width: 100%; border-collapse: collapse; }
              th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
            </style>
          </head>
          <body>${printContent.innerHTML}</body>
        </html>
      `);
      printWindow.document.close();
      printWindow.print();
      
      document.title = originalTitle;
    }
    
    // Send WhatsApp
    function sendWhatsApp() {
      const phone = currentOrder.customerPhone || currentOrder.phone;
      if (!phone) {
        showToast('No phone number found', 'error');
        return;
      }
      
      const message = `🛒 *OK Mart Order Update*\n\nOrder ID: #${currentOrder.id.slice(0, 8).toUpperCase()}\nStatus: ${currentOrder.status}\nTotal: ₹${currentOrder.total || 0}\n\nThank you for shopping with OK Mart! 🚀`;
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    }
    
    // Setup Event Listeners
    function setupEventListeners() {
      const updateBtn = document.getElementById('updateStatusBtn');
      const deleteBtn = document.getElementById('deleteOrderBtn');
      const printBtn = document.getElementById('printOrderBtn');
      const whatsappBtn = document.getElementById('whatsappBtn');
      
      if (updateBtn) updateBtn.addEventListener('click', updateOrderStatus);
      if (deleteBtn) deleteBtn.addEventListener('click', deleteOrder);
      if (printBtn) printBtn.addEventListener('click', printOrder);
      if (whatsappBtn) whatsappBtn.addEventListener('click', sendWhatsApp);
    }
    
    // Helper Functions
    function formatDate(timestamp) {
      if (!timestamp) return 'N/A';
      let date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return date.toLocaleDateString('en-IN', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }
    
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    
    function showToast(message, type) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    function logout() {
      if (typeof adminLogout === 'function') {
        adminLogout();
      } else if (confirm('Are you sure you want to logout?')) {
        const keys = ['okmart_isAdmin','okmart_admin_username','okmart_admin_loginTime','okmart_admin_role','adminLoggedIn','adminEmail'];
        keys.forEach(k => localStorage.removeItem(k));
        window.location.href = 'login.html';
      }
    }
    
    // Initialize
    loadOrder();
  </script>
</body>
</html>
