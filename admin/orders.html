<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Order Management | OK Mart Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1a1e2b;min-height:100vh}
    .admin-layout{display:flex;min-height:100vh}
    .sidebar{width:250px;background:#1a1e2b;color:white;position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column}
    .sidebar-brand{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
    .sidebar-brand span{font-size:1.2rem;font-weight:700}
    .sidebar-badge{background:#2ecc71;padding:3px 10px;border-radius:20px;font-size:.6rem;text-transform:uppercase;font-weight:600}
    .sidebar-nav{flex:1;padding:20px 0}
    .sidebar-nav a{display:flex;align-items:center;gap:12px;padding:14px 24px;color:rgba(255,255,255,.7);text-decoration:none;font-weight:500}
    .sidebar-nav a:hover,.sidebar-nav a.active{background:rgba(255,255,255,.08);color:white}
    .sidebar-nav a.active{border-left:3px solid #2ecc71}
    .sidebar-footer{padding:20px;border-top:1px solid rgba(255,255,255,.1)}
    .sidebar-footer button{width:100%;padding:12px;background:rgba(255,255,255,.1);border:none;color:white;border-radius:10px;cursor:pointer}
    .main-content{flex:1;margin-left:250px;padding:24px}
    h1{font-size:1.8rem;font-weight:800;margin-bottom:24px}
    .filter-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .filter-tab{padding:10px 18px;background:white;border:1.5px solid #e5e7eb;border-radius:40px;cursor:pointer;font-weight:500;font-size:.85rem}
    .filter-tab.active{background:#2ecc71;color:white;border-color:#2ecc71}
    .order-card{background:white;border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.04);margin-bottom:12px;border:1px solid #e5e7eb}
    .order-top{display:flex;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}
    .order-id{font-weight:700;font-family:monospace;color:#27ae60}
    .order-customer{font-weight:600}
    .order-bottom{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
    .order-total{font-weight:700;font-size:1.1rem}
    .order-date{font-size:.8rem;color:#6b7280}
    .status-select{padding:8px 12px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:.8rem;font-weight:600;cursor:pointer}
    .status-received{background:#fef3c7;border-color:#f59e0b;color:#92400e}
    .status-preparing{background:#dbeafe;border-color:#3b82f6;color:#1e40af}
    .status-outfordelivery{background:#d1fae5;border-color:#10b981;color:#065f46}
    .status-delivered{background:#e0e7ff;border-color:#6366f1;color:#3730a3}
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1e2b;color:white;padding:12px 24px;border-radius:40px;z-index:300;opacity:0;transition:.3s}
    .toast.show{opacity:1;bottom:50px}.toast.success{background:#10b981}
    @media(max-width:768px){.sidebar{display:none}.main-content{margin-left:0;padding:16px}}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><span>🛒 OK Mart</span><span class="sidebar-badge">Admin</span></div>
      <nav class="sidebar-nav">
        <a href="index.html">📊 Dashboard</a>
        <a href="products.html">📦 Products</a>
        <a href="orders.html" class="active">📋 Orders</a>
        <a href="offers.html">🏷️ Offers</a>
      </nav>
      <div class="sidebar-footer"><button onclick="location.href='/'">🚪 Exit</button></div>
    </aside>
    <main class="main-content">
      <h1>📋 Order Management</h1>
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-status="all">All</button>
        <button class="filter-tab" data-status="received">Received</button>
        <button class="filter-tab" data-status="preparing">Preparing</button>
        <button class="filter-tab" data-status="outfordelivery">Out for Delivery</button>
        <button class="filter-tab" data-status="delivered">Delivered</button>
      </div>
      <div class="orders-list" id="ordersList"><p style="color:#6b7280;">Loading...</p></div>
    </main>
    <div class="toast" id="toast"></div>
  </div>
  <script src="/js/firebase.js"></script>
  <script>
    let filter='all';
    document.querySelectorAll('.filter-tab').forEach(t=>t.addEventListener('click',function(){
      document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
      this.classList.add('active');
      filter=this.dataset.status;
      renderOrders();
    }));
    db.collection('orders').orderBy('orderDate','desc').onSnapshot(s=>{
      window._orders=[];
      s.forEach(doc=>window._orders.push({id:doc.id,...doc.data()}));
      renderOrders();
    });
    function renderOrders(){
      let orders=window._orders||[];
      if(filter!=='all') orders=orders.filter(o=>o.status===filter);
      const list=document.getElementById('ordersList');
      if(!orders.length){list.innerHTML='<p style="color:#6b7280;">No orders</p>';return}
      list.innerHTML=orders.map(o=>`<div class="order-card"><div class="order-top"><span class="order-id">#${o.orderId||o.id.slice(-8)}</span><span class="order-customer">${o.customerName||'-'} · ${o.customerPhone||'-'}</span></div><div class="order-bottom"><div><span class="order-total">₹${(o.total||0).toLocaleString('en-IN')}</span><br><span class="order-date">${new Date(o.orderDate).toLocaleDateString('en-IN')}</span></div><select class="status-select status-${o.status||'received'}" onchange="updateStatus('${o.id}',this.value)"><option value="received" ${o.status==='received'?'selected':''}>📋 Received</option><option value="preparing" ${o.status==='preparing'?'selected':''}>🟡 Preparing</option><option value="outfordelivery" ${o.status==='outfordelivery'?'selected':''}>🚚 Out for Delivery</option><option value="delivered" ${o.status==='delivered'?'selected':''}>✅ Delivered</option></select></div></div>`).join('');
    }
    async function updateStatus(id,status){
      try{
        await db.collection('orders').doc(id).update({status});
        showToast('Status updated!','success');
      }catch(err){showToast('Error','error')}
    }
    function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(type||'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
  </script>
</body>
</html>
