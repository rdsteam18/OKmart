<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Order Management | OK Mart Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2ecc71">

  <!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #2ecc71; --primary-dark: #27ae60; --primary-light: #e8f8ef;
      --bg: #f8fafc; --card: #ffffff; --text: #1a1e2b; --muted: #6b7280;
      --border: #e5e7eb; --danger: #ef4444; --warning: #f59e0b; --info: #3b82f6;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.04); --shadow-md: 0 8px 24px rgba(0,0,0,.06);
      --radius: 16px; --transition: all .2s ease;
    }
    
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    
    .admin-layout { display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar { width: 260px; background: #1a1e2b; color: white; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; transition: transform .3s; }
    .sidebar-brand { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 10px; }
    .sidebar-logo { font-size: 1.3rem; font-weight: 700; }
    .sidebar-badge { background: var(--primary); padding: 3px 10px; border-radius: 20px; font-size: .65rem; font-weight: 600; text-transform: uppercase; }
    .sidebar-nav { flex: 1; padding: 20px 0; }
    .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: rgba(255,255,255,.7); text-decoration: none; font-weight: 500; transition: var(--transition); }
    .sidebar-nav a:hover { background: rgba(255,255,255,.06); color: white; }
    .sidebar-nav a.active { background: rgba(46,204,113,.1); color: var(--primary); border-left: 3px solid var(--primary); }
    .sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,.1); }
    .sidebar-footer button { width: 100%; padding: 12px; background: rgba(255,255,255,.08); border: none; color: rgba(255,255,255,.7); border-radius: 10px; cursor: pointer; }
    
    .mobile-header { display: none; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; align-items: center; justify-content: space-between; }
    .menu-toggle { background: var(--bg); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
    
    .main-content { flex: 1; margin-left: 260px; padding: 24px; max-width: 1300px; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 24px; }
    
    /* Filter Tabs */
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-tab { padding: 10px 18px; background: var(--card); border: 1.5px solid var(--border); border-radius: 40px; cursor: pointer; font-weight: 500; font-size: .85rem; transition: var(--transition); }
    .filter-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .orders-list { display: flex; flex-direction: column; gap: 12px; }
    
    /* Order Card */
    .order-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; }
    .order-card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; cursor: pointer; flex-wrap: wrap; gap: 8px; }
    .order-card-header:active { background: var(--bg); }
    .order-id { font-weight: 700; font-family: monospace; color: var(--primary-dark); }
    .order-customer { font-weight: 600; }
    .order-total { font-weight: 700; }
    .expand-arrow { transition: transform .3s; }
    .expand-arrow.open { transform: rotate(180deg); }
    
    /* Expanded Details */
    .order-details { display: none; padding: 0 18px 18px; border-top: 1px solid var(--border); animation: slideDown .3s ease; }
    .order-details.open { display: block; }
    @keyframes slideDown { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 2000px; } }
    
    .details-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin: 16px 0; }
    
    .section-box { background: var(--bg); border-radius: 14px; padding: 16px; }
    .section-box h4 { font-size: .9rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    
    /* Cart Items (Editable) */
    .cart-editor { display: flex; flex-direction: column; gap: 8px; }
    .cart-item-row { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); transition: var(--transition); }
    .cart-item-row:active { background: var(--bg); }
    .cart-item-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #f1f5f9; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: 600; font-size: .85rem; }
    .cart-item-price { font-size: .75rem; color: var(--muted); }
    .qty-control { display: flex; align-items: center; gap: 4px; background: var(--bg); padding: 2px; border-radius: 20px; }
    .qty-btn { width: 26px; height: 26px; border-radius: 50%; background: white; border: 1.5px solid var(--border); font-size: .9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: 600; }
    .qty-btn:active { background: var(--primary); color: white; }
    .qty-num { min-width: 18px; text-align: center; font-weight: 600; font-size: .8rem; }
    .remove-item-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; padding: 4px; }
    
    .cart-total-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: .9rem; }
    .cart-total-row.grand { font-weight: 700; font-size: 1.1rem; border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 10px; }
    
    /* Add Product Search */
    .add-product-section { margin-top: 12px; }
    .mini-search { position: relative; }
    .mini-search input { width: 100%; padding: 10px 14px; background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; font-size: .85rem; }
    .mini-search input:focus { outline: none; border-color: var(--primary); }
    .mini-results { max-height: 180px; overflow-y: auto; margin-top: 4px; border-radius: 10px; border: 1px solid var(--border); display: none; background: var(--card); }
    .mini-results.show { display: block; }
    .mini-result-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: .85rem; }
    .mini-result-item:hover { background: var(--bg); }
    .mini-result-item:last-child { border-bottom: none; }
    .mini-add-btn { background: var(--primary-light); border: 1px solid var(--primary); color: var(--primary-dark); padding: 4px 10px; border-radius: 20px; font-weight: 600; font-size: .7rem; cursor: pointer; }
    
    /* Status Control */
    .status-control { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .status-select { padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--border); font-size: .8rem; font-weight: 600; cursor: pointer; }
    .status-select.received { background: #f3f4f6; }
    .status-select.preparing { background: #fef3c7; }
    .status-select.outfordelivery { background: #dbeafe; }
    .status-select.delivered { background: #d1fae5; }
    .status-select.cancelled { background: #fee2e2; }
    
    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: .7rem; font-weight: 600; }
    .status-received { background: #f3f4f6; color: #374151; }
    .status-preparing { background: #fef3c7; color: #92400e; }
    .status-outfordelivery { background: #dbeafe; color: #1e40af; }
    .status-delivered { background: #d1fae5; color: #065f46; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }
    
    .save-cart-btn { padding: 10px 18px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: .8rem; }
    .save-cart-btn:disabled { opacity: .4; cursor: not-allowed; }
    .locked-badge { background: #d1fae5; color: #065f46; padding: 6px 14px; border-radius: 8px; font-size: .8rem; font-weight: 600; }
    
    .no-orders { text-align: center; padding: 60px; color: var(--muted); }
    
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--text); color: white; padding: 12px 24px; border-radius: 40px; font-weight: 500; z-index: 300; opacity: 0; transition: .3s; }
    .toast.show { opacity: 1; bottom: 50px; } .toast.success { background: #10b981; }
    
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; padding: 16px; } .mobile-header { display: flex; } .details-grid { grid-template-columns: 1fr; } }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="admin-layout">
    
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span class="sidebar-logo">🛒 OK Mart</span><span class="sidebar-badge">Admin</span></div>
      <nav class="sidebar-nav">
        <a href="index.html">📊 Dashboard</a><a href="orders.html" class="active">📋 Orders</a>
        <a href="products.html">📦 Products</a><a href="offers.html">🏷️ Offers</a>
        <a href="customers.html">👥 Customers</a><a href="settings.html">⚙️ Settings</a>
      </nav>
      <div class="sidebar-footer"><button onclick="adminLogout()">🚪 Logout</button></div>
    </aside>

    <div class="mobile-header">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <span style="font-weight:700;">Order Management</span><span></span>
    </div>

    <main class="main-content">
      <h1>📋 Order Management</h1>
      
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-status="all">All</button>
        <button class="filter-tab" data-status="received">Received</button>
        <button class="filter-tab" data-status="preparing">Preparing</button>
        <button class="filter-tab" data-status="outfordelivery">Delivery</button>
        <button class="filter-tab" data-status="delivered">Delivered</button>
      </div>
      
      <div class="orders-list" id="ordersList"><div class="no-orders">Loading orders...</div></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/firebase.js"></script>
  <script src="/js/admin-auth.js"></script>
  <script>
    // ===== ORDER MANAGEMENT WITH CART CONTROL =====
    
    let allOrders = [];
    let allProducts = [];
    let activeFilter = 'all';
    let expandedOrderId = null;
    let editItems = {};
    let editOrderTotal = 0;
    
    // ========== LOAD PRODUCTS (for search) ==========
    db.collection('products').onSnapshot(s => { allProducts = []; s.forEach(d => allProducts.push({ id: d.id, ...d.data() })); });
    
    // ========== LOAD ORDERS ==========
    db.collection('orders').orderBy('orderDate', 'desc').onSnapshot(s => {
      allOrders = []; s.forEach(d => allOrders.push({ id: d.id, ...d.data() }));
      renderOrders();
    });
    
    // Filter tabs
    document.querySelectorAll('.filter-tab').forEach(t => {
      t.addEventListener('click', function() {
        document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        activeFilter = this.dataset.status;
        renderOrders();
      });
    });
    
    // ========== RENDER ORDERS ==========
    function renderOrders() {
      let filtered = [...allOrders];
      if (activeFilter !== 'all') filtered = filtered.filter(o => o.status === activeFilter);
      
      const list = document.getElementById('ordersList');
      if (filtered.length === 0) { list.innerHTML = '<div class="no-orders">No orders found</div>'; return; }
      
      list.innerHTML = filtered.map(o => {
        const isExpanded = expandedOrderId === o.id;
        const isLocked = o.status === 'delivered' || o.status === 'cancelled';
        const status = o.status || 'received';
        
        // Use editable items if expanded, otherwise original
        const displayItems = isExpanded ? (editItems[o.id] || [...(o.items || [])]) : (o.items || []);
        const displayTotal = isExpanded ? editOrderTotal : (o.total || 0);
        
        const itemsHTML = displayItems.map((item, idx) => `
          <div class="cart-item-row">
            <img src="${item.image}" class="cart-item-img" onerror="this.src='https://via.placeholder.com/40'">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-price">₹${item.price || 0} each</div>
            </div>
            ${!isLocked ? `
              <div class="qty-control">
                <button class="qty-btn" onclick="editItemQty('${o.id}', ${idx}, -1)">−</button>
                <span class="qty-num">${item.quantity || 1}</span>
                <button class="qty-btn" onclick="editItemQty('${o.id}', ${idx}, 1)">+</button>
              </div>
              <button class="remove-item-btn" onclick="editRemoveItem('${o.id}', ${idx})">🗑️</button>
            ` : `<span style="font-size:.8rem;color:var(--muted);">Qty: ${item.quantity || 1}</span>`}
          </div>
        `).join('');
        
        const itemCount = displayItems.length;
        const subtotal = displayItems.reduce((s, i) => s + (i.price || 0) * (i.quantity || 1), 0);
        
        return `
          <div class="order-card">
            <div class="order-card-header" onclick="toggleOrder('${o.id}')">
              <span class="order-id">#${o.orderId || o.id.slice(-8).toUpperCase()}</span>
              <span class="status-badge status-${status}">${status}</span>
              <span class="order-customer">${o.customerName || o.name || 'Customer'}</span>
              <span class="order-total">₹${(isExpanded ? subtotal : displayTotal).toLocaleString('en-IN')}</span>
              <span style="font-size:.8rem;color:var(--muted);">${new Date(o.orderDate).toLocaleDateString('en-IN')}</span>
              <span class="expand-arrow ${isExpanded ? 'open' : ''}">▼</span>
            </div>
            
            <div class="order-details ${isExpanded ? 'open' : ''}">
              <div class="details-grid">
                
                <!-- Cart Editor -->
                <div class="section-box">
                  <h4>🛒 Cart Items (${itemCount})</h4>
                  <div class="cart-editor">${itemsHTML || '<p style="color:var(--muted);">No items</p>'}</div>
                  
                  ${!isLocked ? `
                    <!-- Add Product -->
                    <div class="add-product-section">
                      <div class="mini-search">
                        <input type="text" placeholder="➕ Search & add product..." oninput="searchProductsForOrder(this, '${o.id}')" autocomplete="off">
                        <div class="mini-results" id="results-${o.id}"></div>
                      </div>
                    </div>
                    <button class="save-cart-btn" onclick="saveCartChanges('${o.id}')" style="margin-top:10px;width:100%;">💾 Save Cart Changes</button>
                  ` : `<div class="locked-badge" style="margin-top:10px;">🔒 Order is ${status} - Cart locked</div>`}
                  
                  <div class="cart-total-row grand" style="margin-top:12px;"><span>Cart Total</span><span id="cartTotal-${o.id}">₹${subtotal.toLocaleString('en-IN')}</span></div>
                </div>
                
                <!-- Address & Status -->
                <div>
                  <div class="section-box" style="margin-bottom:12px;">
                    <h4>📍 Address</h4>
                    <p style="font-size:.85rem;"><strong>${o.customerName || o.name}</strong><br>📱 ${o.customerPhone || o.phone}<br>🏠 ${o.customerAddress || o.address || 'N/A'}</p>
                  </div>
                  
                  <div class="section-box">
                    <h4>⚡ Status Control</h4>
                    <div class="status-control">
                      <select class="status-select ${status}" onchange="updateOrderStatus('${o.id}', this.value)">
                        <option value="received" ${status==='received'?'selected':''}>📋 Received</option>
                        <option value="preparing" ${status==='preparing'?'selected':''}>🟡 Preparing</option>
                        <option value="outfordelivery" ${status==='outfordelivery'?'selected':''}>🚚 Delivery</option>
                        <option value="delivered" ${status==='delivered'?'selected':''}>✅ Delivered</option>
                        <option value="cancelled" ${status==='cancelled'?'selected':''}>❌ Cancelled</option>
                      </select>
                    </div>
                  </div>
                  
                  <div style="margin-top:12px;display:flex;gap:8px;">
                    <a href="invoice.html?id=${o.id}" target="_blank" class="save-cart-btn" style="flex:1;text-align:center;text-decoration:none;background:var(--info);">🧾 Invoice</a>
                    <button class="save-cart-btn" style="flex:1;background:#25D366;" onclick="sendWhatsApp('${o.id}')">💬 WhatsApp</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // ========== TOGGLE ORDER ==========
    window.toggleOrder = function(orderId) {
      if (expandedOrderId === orderId) {
        expandedOrderId = null;
        delete editItems[orderId];
      } else {
        expandedOrderId = orderId;
        const order = allOrders.find(o => o.id === orderId);
        if (order) {
          editItems[orderId] = JSON.parse(JSON.stringify(order.items || []));
          editOrderTotal = order.total || 0;
        }
      }
      renderOrders();
    };
    
    // ========== EDIT CART ITEMS ==========
    window.editItemQty = function(orderId, idx, delta) {
      const items = editItems[orderId] || [];
      if (!items[idx]) return;
      items[idx].quantity = Math.max(0, (items[idx].quantity || 1) + delta);
      if (items[idx].quantity <= 0) items.splice(idx, 1);
      editItems[orderId] = items;
      recalcTotal(orderId);
      renderOrders();
    };
    
    window.editRemoveItem = function(orderId, idx) {
      const items = editItems[orderId] || [];
      items.splice(idx, 1);
      editItems[orderId] = items;
      recalcTotal(orderId);
      renderOrders();
    };
    
    function recalcTotal(orderId) {
      const items = editItems[orderId] || [];
      editOrderTotal = items.reduce((s, i) => s + (i.price || 0) * (i.quantity || 1), 0);
    }
    
    // ========== SEARCH & ADD PRODUCT ==========
    window.searchProductsForOrder = function(input, orderId) {
      const q = input.value.toLowerCase().trim();
      const container = document.getElementById('results-' + orderId);
      if (q.length < 2) { container.classList.remove('show'); return; }
      
      const results = allProducts.filter(p => p.name.toLowerCase().includes(q)).slice(0, 6);
      container.innerHTML = results.map(p => `
        <div class="mini-result-item">
          <span>${p.name} · ₹${p.price}</span>
          <button class="mini-add-btn" onclick="addProductToOrder('${orderId}', '${p.id}')">+ Add</button>
        </div>
      `).join('');
      container.classList.add('show');
    };
    
    window.addProductToOrder = function(orderId, productId) {
      const product = allProducts.find(p => p.id === productId);
      if (!product) return;
      
      const items = editItems[orderId] || [];
      const existing = items.find(i => i.id === productId);
      if (existing) existing.quantity++;
      else items.push({ id: product.id, name: product.name, price: product.price, mrp: product.mrp, image: product.image, unit: product.unit, quantity: 1 });
      editItems[orderId] = items;
      recalcTotal(orderId);
      
      document.getElementById('results-' + orderId).classList.remove('show');
      renderOrders();
      showToast(`${product.name} added!`, 'success');
    };
    
    // ========== SAVE CART CHANGES ==========
    window.saveCartChanges = async function(orderId) {
      const items = editItems[orderId];
      if (!items) return;
      
      const total = items.reduce((s, i) => s + (i.price || 0) * (i.quantity || 1), 0);
      const delivery = (allOrders.find(o => o.id === orderId)?.delivery) || 0;
      
      try {
        await db.collection('orders').doc(orderId).update({ items, total: total + delivery, subtotal: total });
        
        // Update local state
        const order = allOrders.find(o => o.id === orderId);
        if (order) { order.items = items; order.total = total + delivery; order.subtotal = total; }
        
        delete editItems[orderId];
        expandedOrderId = null;
        renderOrders();
        showToast('✅ Cart updated! Total: ₹' + total.toLocaleString('en-IN'), 'success');
      } catch (err) { showToast('❌ Error saving', 'error'); }
    };
    
    // ========== UPDATE STATUS ==========
    window.updateOrderStatus = async function(orderId, status) {
      try {
        await db.collection('orders').doc(orderId).update({ status });
        
        const order = allOrders.find(o => o.id === orderId);
        if (order) order.status = status;
        renderOrders();
        showToast(`Status updated to "${status}"`, 'success');
      } catch (err) { showToast('Error', 'error'); }
    };
    
    // ========== WHATSAPP ==========
    window.sendWhatsApp = function(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;
      const phone = order.customerPhone || order.phone;
      if (phone) window.open(`https://wa.me/91${phone}`, '_blank');
    };
    
    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = `toast ${type}`; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>
</body>
