<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Order Management | OK Mart Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2ecc71">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #2ecc71; --primary-dark: #27ae60; --primary-light: #e8f8ef;
      --bg: #f8fafc; --card: #ffffff; --text: #1a1e2b; --muted: #6b7280;
      --border: #e5e7eb; --danger: #ef4444; --warning: #f59e0b; --info: #3b82f6;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.04); --shadow-md: 0 8px 24px rgba(0,0,0,.06);
      --radius: 16px; --transition: all .2s ease;
    }
    
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    
    .admin-layout { display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar { width: 260px; background: #1a1e2b; color: white; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; transition: transform .3s; }
    .sidebar-brand { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 10px; }
    .sidebar-logo { font-size: 1.3rem; font-weight: 700; }
    .sidebar-badge { background: var(--primary); padding: 3px 10px; border-radius: 20px; font-size: .65rem; font-weight: 600; text-transform: uppercase; }
    .sidebar-nav { flex: 1; padding: 20px 0; }
    .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: rgba(255,255,255,.7); text-decoration: none; font-weight: 500; transition: var(--transition); }
    .sidebar-nav a:hover { background: rgba(255,255,255,.06); color: white; }
    .sidebar-nav a.active { background: rgba(46,204,113,.1); color: var(--primary); border-left: 3px solid var(--primary); }
    .sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,.1); }
    .sidebar-footer button { width: 100%; padding: 12px; background: rgba(255,255,255,.08); border: none; color: rgba(255,255,255,.7); border-radius: 10px; cursor: pointer; }
    
    .mobile-header { display: none; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; align-items: center; justify-content: space-between; }
    .menu-toggle { background: var(--bg); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
    
    .main-content { flex: 1; margin-left: 260px; padding: 24px; max-width: 1300px; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 24px; }
    
    /* Stats Row */
    .stats-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card { background: var(--card); border-radius: var(--radius); padding: 16px 20px; flex: 1; min-width: 120px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
    .stat-card .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .stat-card .stat-label { font-size: .8rem; color: var(--muted); }
    
    /* Filter Tabs */
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-tab { padding: 10px 18px; background: var(--card); border: 1.5px solid var(--border); border-radius: 40px; cursor: pointer; font-weight: 500; font-size: .85rem; transition: var(--transition); }
    .filter-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    /* Search Bar */
    .search-bar { margin-bottom: 20px; }
    .search-input { width: 100%; max-width: 300px; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 40px; font-size: .85rem; background: var(--card); }
    .search-input:focus { outline: none; border-color: var(--primary); }
    
    .orders-list { display: flex; flex-direction: column; gap: 12px; }
    
    /* Order Card */
    .order-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; }
    .order-card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; cursor: pointer; flex-wrap: wrap; gap: 8px; background: var(--card); transition: var(--transition); }
    .order-card-header:hover { background: var(--bg); }
    .order-id { font-weight: 700; font-family: monospace; color: var(--primary-dark); }
    .order-customer { font-weight: 600; }
    .order-total { font-weight: 700; }
    .expand-arrow { transition: transform .3s; }
    .expand-arrow.open { transform: rotate(180deg); }
    
    /* Status Badge */
    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: .7rem; font-weight: 600; }
    .status-received { background: #fef3c7; color: #92400e; }
    .status-preparing { background: #dbeafe; color: #1e40af; }
    .status-outfordelivery { background: #e0e7ff; color: #4338ca; }
    .status-delivered { background: #d1fae5; color: #065f46; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }
    
    /* View Details Button */
    .view-details-btn { background: var(--primary); color: white; border: none; padding: 6px 14px; border-radius: 8px; font-size: .7rem; font-weight: 500; cursor: pointer; transition: var(--transition); }
    .view-details-btn:hover { background: var(--primary-dark); }
    
    /* Expanded Details */
    .order-details { display: none; padding: 0 18px 18px; border-top: 1px solid var(--border); animation: slideDown .3s ease; }
    .order-details.open { display: block; }
    @keyframes slideDown { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 2000px; } }
    
    .details-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin: 16px 0; }
    @media (max-width: 768px) { .details-grid { grid-template-columns: 1fr; } }
    
    .section-box { background: var(--bg); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .section-box h4 { font-size: .9rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    
    /* Map Container */
    .order-map { height: 180px; border-radius: 12px; overflow: hidden; margin-top: 8px; background: #e2e8f0; }
    .map-link { font-size: .7rem; color: var(--primary); text-decoration: none; display: inline-block; margin-top: 6px; }
    
    /* Cart Items */
    .cart-editor { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
    .cart-item-row { display: flex; align-items: center; gap: 10px; padding: 8px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); }
    .cart-item-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #f1f5f9; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: 600; font-size: .85rem; }
    .cart-item-price { font-size: .75rem; color: var(--muted); }
    .qty-control { display: flex; align-items: center; gap: 4px; background: var(--bg); padding: 2px; border-radius: 20px; }
    .qty-btn { width: 26px; height: 26px; border-radius: 50%; background: white; border: 1.5px solid var(--border); font-size: .9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .qty-num { min-width: 18px; text-align: center; font-weight: 600; font-size: .8rem; }
    .remove-item-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; }
    
    .cart-total-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: .9rem; }
    .cart-total-row.grand { font-weight: 700; font-size: 1rem; border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 10px; }
    
    /* Add Product */
    .add-product-section { margin-top: 12px; }
    .mini-search { position: relative; }
    .mini-search input { width: 100%; padding: 8px 12px; background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; font-size: .8rem; }
    .mini-results { max-height: 150px; overflow-y: auto; margin-top: 4px; border-radius: 10px; border: 1px solid var(--border); display: none; background: var(--card); }
    .mini-results.show { display: block; }
    .mini-result-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: .8rem; }
    .mini-result-item:hover { background: var(--bg); }
    .mini-add-btn { background: var(--primary-light); border: 1px solid var(--primary); color: var(--primary-dark); padding: 4px 10px; border-radius: 20px; font-size: .7rem; cursor: pointer; }
    
    /* Status Control */
    .status-control { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .status-select { padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--border); font-size: .8rem; font-weight: 500; cursor: pointer; }
    
    .save-cart-btn { padding: 10px 16px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: .8rem; width: 100%; margin-top: 10px; }
    .locked-badge { background: #d1fae5; color: #065f46; padding: 6px 12px; border-radius: 8px; font-size: .75rem; font-weight: 600; text-align: center; }
    
    .no-orders { text-align: center; padding: 60px; color: var(--muted); }
    
    /* Timeline */
    .timeline { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .timeline-item { display: flex; gap: 10px; align-items: flex-start; }
    .timeline-icon { width: 28px; height: 28px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .8rem; border: 1px solid var(--border); }
    .timeline-icon.completed { background: var(--primary); color: white; border-color: var(--primary); }
    .timeline-content { flex: 1; }
    .timeline-title { font-weight: 600; font-size: .75rem; }
    .timeline-time { font-size: .65rem; color: var(--muted); }
    
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--text); color: white; padding: 12px 24px; border-radius: 40px; font-weight: 500; z-index: 300; opacity: 0; transition: .3s; }
    .toast.show { opacity: 1; bottom: 50px; } .toast.success { background: #10b981; }
    
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; padding: 16px; } .mobile-header { display: flex; } }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="admin-layout">
    
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span class="sidebar-logo">🛒 OK Mart</span><span class="sidebar-badge">Admin</span></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">📊 Dashboard</a><a href="orders.html" class="active">📋 Orders</a>
        <a href="products.html">📦 Products</a><a href="offers.html">🏷️ Offers</a>
        <a href="customers.html">👥 Customers</a><a href="settings.html">⚙️ Settings</a>
      </nav>
      <div class="sidebar-footer"><button onclick="adminLogout()">🚪 Logout</button></div>
    </aside>

    <div class="mobile-header">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <span style="font-weight:700;">Order Management</span><span></span>
    </div>

    <main class="main-content">
      <h1>📋 Order Management</h1>
      
      <!-- Stats Row -->
      <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="stat-value" id="totalOrders">0</div><div class="stat-label">Total Orders</div></div>
        <div class="stat-card"><div class="stat-value" id="pendingCount">0</div><div class="stat-label">Pending</div></div>
        <div class="stat-card"><div class="stat-value" id="deliveredCount">0</div><div class="stat-label">Delivered</div></div>
        <div class="stat-card"><div class="stat-value" id="todayRevenue">₹0</div><div class="stat-label">Today's Revenue</div></div>
      </div>
      
      <!-- Search Bar -->
      <div class="search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search by order ID, name, phone..." autocomplete="off">
      </div>
      
      <!-- Filter Tabs -->
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-status="all">All</button>
        <button class="filter-tab" data-status="received">📋 Received</button>
        <button class="filter-tab" data-status="preparing">🍳 Preparing</button>
        <button class="filter-tab" data-status="outfordelivery">🛵 Out for Delivery</button>
        <button class="filter-tab" data-status="delivered">✅ Delivered</button>
        <button class="filter-tab" data-status="cancelled">❌ Cancelled</button>
      </div>
      
      <div class="orders-list" id="ordersList"><div class="no-orders">Loading orders...</div></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/firebase.js"></script>
  <script>
    // ===== COMPLETE ORDER MANAGEMENT SYSTEM =====
    
    let allOrders = [];
    let allProducts = [];
    let activeFilter = 'all';
    let expandedOrderId = null;
    let editItems = {};
    let editOrderTotal = 0;
    let searchQuery = '';
    let maps = {};
    
    // ========== LOAD PRODUCTS ==========
    if (db && db.collection) {
      db.collection('products').onSnapshot(s => { 
        allProducts = []; 
        s.forEach(d => allProducts.push({ id: d.id, ...d.data() })); 
      });
      
      // ========== LOAD ORDERS ==========
      db.collection('orders').orderBy('orderDate', 'desc').onSnapshot(s => {
        allOrders = []; 
        s.forEach(d => allOrders.push({ id: d.id, ...d.data() }));
        updateStats();
        renderOrders();
      });
    }
    
    // Update Statistics
    function updateStats() {
      const total = allOrders.length;
      const pending = allOrders.filter(o => o.status === 'received' || o.status === 'preparing' || o.status === 'outfordelivery').length;
      const delivered = allOrders.filter(o => o.status === 'delivered').length;
      
      const today = new Date().toDateString();
      const todayRevenue = allOrders
        .filter(o => {
          const orderDate = o.orderDate?.toDate ? o.orderDate.toDate() : new Date(o.orderDate);
          return o.status === 'delivered' && orderDate.toDateString() === today;
        })
        .reduce((sum, o) => sum + (o.total || 0), 0);
      
      document.getElementById('totalOrders').textContent = total;
      document.getElementById('pendingCount').textContent = pending;
      document.getElementById('deliveredCount').textContent = delivered;
      document.getElementById('todayRevenue').textContent = `₹${todayRevenue.toLocaleString('en-IN')}`;
    }
    
    // Filter tabs
    document.querySelectorAll('.filter-tab').forEach(t => {
      t.addEventListener('click', function() {
        document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        activeFilter = this.dataset.status;
        renderOrders();
      });
    });
    
    // Search input
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase();
        renderOrders();
      });
    }
    
    // ========== FILTER ORDERS ==========
    function getFilteredOrders() {
      let filtered = [...allOrders];
      
      // Status filter
      if (activeFilter !== 'all') {
        filtered = filtered.filter(o => o.status === activeFilter);
      }
      
      // Search filter
      if (searchQuery) {
        filtered = filtered.filter(o => {
          const orderId = (o.orderId || o.id).toLowerCase();
          const name = (o.customerName || o.name || '').toLowerCase();
          const phone = (o.customerPhone || o.phone || '').toLowerCase();
          return orderId.includes(searchQuery) || name.includes(searchQuery) || phone.includes(searchQuery);
        });
      }
      
      return filtered;
    }
    
    // ========== RENDER ORDERS ==========
    function renderOrders() {
      const filtered = getFilteredOrders();
      const list = document.getElementById('ordersList');
      
      if (filtered.length === 0) { 
        list.innerHTML = '<div class="no-orders">📭 No orders found</div>'; 
        return; 
      }
      
      list.innerHTML = filtered.map(o => {
        const isExpanded = expandedOrderId === o.id;
        const isLocked = o.status === 'delivered' || o.status === 'cancelled';
        const status = o.status || 'received';
        
        // Use editable items if expanded
        const displayItems = isExpanded ? (editItems[o.id] || [...(o.items || [])]) : (o.items || []);
        const subtotal = displayItems.reduce((s, i) => s + (i.price || 0) * (i.quantity || 1), 0);
        const delivery = o.deliveryCharge || 0;
        const displayTotal = isExpanded ? subtotal + delivery : (o.total || 0);
        
        const itemsHTML = displayItems.map((item, idx) => `
          <div class="cart-item-row">
            <img src="${item.image}" class="cart-item-img" onerror="this.src='https://via.placeholder.com/40'">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-price">₹${item.price || 0} each</div>
            </div>
            ${!isLocked ? `
              <div class="qty-control">
                <button class="qty-btn" onclick="editItemQty('${o.id}', ${idx}, -1)">−</button>
                <span class="qty-num">${item.quantity || 1}</span>
                <button class="qty-btn" onclick="editItemQty('${o.id}', ${idx}, 1)">+</button>
              </div>
              <button class="remove-item-btn" onclick="editRemoveItem('${o.id}', ${idx})">🗑️</button>
            ` : `<span style="font-size:.8rem;color:var(--muted);">Qty: ${item.quantity || 1}</span>`}
          </div>
        `).join('');
        
        return `
          <div class="order-card">
            <div class="order-card-header" onclick="toggleOrder('${o.id}')">
              <span class="order-id">#${o.orderId || o.id.slice(-8).toUpperCase()}</span>
              <span class="status-badge status-${status}">${status === 'outfordelivery' ? 'Out for Delivery' : status}</span>
              <span class="order-customer">${o.customerName || o.name || 'Customer'}</span>
              <span class="order-total">₹${displayTotal.toLocaleString('en-IN')}</span>
              <span style="font-size:.8rem;color:var(--muted);">${formatDateSimple(o.orderDate || o.createdAt)}</span>
              <button class="view-details-btn" onclick="event.stopPropagation(); goToOrderDetail('${o.id}')">📄 Full Details →</button>
              <span class="expand-arrow ${isExpanded ? 'open' : ''}">▼</span>
            </div>
            
            <div class="order-details ${isExpanded ? 'open' : ''}">
              <div class="details-grid">
                
                <!-- Cart Editor Section -->
                <div>
                  <div class="section-box">
                    <h4>🛒 Cart Items (${displayItems.length})</h4>
                    <div class="cart-editor">${itemsHTML || '<p style="color:var(--muted);">No items</p>'}</div>
                    
                    ${!isLocked ? `
                      <div class="add-product-section">
                        <div class="mini-search">
                          <input type="text" placeholder="➕ Search & add product..." oninput="searchProductsForOrder(this, '${o.id}')" autocomplete="off">
                          <div class="mini-results" id="results-${o.id}"></div>
                        </div>
                      </div>
                      <button class="save-cart-btn" onclick="saveCartChanges('${o.id}')">💾 Save Cart Changes</button>
                    ` : `<div class="locked-badge">🔒 Order is ${status} - Cart locked</div>`}
                    
                    <div class="cart-total-row grand"><span>Cart Total</span><span id="cartTotal-${o.id}">₹${subtotal.toLocaleString('en-IN')}</span></div>
                  </div>
                </div>
                
                <!-- Info Section -->
                <div>
                  <div class="section-box">
                    <h4>📍 Customer & Address</h4>
                    <p style="font-size:.85rem;"><strong>${o.customerName || o.name}</strong><br>📱 ${o.customerPhone || o.phone}<br>🏠 ${o.customerAddress || o.address || 'N/A'}<br>📮 Pincode: ${o.pincode || 'N/A'}</p>
                  </div>
                  
                  <div class="section-box">
                    <h4>🚚 Delivery Info</h4>
                    <p style="font-size:.85rem;">Type: ${o.deliveryType || 'Quick'}<br>Slot: ${o.deliverySlot || 'ASAP'}<br>Charge: ₹${o.deliveryCharge || 0}</p>
                    
                    <div id="map-${o.id}" class="order-map" style="height:150px;"></div>
                    ${o.location?.lat ? `<a href="https://www.google.com/maps?q=${o.location.lat},${o.location.lng}" target="_blank" class="map-link">📍 View on Google Maps →</a>` : ''}
                  </div>
                  
                  <div class="section-box">
                    <h4>⚡ Status Control</h4>
                    <div class="status-control">
                      <select class="status-select" onchange="updateOrderStatus('${o.id}', this.value)" ${isLocked ? 'disabled' : ''}>
                        <option value="received" ${status==='received'?'selected':''}>📋 Received</option>
                        <option value="preparing" ${status==='preparing'?'selected':''}>🍳 Preparing</option>
                        <option value="outfordelivery" ${status==='outfordelivery'?'selected':''}>🛵 Out for Delivery</option>
                        <option value="delivered" ${status==='delivered'?'selected':''}>✅ Delivered</option>
                        <option value="cancelled" ${status==='cancelled'?'selected':''}>❌ Cancelled</option>
                      </select>
                    </div>
                  </div>
                  
                  <!-- Timeline -->
                  <div class="section-box">
                    <h4>⏱️ Order Timeline</h4>
                    <div class="timeline" id="timeline-${o.id}">
                      ${renderTimelineQuick(o)}
                    </div>
                  </div>
                  
                  <div style="display:flex;gap:8px;margin-top:8px;">
                    <button class="save-cart-btn" style="background:var(--info);margin:0;" onclick="printOrder('${o.id}')">🖨️ Print</button>
                    <button class="save-cart-btn" style="background:#25D366;margin:0;" onclick="sendWhatsApp('${o.id}')">💬 WhatsApp</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
      
      // Initialize maps for expanded orders
      setTimeout(() => {
        filtered.forEach(o => {
          if (expandedOrderId === o.id && o.location?.lat && o.location?.lng) {
            initMiniMap(o.id, o.location.lat, o.location.lng);
          }
        });
      }, 100);
    }
    
    // Mini map for expanded orders
    function initMiniMap(orderId, lat, lng) {
      const mapContainer = document.getElementById(`map-${orderId}`);
      if (!mapContainer || mapContainer.hasAttribute('data-initialized')) return;
      
      try {
        const map = L.map(mapContainer).setView([lat, lng], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
        }).addTo(map);
        L.marker([lat, lng]).addTo(map);
        mapContainer.setAttribute('data-initialized', 'true');
      } catch(e) { console.warn('Map error:', e); }
    }
    
    // Quick timeline render
    function renderTimelineQuick(order) {
      const status = order.status || 'received';
      const steps = [
        { key: 'received', title: 'Received', icon: '📋' },
        { key: 'preparing', title: 'Preparing', icon: '🍳' },
        { key: 'outfordelivery', title: 'Out for Delivery', icon: '🛵' },
        { key: 'delivered', title: 'Delivered', icon: '✅' }
      ];
      
      let reached = false;
      return steps.map(step => {
        let completed = false;
        if (!reached) {
          if (step.key === status || (status === 'delivered' && step.key === 'delivered')) {
            completed = true;
            reached = true;
          } else if (step.key === 'received') {
            completed = true;
          } else if (status === 'cancelled') {
            completed = false;
          }
        }
        if (status === 'delivered' && step.key !== 'delivered' && step.key !== 'received') completed = true;
        
        return `
          <div class="timeline-item">
            <div class="timeline-icon ${completed ? 'completed' : ''}">${step.icon}</div>
            <div class="timeline-content">
              <div class="timeline-title">${step.title}</div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // ========== TOGGLE ORDER ==========
    window.toggleOrder = function(orderId) {
      if (expandedOrderId === orderId) {
        expandedOrderId = null;
        delete editItems[orderId];
      } else {
        expandedOrderId = orderId;
        const order = allOrders.find(o => o.id === orderId);
        if (order) {
          editItems[orderId] = JSON.parse(JSON.stringify(order.items || []));
        }
      }
      renderOrders();
    };
    
    // ========== EDIT CART FUNCTIONS ==========
    window.editItemQty = function(orderId, idx, delta) {
      const items = editItems[orderId] || [];
      if (!items[idx]) return;
      items[idx].quantity = Math.max(0, (items[idx].quantity || 1) + delta);
      if (items[idx].quantity <= 0) items.splice(idx, 1);
      editItems[orderId] = items;
      updateCartTotalDisplay(orderId);
      renderOrders();
    };
    
    window.editRemoveItem = function(orderId, idx) {
      const items = editItems[orderId] || [];
      items.splice(idx, 1);
      editItems[orderId] = items;
      updateCartTotalDisplay(orderId);
      renderOrders();
    };
    
    function updateCartTotalDisplay(orderId) {
      const items = editItems[orderId] || [];
      const subtotal = items.reduce((s, i) => s + (i.price || 0) * (i.quantity || 1), 0);
      const totalSpan = document.getElementById(`cartTotal-${orderId}`);
      if (totalSpan) totalSpan.textContent = `₹${subtotal.toLocaleString('en-IN')}`;
    }
    
    // ========== SEARCH & ADD PRODUCT ==========
    window.searchProductsForOrder = function(input, orderId) {
      const q = input.value.toLowerCase().trim();
      const container = document.getElementById('results-' + orderId);
      if (q.length < 2) { container.classList.remove('show'); return; }
      
      const results = allProducts.filter(p => p.name.toLowerCase().includes(q)).slice(0, 6);
      container.innerHTML = results.map(p => `
        <div class="mini-result-item">
          <span>${p.name} · ₹${p.price}</span>
          <button class="mini-add-btn" onclick="addProductToOrder('${orderId}', '${p.id}')">+ Add</button>
        </div>
      `).join('');
      container.classList.add('show');
    };
    
    window.addProductToOrder = function(orderId, productId) {
      const product = allProducts.find(p => p.id === productId);
      if (!product) return;
      
      const items = editItems[orderId] || [];
      const existing = items.find(i => i.id === productId);
      if (existing) existing.quantity++;
      else items.push({ 
        id: product.id, name: product.name, price: product.price, 
        mrp: product.mrp, image: product.image, unit: product.unit, quantity: 1 
      });
      editItems[orderId] = items;
      updateCartTotalDisplay(orderId);
      
      document.getElementById('results-' + orderId).classList.remove('show');
      renderOrders();
      showToast(`${product.name} added!`, 'success');
    };
    
    // ========== SAVE CART CHANGES ==========
    window.saveCartChanges = async function(orderId) {
      const items = editItems[orderId];
      if (!items) return;
      
      const subtotal = items.reduce((s, i) => s + (i.price || 0) * (i.quantity || 1), 0);
      const order = allOrders.find(o => o.id === orderId);
      const delivery = order?.deliveryCharge || 0;
      const total = subtotal + delivery;
      
      try {
        await db.collection('orders').doc(orderId).update({ items, subtotal, total });
        
        const idx = allOrders.findIndex(o => o.id === orderId);
        if (idx !== -1) { allOrders[idx].items = items; allOrders[idx].subtotal = subtotal; allOrders[idx].total = total; }
        
        delete editItems[orderId];
        expandedOrderId = null;
        renderOrders();
        showToast(`✅ Cart updated! Total: ₹${total.toLocaleString('en-IN')}`, 'success');
      } catch (err) { showToast('❌ Error saving', 'error'); }
    };
    
    // ========== UPDATE STATUS ==========
    window.updateOrderStatus = async function(orderId, status) {
      try {
        await db.collection('orders').doc(orderId).update({ status, updatedAt: new Date().toISOString() });
        if (status === 'delivered') await db.collection('orders').doc(orderId).update({ deliveredAt: new Date().toISOString() });
        
        const order = allOrders.find(o => o.id === orderId);
        if (order) order.status = status;
        renderOrders();
        showToast(`Status updated to "${status}"`, 'success');
      } catch (err) { showToast('Error updating status', 'error'); }
    };
    
    // ========== GO TO ORDER DETAIL PAGE ==========
    window.goToOrderDetail = function(orderId) {
      window.location.href = `order-detail.html?id=${orderId}`;
    };
    
    // ========== PRINT ORDER ==========
    window.printOrder = function(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;
      
      const printWindow = window.open('', '_blank');
      const items = order.items || [];
      const itemsHTML = items.map(item => `
        <tr><td>${item.name}</td><td>${item.quantity || 1}</td><td>₹${item.price || 0}</td><td>₹${((item.price || 0) * (item.quantity || 1)).toFixed(2)}</td></tr>
      `).join('');
      
      printWindow.document.write(`
        <html><head><title>Order_${order.id.slice(0,8)}</title>
        <style>body{font-family:sans-serif;padding:20px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ddd;padding:8px;text-align:left;}</style>
        </head><body>
        <h1>OK Mart - Order Invoice</h1>
        <p><strong>Order ID:</strong> #${order.orderId || order.id.slice(0,8)}</p>
        <p><strong>Customer:</strong> ${order.customerName || order.name}</p>
        <p><strong>Phone:</strong> ${order.customerPhone || order.phone}</p>
        <p><strong>Address:</strong> ${order.customerAddress || order.address}</p>
        <table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
        <tbody>${itemsHTML}</tbody>
        <tfoot><tr><td colspan="3"><strong>Total</strong></td><td><strong>₹${order.total || 0}</strong></td></tr></tfoot></table>
        <p>Thank you for shopping with OK Mart!</p>
        </body></html>
      `);
      printWindow.document.close();
      printWindow.print();
    };
    
    // ========== WHATSAPP ==========
    window.sendWhatsApp = function(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;
      const phone = order.customerPhone || order.phone;
      if (!phone) { showToast('No phone number found', 'error'); return; }
      
      const total = order.total || 0;
      const message = `🛒 *OK Mart Order Update*\n\nOrder ID: #${order.orderId || order.id.slice(0,8)}\nStatus: ${order.status || 'Received'}\nTotal: ₹${total}\n\nThank you for shopping with OK Mart! 🚀`;
      window.open(`https://wa.me/91${phone}?text=${encodeURIComponent(message)}`, '_blank');
    };
    
    // ========== HELPER FUNCTIONS ==========
    function formatDateSimple(timestamp) {
      if (!timestamp) return 'N/A';
      let date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
    }
    
    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = `toast ${type || ''}`; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
    
    window.adminLogout = function() {
      localStorage.removeItem('adminLoggedIn');
      window.location.href = 'login.html';
    };
  </script>
</body>
</html>
