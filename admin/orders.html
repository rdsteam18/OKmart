<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Order Management | OK Mart Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2ecc71">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #2ecc71;
      --primary-dark: #27ae60;
      --primary-light: #e8f8ef;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1a1e2b;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.04);
      --shadow-md: 0 8px 24px rgba(0,0,0,.06);
      --radius: 16px;
      --transition: all .2s ease;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    
    .admin-layout { display: flex; min-height: 100vh; }
    
    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 260px; background: #1a1e2b; color: white;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
      display: flex; flex-direction: column; transition: transform .3s;
    }
    
    .sidebar-brand {
      padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,.1);
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-logo { font-size: 1.3rem; font-weight: 700; }
    .sidebar-badge { background: var(--primary); padding: 3px 10px; border-radius: 20px; font-size: .65rem; font-weight: 600; text-transform: uppercase; }
    .sidebar-nav { flex: 1; padding: 20px 0; }
    .sidebar-nav a {
      display: flex; align-items: center; gap: 12px; padding: 14px 24px;
      color: rgba(255,255,255,.7); text-decoration: none; font-weight: 500; transition: var(--transition);
    }
    .sidebar-nav a:hover { background: rgba(255,255,255,.06); color: white; }
    .sidebar-nav a.active { background: rgba(46,204,113,.1); color: var(--primary); border-left: 3px solid var(--primary); }
    .sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,.1); }
    .sidebar-footer button {
      width: 100%; padding: 12px; background: rgba(255,255,255,.08);
      border: none; color: rgba(255,255,255,.7); border-radius: 10px; cursor: pointer; font-weight: 500;
    }
    .sidebar-footer button:hover { background: rgba(239,68,68,.2); color: var(--danger); }
    
    /* ===== MOBILE HEADER ===== */
    .mobile-header {
      display: none; padding: 12px 16px; background: var(--card);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
      align-items: center; justify-content: space-between;
    }
    .menu-toggle { background: var(--bg); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
    
    /* ===== MAIN CONTENT ===== */
    .main-content { flex: 1; margin-left: 260px; padding: 24px; max-width: 1300px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-header h1 { font-size: 1.8rem; font-weight: 800; }
    .order-count { color: var(--muted); font-size: .9rem; }
    
    /* ===== CONTROLS ===== */
    .controls-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-input {
      flex: 1; min-width: 200px; padding: 12px 16px; background: var(--card);
      border: 1.5px solid var(--border); border-radius: 12px; font-size: .9rem;
    }
    .search-input:focus { outline: none; border-color: var(--primary); }
    .filter-select { padding: 12px 16px; background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; font-size: .9rem; }
    
    /* ===== FILTER TABS ===== */
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-tab {
      padding: 10px 18px; background: var(--card); border: 1.5px solid var(--border);
      border-radius: 40px; cursor: pointer; font-weight: 500; font-size: .85rem;
      transition: var(--transition); position: relative;
    }
    .filter-tab:hover { border-color: var(--primary); }
    .filter-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    .filter-tab .count { background: rgba(0,0,0,.08); padding: 2px 8px; border-radius: 20px; margin-left: 6px; font-size: .75rem; }
    .filter-tab.active .count { background: rgba(255,255,255,.2); }
    
    /* ===== ORDERS LIST ===== */
    .orders-list { display: flex; flex-direction: column; gap: 12px; }
    
    .order-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow-sm); border: 1px solid var(--border);
      overflow: hidden; transition: var(--transition);
    }
    .order-card:hover { box-shadow: var(--shadow-md); }
    
    .order-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; cursor: pointer; flex-wrap: wrap; gap: 10px;
    }
    .order-card-header:active { background: var(--bg); }
    
    .order-id-section { display: flex; align-items: center; gap: 12px; }
    .order-id {
      font-weight: 700; font-family: monospace; font-size: .95rem;
      color: var(--primary-dark);
    }
    .order-customer { font-weight: 600; }
    .order-phone { font-size: .85rem; color: var(--muted); }
    .order-total { font-weight: 700; font-size: 1.05rem; }
    .order-date { font-size: .8rem; color: var(--muted); }
    
    .expand-arrow {
      font-size: 1.2rem; color: var(--muted); transition: transform .3s;
    }
    .expand-arrow.open { transform: rotate(180deg); }
    
    /* ===== ORDER DETAILS (EXPANDED) ===== */
    .order-details {
      display: none; padding: 0 20px 20px; border-top: 1px solid var(--border);
      animation: slideDown .3s ease;
    }
    @keyframes slideDown { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 1000px; } }
    .order-details.open { display: block; }
    
    .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 16px 0; }
    
    .detail-section h4 {
      font-size: .9rem; font-weight: 700; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    
    .items-list { display: flex; flex-direction: column; gap: 6px; }
    .item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .9rem;
    }
    .item-row:last-child { border-bottom: none; }
    .item-name { font-weight: 500; }
    .item-qty { color: var(--muted); font-size: .8rem; }
    .item-price { font-weight: 600; }
    
    .address-box {
      background: var(--bg); border-radius: 12px; padding: 14px; font-size: .9rem; line-height: 1.6;
    }
    .address-box strong { display: block; margin-bottom: 4px; }
    
    /* Order Total Summary */
    .order-summary-row {
      display: flex; justify-content: space-between; padding: 6px 0; font-size: .9rem;
    }
    .order-summary-row.total {
      font-weight: 700; font-size: 1.1rem; border-top: 1px dashed var(--border);
      margin-top: 8px; padding-top: 12px;
    }
    
    /* ===== STATUS CONTROL ===== */
    .status-control-section {
      margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .status-control-section label { font-weight: 600; font-size: .85rem; }
    
    .status-select {
      padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--border);
      font-size: .85rem; font-weight: 600; cursor: pointer; background: white;
    }
    .status-select.received { background: #f3f4f6; border-color: #9ca3af; color: #374151; }
    .status-select.preparing { background: #fef3c7; border-color: var(--warning); color: #92400e; }
    .status-select.outfordelivery { background: #dbeafe; border-color: var(--info); color: #1e40af; }
    .status-select.delivered { background: #d1fae5; border-color: var(--primary); color: #065f46; }
    .status-select.cancelled { background: #fee2e2; border-color: var(--danger); color: #991b1b; }
    
    .status-badge {
      display: inline-block; padding: 5px 12px; border-radius: 20px;
      font-size: .7rem; font-weight: 600; text-transform: capitalize;
    }
    .status-received { background: #f3f4f6; color: #374151; }
    .status-preparing { background: #fef3c7; color: #92400e; }
    .status-outfordelivery { background: #dbeafe; color: #1e40af; }
    .status-delivered { background: #d1fae5; color: #065f46; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }
    
    .action-btn {
      padding: 8px 16px; border-radius: 10px; font-weight: 600;
      font-size: .8rem; cursor: pointer; border: 1.5px solid var(--border);
      background: var(--bg); transition: var(--transition);
    }
    .action-btn.deliver-btn { background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark); }
    .action-btn.deliver-btn:hover { background: var(--primary); color: white; }
    .action-btn.cancel-btn { background: #fee2e2; border-color: var(--danger); color: var(--danger); }
    .action-btn.cancel-btn:hover { background: var(--danger); color: white; }
    
    .no-orders { text-align: center; padding: 60px 20px; color: var(--muted); }
    .no-orders span { font-size: 3rem; display: block; margin-bottom: 12px; opacity: .5; }
    
    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: white; padding: 12px 24px;
      border-radius: 40px; font-weight: 500; z-index: 300;
      opacity: 0; transition: .3s;
    }
    .toast.show { opacity: 1; bottom: 50px; }
    .toast.success { background: #10b981; }
    
    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; padding: 16px; }
      .mobile-header { display: flex; }
      .details-grid { grid-template-columns: 1fr; }
      .order-card-header { flex-direction: column; align-items: flex-start; }
      .status-control-section { flex-direction: column; align-items: flex-start; }
    }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="admin-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span class="sidebar-logo">🛒 OK Mart</span><span class="sidebar-badge">Admin</span></div>
      <nav class="sidebar-nav">
        <a href="index.html">📊 Dashboard</a>
        <a href="orders.html" class="active">📋 Orders</a>
        <a href="products.html">📦 Products</a>
        <a href="offers.html">🏷️ Offers</a>
        <a href="settings.html">⚙️ Settings</a>
      </nav>
      <div class="sidebar-footer">
        <button onclick="adminLogout()">🚪 Logout</button>
        <button onclick="location.href='/'" style="margin-top:8px;">🏠 View Store</button>
      </div>
    </aside>

    <!-- Mobile Header -->
    <div class="mobile-header">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <span style="font-weight:700;">Order Management</span>
      <span></span>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      
      <div class="page-header">
        <h1>📋 Order Management</h1>
        <span class="order-count" id="totalOrdersCount">Loading...</span>
      </div>

      <!-- Search -->
      <div class="controls-bar">
        <input type="text" class="search-input" id="searchOrders" placeholder="🔍 Search by Order ID or Phone..." oninput="renderOrders()">
      </div>

      <!-- Filter Tabs -->
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-status="all">All <span class="count" id="countAll">0</span></button>
        <button class="filter-tab" data-status="received">Received <span class="count" id="countReceived">0</span></button>
        <button class="filter-tab" data-status="preparing">Preparing <span class="count" id="countPreparing">0</span></button>
        <button class="filter-tab" data-status="outfordelivery">Out for Delivery <span class="count" id="countDelivery">0</span></button>
        <button class="filter-tab" data-status="delivered">Delivered <span class="count" id="countDelivered">0</span></button>
        <button class="filter-tab" data-status="cancelled">Cancelled <span class="count" id="countCancelled">0</span></button>
      </div>

      <!-- Orders List -->
      <div class="orders-list" id="ordersList">
        <div class="no-orders"><span>📋</span><p>Loading orders...</p></div>
      </div>

    </main>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="/js/firebase.js"></script>
  <script src="/js/admin-auth.js"></script>
  <script>
    // ===== ORDER MANAGEMENT SYSTEM =====
    
    let allOrders = [];
    let activeFilter = 'all';
    let expandedOrderId = null;
    
    // ========== LOAD ORDERS (REAL-TIME) ==========
    db.collection('orders').orderBy('orderDate', 'desc').onSnapshot((snapshot) => {
      allOrders = [];
      snapshot.forEach(doc => allOrders.push({ id: doc.id, ...doc.data() }));
      renderOrders();
      updateFilterCounts();
    });
    
    // ========== FILTER TABS ==========
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        activeFilter = this.dataset.status;
        renderOrders();
      });
    });
    
    function updateFilterCounts() {
      document.getElementById('countAll').textContent = allOrders.length;
      document.getElementById('countReceived').textContent = allOrders.filter(o => o.status === 'received').length;
      document.getElementById('countPreparing').textContent = allOrders.filter(o => o.status === 'preparing').length;
      document.getElementById('countDelivery').textContent = allOrders.filter(o => o.status === 'outfordelivery').length;
      document.getElementById('countDelivered').textContent = allOrders.filter(o => o.status === 'delivered').length;
      document.getElementById('countCancelled').textContent = allOrders.filter(o => o.status === 'cancelled').length;
    }
    
    // ========== RENDER ORDERS ==========
    function renderOrders() {
      const search = (document.getElementById('searchOrders')?.value || '').toLowerCase().trim();
      
      let filtered = [...allOrders];
      
      // Filter by status
      if (activeFilter !== 'all') {
        filtered = filtered.filter(o => o.status === activeFilter);
      }
      
      // Search
      if (search) {
        filtered = filtered.filter(o => 
          (o.orderId || '').toLowerCase().includes(search) ||
          (o.customerPhone || o.phone || '').includes(search) ||
          (o.id || '').toLowerCase().includes(search)
        );
      }
      
      document.getElementById('totalOrdersCount').textContent = `${filtered.length} order${filtered.length !== 1 ? 's' : ''}`;
      
      const list = document.getElementById('ordersList');
      
      if (filtered.length === 0) {
        list.innerHTML = '<div class="no-orders"><span>📋</span><p>No orders found</p></div>';
        return;
      }
      
      list.innerHTML = filtered.map(order => {
        const status = order.status || 'received';
        const isExpanded = expandedOrderId === order.id;
        const items = order.items || [];
        
        // Items HTML
        const itemsHTML = items.map(item => `
          <div class="item-row">
            <div>
              <span class="item-name">${item.name}</span>
              <span class="item-qty"> × ${item.quantity}</span>
            </div>
            <span class="item-price">₹${(item.price || 0) * (item.quantity || 1)}</span>
          </div>
        `).join('');
        
        const subtotal = items.reduce((s, i) => s + (i.price || 0) * (i.quantity || 1), 0);
        const delivery = order.delivery || 0;
        const total = order.total || subtotal + delivery;
        
        return `
          <div class="order-card">
            <div class="order-card-header" onclick="toggleOrder('${order.id}')">
              <div class="order-id-section">
                <span class="order-id">#${order.orderId || order.id.slice(-8).toUpperCase()}</span>
                <span class="status-badge status-${status}">${status}</span>
              </div>
              <div>
                <span class="order-customer">${order.customerName || order.name || 'Customer'}</span>
                <span class="order-phone"> · 📱 ${order.customerPhone || order.phone || '-'}</span>
              </div>
              <div style="display:flex;align-items:center;gap:16px;">
                <span class="order-total">₹${total.toLocaleString('en-IN')}</span>
                <span class="order-date">${new Date(order.orderDate || order.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
                <span class="expand-arrow ${isExpanded ? 'open' : ''}">▼</span>
              </div>
            </div>
            
            <div class="order-details ${isExpanded ? 'open' : ''}" id="details-${order.id}">
              <div class="details-grid">
                
                <!-- Items -->
                <div class="detail-section">
                  <h4>🛒 Order Items (${items.length})</h4>
                  <div class="items-list">${itemsHTML}</div>
                  <div class="order-summary-row total">
                    <span>Total</span><span>₹${total.toLocaleString('en-IN')}</span>
                  </div>
                </div>
                
                <!-- Address -->
                <div class="detail-section">
                  <h4>📍 Delivery Address</h4>
                  <div class="address-box">
                    <strong>${order.customerName || order.name || 'Customer'}</strong>
                    📱 ${order.customerPhone || order.phone || '-'}<br>
                    🏠 ${order.customerAddress || order.address || 'No address provided'}<br>
                    ${order.date ? '📅 ' + new Date(order.orderDate || order.date).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''}
                  </div>
                </div>
              </div>
              
              <!-- Status Control -->
              <div class="status-control-section">
                <label>Update Status:</label>
                <select class="status-select ${status}" id="status-${order.id}" onchange="updateStatus('${order.id}', this.value)">
                  <option value="received" ${status === 'received' ? 'selected' : ''}>📋 Order Received</option>
                  <option value="preparing" ${status === 'preparing' ? 'selected' : ''}>🟡 Preparing</option>
                  <option value="outfordelivery" ${status === 'outfordelivery' ? 'selected' : ''}>🚚 Out for Delivery</option>
                  <option value="delivered" ${status === 'delivered' ? 'selected' : ''}>✅ Delivered</option>
                  <option value="cancelled" ${status === 'cancelled' ? 'selected' : ''}>❌ Cancelled</option>
                </select>
                
                <button class="action-btn deliver-btn" onclick="updateStatus('${order.id}', 'delivered')">✅ Mark Delivered</button>
                <button class="action-btn cancel-btn" onclick="updateStatus('${order.id}', 'cancelled')">❌ Cancel Order</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // ========== TOGGLE ORDER EXPAND ==========
    window.toggleOrder = function(orderId) {
      if (expandedOrderId === orderId) {
        expandedOrderId = null;
      } else {
        expandedOrderId = orderId;
      }
      renderOrders();
    };
    
    // ========== UPDATE STATUS ==========
    window.updateStatus = async function(orderId, newStatus) {
      try {
        await db.collection('orders').doc(orderId).update({ status: newStatus });
        
        // Update the select element styling
        const select = document.getElementById('status-' + orderId);
        if (select) {
          select.className = 'status-select ' + newStatus;
          select.value = newStatus;
        }
        
        showToast(`Order status updated to "${newStatus}"`, 'success');
        console.log(`✅ Order ${orderId} → ${newStatus}`);
      } catch (err) {
        console.error('Status update error:', err);
        showToast('Failed to update status', 'error');
      }
    };
    
    // ========== TOAST ==========
    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `toast ${type}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    console.log('✅ Order management ready');
  </script>
</body>
</html>
