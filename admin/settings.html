<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Settings | OK Mart Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1a1e2b;min-height:100vh}
    .admin-layout{display:flex;min-height:100vh}
    .sidebar{width:250px;background:#1a1e2b;color:white;position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column}
    .sidebar-brand{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
    .sidebar-brand span{font-size:1.2rem;font-weight:700}
    .sidebar-badge{background:#2ecc71;padding:3px 10px;border-radius:20px;font-size:.6rem;text-transform:uppercase;font-weight:600}
    .sidebar-nav{flex:1;padding:20px 0}
    .sidebar-nav a{display:flex;align-items:center;gap:12px;padding:14px 24px;color:rgba(255,255,255,.7);text-decoration:none;font-weight:500}
    .sidebar-nav a:hover,.sidebar-nav a.active{background:rgba(255,255,255,.08);color:white}
    .sidebar-nav a.active{border-left:3px solid #2ecc71}
    .sidebar-footer{padding:20px;border-top:1px solid rgba(255,255,255,.1)}
    .sidebar-footer button{width:100%;padding:12px;background:rgba(255,255,255,.1);border:none;color:white;border-radius:10px;cursor:pointer}
    .main-content{flex:1;margin-left:250px;padding:24px}
    h1{font-size:1.8rem;font-weight:800;margin-bottom:24px}
    .settings-section{background:white;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
    .settings-section h2{font-size:1.1rem;font-weight:700;margin-bottom:16px}
    .form-row{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
    .form-group{flex:1;min-width:150px}
    .form-group label{display:block;font-weight:600;font-size:.85rem;margin-bottom:6px}
    .form-group input,.form-group select{width:100%;padding:12px;background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:12px;font-size:.9rem}
    .save-btn{padding:12px 24px;background:#2ecc71;color:white;border:none;border-radius:12px;font-weight:700;cursor:pointer;margin-top:8px}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
    .toggle{width:50px;height:28px;background:#e5e7eb;border-radius:14px;position:relative;cursor:pointer;transition:.3s}
    .toggle.active{background:#2ecc71}
    .toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;background:white;border-radius:50%;transition:.3s}
    .toggle.active::after{left:25px}
    .pincode-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .pincode-tag{background:#f8fafc;border:1px solid #e5e7eb;padding:6px 12px;border-radius:20px;font-size:.8rem;display:flex;align-items:center;gap:6px}
    .pincode-tag button{background:none;border:none;color:#ef4444;cursor:pointer;font-size:1rem}
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1e2b;color:white;padding:12px 24px;border-radius:40px;z-index:300;opacity:0;transition:.3s}
    .toast.show{opacity:1;bottom:50px}.toast.success{background:#10b981}
    @media(max-width:768px){.sidebar{display:none}.main-content{margin-left:0;padding:16px}}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><span>🛒 OK Mart</span><span class="sidebar-badge">Admin</span></div>
      <nav class="sidebar-nav">
        <a href="index.html">📊 Dashboard</a>
        <a href="orders.html">📋 Orders</a>
        <a href="products.html">📦 Products</a>
        <a href="offers.html">🏷️ Offers</a>
        <a href="settings.html" class="active">⚙️ Settings</a>
        <a href="manual-order.html">✍️ Manual Order</a>
      </nav>
      <div class="sidebar-footer"><button onclick="logout()">🚪 Logout</button></div>
    </aside>
    <main class="main-content">
      <h1>⚙️ Settings</h1>
      
      <!-- Delivery Settings -->
      <div class="settings-section">
        <h2>🚚 Delivery Settings</h2>
        <div class="form-row">
          <div class="form-group"><label>Delivery Charge (₹)</label><input type="number" id="deliveryCharge" value="20"></div>
          <div class="form-group"><label>Free Delivery Threshold (₹)</label><input type="number" id="freeThreshold" value="199"></div>
        </div>
        <button class="save-btn" onclick="saveDelivery()">💾 Save Delivery</button>
      </div>
      
      <!-- Feature Toggles -->
      <div class="settings-section">
        <h2>🔧 Feature Toggles</h2>
        <div class="toggle-row"><span>Site Active</span><div class="toggle active" id="siteToggle" onclick="toggleFeature('siteActive')"></div></div>
        <div class="toggle-row"><span>Delivery Enabled</span><div class="toggle active" id="deliveryToggle" onclick="toggleFeature('deliveryEnabled')"></div></div>
        <div class="toggle-row"><span>Offers Enabled</span><div class="toggle active" id="offersToggle" onclick="toggleFeature('offersEnabled')"></div></div>
        <div class="toggle-row"><span>COD Enabled</span><div class="toggle active" id="codToggle" onclick="toggleFeature('codEnabled')"></div></div>
      </div>
      
      <!-- Pincodes -->
      <div class="settings-section">
        <h2>📍 Allowed Pincodes</h2>
        <div class="form-row">
          <div class="form-group"><input type="text" id="newPincode" placeholder="Enter pincode" maxlength="6"></div>
          <button class="save-btn" onclick="addPincode()" style="margin-top:0;">+ Add</button>
        </div>
        <div class="pincode-tags" id="pincodeList"></div>
      </div>
      
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/js/firebase.js"></script>
  <script src="/js/admin-auth.js"></script>
  <script>
    function logout(){sessionStorage.removeItem('okmart_admin_logged');window.location.href='login.html'}
    
    // Load settings
    db.collection('settings').doc('delivery').onSnapshot(doc=>{
      if(doc.exists){
        const d=doc.data();
        document.getElementById('deliveryCharge').value=d.charge||20;
        document.getElementById('freeThreshold').value=d.freeThreshold||199;
      }
    });
    
    db.collection('settings').doc('features').onSnapshot(doc=>{
      if(doc.exists){
        const d=doc.data();
        ['siteActive','deliveryEnabled','offersEnabled','codEnabled'].forEach(f=>{
          document.getElementById(f+'Toggle').classList.toggle('active',d[f]!==false);
        });
      }
    });
    
    db.collection('settings').doc('pincodes').onSnapshot(doc=>{
      const pins=doc.exists?(doc.data().list||[]):['380026','382418','380058','110001','400001','560001'];
      document.getElementById('pincodeList').innerHTML=pins.map(p=>`<span class="pincode-tag">${p}<button onclick="removePincode('${p}')">✕</button></span>`).join('');
    });
    
    function saveDelivery(){
      const data={charge:Number(document.getElementById('deliveryCharge').value),freeThreshold:Number(document.getElementById('freeThreshold').value)};
      db.collection('settings').doc('delivery').set(data).then(()=>showToast('Saved!','success'));
    }
    
    function toggleFeature(feature){
      db.collection('settings').doc('features').get().then(doc=>{
        const data=doc.exists?doc.data():{};
        data[feature]=!data[feature]||data[feature]===undefined?false:!data[feature];
        db.collection('settings').doc('features').set(data);
      });
    }
    
    async function addPincode(){
      const pin=document.getElementById('newPincode').value.trim();
      if(!/^\d{6}$/.test(pin)){showToast('Invalid pincode','error');return}
      const doc=await db.collection('settings').doc('pincodes').get();
      const pins=doc.exists?(doc.data().list||[]):[];
      if(!pins.includes(pin)){pins.push(pin);await db.collection('settings').doc('pincodes').set({list:pins});}
      document.getElementById('newPincode').value='';
    }
    
    async function removePincode(pin){
      const doc=await db.collection('settings').doc('pincodes').get();
      const pins=(doc.data().list||[]).filter(p=>p!==pin);
      await db.collection('settings').doc('pincodes').set({list:pins});
    }
    
    function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(type||'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
  </script>
</body>
</html>
