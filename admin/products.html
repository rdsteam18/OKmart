<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Product Management | OK Mart Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1a1e2b;min-height:100vh}
    .admin-layout{display:flex;min-height:100vh}
    .sidebar{width:250px;background:#1a1e2b;color:white;position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column}
    .sidebar-brand{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
    .sidebar-brand span{font-size:1.2rem;font-weight:700}
    .sidebar-badge{background:#2ecc71;padding:3px 10px;border-radius:20px;font-size:.6rem;text-transform:uppercase;font-weight:600}
    .sidebar-nav{flex:1;padding:20px 0}
    .sidebar-nav a{display:flex;align-items:center;gap:12px;padding:14px 24px;color:rgba(255,255,255,.7);text-decoration:none;font-weight:500}
    .sidebar-nav a:hover,.sidebar-nav a.active{background:rgba(255,255,255,.08);color:white}
    .sidebar-nav a.active{border-left:3px solid #2ecc71}
    .sidebar-footer{padding:20px;border-top:1px solid rgba(255,255,255,.1)}
    .sidebar-footer button{width:100%;padding:12px;background:rgba(255,255,255,.1);border:none;color:white;border-radius:10px;cursor:pointer}
    .main-content{flex:1;margin-left:250px;padding:24px}
    .header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    h1{font-size:1.8rem;font-weight:800}
    .add-btn{background:#2ecc71;color:white;border:none;padding:12px 20px;border-radius:12px;font-weight:600;cursor:pointer}
    .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
    .product-card{background:white;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.04);display:flex;gap:14px}
    .product-card img{width:80px;height:80px;border-radius:12px;object-fit:cover}
    .product-info{flex:1}
    .product-name{font-weight:700;margin-bottom:4px}
    .product-price{color:#27ae60;font-weight:700}
    .product-category{font-size:.75rem;color:#6b7280}
    .product-actions{margin-top:10px;display:flex;gap:8px}
    .edit-btn,.delete-btn{padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:500}
    .edit-btn{background:#f8fafc;border:1px solid #e5e7eb}
    .delete-btn{background:#fee2e2;color:#ef4444;border:1px solid #ef4444}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
    .modal-overlay.active{display:flex}
    .modal-card{background:white;border-radius:20px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;padding:24px}
    .modal-card h3{margin-bottom:16px}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-weight:600;font-size:.85rem;margin-bottom:6px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:12px;font-size:.9rem;font-family:inherit}
    .form-row{display:flex;gap:12px}.form-row .form-group{flex:1}
    .save-btn{width:100%;padding:14px;background:#2ecc71;color:white;border:none;border-radius:12px;font-weight:700;cursor:pointer;margin-top:8px}
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1e2b;color:white;padding:12px 24px;border-radius:40px;z-index:300;opacity:0;transition:.3s}
    .toast.show{opacity:1;bottom:50px}.toast.success{background:#10b981}
    @media(max-width:768px){.sidebar{display:none}.main-content{margin-left:0;padding:16px}}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><span>🛒 OK Mart</span><span class="sidebar-badge">Admin</span></div>
      <nav class="sidebar-nav">
        <a href="index.html">📊 Dashboard</a>
        <a href="products.html" class="active">📦 Products</a>
        <a href="orders.html">📋 Orders</a>
        <a href="offers.html">🏷️ Offers</a>
      </nav>
      <div class="sidebar-footer"><button onclick="location.href='/'">🚪 Exit</button></div>
    </aside>
    <main class="main-content">
      <div class="header-row"><h1>📦 Products</h1><button class="add-btn" onclick="openModal()">+ Add Product</button></div>
      <div class="products-grid" id="productsGrid"><p>Loading...</p></div>
    </main>
    <div class="modal-overlay" id="productModal">
      <div class="modal-card">
        <h3 id="modalTitle">Add Product</h3>
        <form id="productForm">
          <input type="hidden" id="productId">
          <div class="form-group"><label>Product Name *</label><input type="text" id="prodName" required></div>
          <div class="form-row">
            <div class="form-group"><label>Price (₹) *</label><input type="number" id="prodPrice" required></div>
            <div class="form-group"><label>MRP (₹)</label><input type="number" id="prodMrp"></div>
          </div>
          <div class="form-group"><label>Image URL *</label><input type="text" id="prodImage" required></div>
          <div class="form-row">
            <div class="form-group"><label>Category *</label><select id="prodCategory" required><option value="">Select</option><option value="dairy">Dairy</option><option value="fruits">Fruits</option><option value="snacks">Snacks</option><option value="beverages">Beverages</option><option value="electronics">Electronics</option><option value="grocery">Grocery</option></select></div>
            <div class="form-group"><label>Unit</label><input type="text" id="prodUnit" placeholder="e.g., 500g"></div>
          </div>
          <div class="form-group"><label>Description</label><textarea id="prodDesc" rows="2"></textarea></div>
          <div class="form-group"><label><input type="checkbox" id="prodPopular"> Mark as Popular</label></div>
          <button type="submit" class="save-btn">Save Product</button>
        </form>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script src="/js/firebase.js"></script>
  <script>
    const modal=document.getElementById('productModal');
    let editingId=null;
    function openModal(p=null){
      editingId=p?.id||null;
      document.getElementById('modalTitle').textContent=p?'Edit Product':'Add Product';
      document.getElementById('productId').value=p?.id||'';
      document.getElementById('prodName').value=p?.name||'';
      document.getElementById('prodPrice').value=p?.price||'';
      document.getElementById('prodMrp').value=p?.mrp||'';
      document.getElementById('prodImage').value=p?.image||'';
      document.getElementById('prodCategory').value=p?.category||'';
      document.getElementById('prodUnit').value=p?.unit||'';
      document.getElementById('prodDesc').value=p?.description||'';
      document.getElementById('prodPopular').checked=p?.popular||false;
      modal.classList.add('active');
    }
    modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('active')});
    document.getElementById('productForm').addEventListener('submit',async e=>{
      e.preventDefault();
      const data={
        name:document.getElementById('prodName').value,
        price:Number(document.getElementById('prodPrice').value),
        mrp:Number(document.getElementById('prodMrp').value)||0,
        image:document.getElementById('prodImage').value,
        category:document.getElementById('prodCategory').value,
        unit:document.getElementById('prodUnit').value,
        description:document.getElementById('prodDesc').value,
        popular:document.getElementById('prodPopular').checked
      };
      try{
        if(editingId) await db.collection('products').doc(editingId).update(data);
        else await db.collection('products').add(data);
        modal.classList.remove('active');
        showToast(editingId?'Updated!':'Added!','success');
      }catch(err){console.error(err)}
    });
    function deleteProduct(id){if(confirm('Delete?'))db.collection('products').doc(id).delete().then(()=>showToast('Deleted'))}
    db.collection('products').onSnapshot(s=>{
      const grid=document.getElementById('productsGrid');
      if(s.empty){grid.innerHTML='<p>No products</p>';return}
      grid.innerHTML='';
      s.forEach(doc=>{
        const d=doc.data();
        grid.innerHTML+=`<div class="product-card"><img src="${d.image}" onerror="this.src='https://via.placeholder.com/80'"><div class="product-info"><div class="product-name">${d.name}</div><div class="product-price">₹${d.price} ${d.mrp?'<span style="text-decoration:line-through;color:#6b7280;">₹'+d.mrp+'</span>':''}</div><div class="product-category">${d.category} · ${d.unit||'N/A'}</div><div class="product-actions"><button class="edit-btn" onclick="openModal({id:'${doc.id}',...${JSON.stringify(d).replace(/"/g,'&quot;')}})">✏️ Edit</button><button class="delete-btn" onclick="deleteProduct('${doc.id}')">🗑️ Delete</button></div></div></div>`;
      });
    });
    function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(type||'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
  </script>
</body>
</html>
