<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Dashboard | Sub Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#6366f1">
  <!-- Auth Protection -->
  <script src="/js/sub-admin-auth.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1a1e2b;min-height:100vh}
    .layout{display:flex;min-height:100vh}
    .sidebar{width:250px;background:#1a1e2b;color:white;position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column}
    .sidebar-brand{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
    .sidebar-brand span{font-size:1.2rem;font-weight:700}
    .sidebar-badge{background:#6366f1;padding:3px 10px;border-radius:20px;font-size:.6rem;font-weight:600}
    .sidebar-nav{flex:1;padding:20px 0}
    .sidebar-nav a{display:flex;align-items:center;gap:12px;padding:14px 24px;color:rgba(255,255,255,.7);text-decoration:none;font-weight:500}
    .sidebar-nav a:hover,.sidebar-nav a.active{background:rgba(255,255,255,.08);color:white}
    .sidebar-nav a.active{border-left:3px solid #6366f1}
    .sidebar-footer{padding:20px;border-top:1px solid rgba(255,255,255,.1)}
    .sidebar-footer button{width:100%;padding:12px;background:rgba(255,255,255,.1);border:none;color:white;border-radius:10px;cursor:pointer}
    .main-content{flex:1;margin-left:250px;padding:24px}
    h1{font-size:1.8rem;font-weight:800;margin-bottom:8px}
    .cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
    .cat-tag{background:#eef2ff;color:#4f46e5;padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:600}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}
    .stat-card{background:white;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .stat-val{font-size:1.8rem;font-weight:800;color:#6366f1}
    .stat-label{color:#6b7280;font-size:.85rem}
    table{width:100%;border-collapse:collapse;background:white;border-radius:16px;overflow:hidden}
    th{text-align:left;padding:12px 14px;background:#f8fafc;font-size:.75rem;text-transform:uppercase;color:#6b7280}
    td{padding:12px 14px;border-bottom:1px solid #e5e7eb;font-size:.9rem}
    .badge{padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
    .badge-rec{background:#fef3c7;color:#92400e}.badge-prep{background:#dbeafe;color:#1e40af}
    .badge-out{background:#d1fae5;color:#065f46}.badge-del{background:#e0e7ff;color:#3730a3}
    @media(max-width:768px){.sidebar{display:none}.main-content{margin-left:0;padding:16px}.stats{grid-template-columns:1fr 1fr}}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><span>🛒 OK Mart</span><span class="sidebar-badge">Sub Admin</span></div>
      <nav class="sidebar-nav">
        <a href="index.html" class="active">📊 Dashboard</a>
        <a href="products.html">📦 Products</a>
        <a href="orders.html">📋 Orders</a>
        <a href="offers.html">🏷️ Offers</a>
        <a href="customers.html">👥 Customers</a>
      </nav>
      <div class="sidebar-footer"><button onclick="subAdminLogout()">🚪 Logout</button></div>
    </aside>
    <main class="main-content">
      <h1>📊 Dashboard</h1>
      <div class="cats" id="catTags"></div>
      <div class="stats">
        <div class="stat-card"><div class="stat-val" id="totalOrders">0</div><div class="stat-label">Your Orders</div></div>
        <div class="stat-card"><div class="stat-val" id="totalRevenue">₹0</div><div class="stat-label">Revenue</div></div>
        <div class="stat-card"><div class="stat-val" id="pendingOrders">0</div><div class="stat-label">Pending</div></div>
        <div class="stat-card"><div class="stat-val" id="totalProducts">0</div><div class="stat-label">Products</div></div>
      </div>
      <h2 style="margin-bottom:14px;">📋 Recent Orders</h2>
      <table><thead><tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody id="recentOrders"></tbody></table>
    </main>
  </div>
  <script src="/js/firebase.js"></script>
  <script src="/js/role.js"></script>
  <script>
    const allowed=window.getAllowedCategories();
    document.getElementById('catTags').innerHTML=allowed.map(c=>`<span class="cat-tag">📦 ${c}</span>`).join('');
    
    let query=db.collection('products');
    if(!allowed.includes('all'))query=query.where('category','in',allowed);
    query.onSnapshot(s=>document.getElementById('totalProducts').textContent=s.size);
    
    db.collection('orders').orderBy('orderDate','desc').onSnapshot(snap=>{
      let orders=[],revenue=0,pending=0;
      snap.forEach(doc=>{
        const o={id:doc.id,...doc.data()};
        if(!window.orderHasAllowedItems(o))return;
        orders.push(o);
        const items=window.filterOrderItems(o);
        revenue+=items.reduce((s,i)=>s+(i.price||0)*(i.quantity||1),0);
        if(o.status!=='delivered'&&o.status!=='cancelled')pending++;
      });
      document.getElementById('totalOrders').textContent=orders.length;
      document.getElementById('totalRevenue').textContent='₹'+Math.round(revenue).toLocaleString('en-IN');
      document.getElementById('pendingOrders').textContent=pending;
      document.getElementById('recentOrders').innerHTML=orders.slice(0,8).map(o=>{
        const items=window.filterOrderItems(o);
        const total=items.reduce((s,i)=>s+(i.price||0)*(i.quantity||1),0);
        const s=o.status||'received';
        return `<tr><td style="font-family:monospace;color:#4f46e5;">#${o.orderId||o.id.slice(-8)}</td><td>${o.customerName||o.name||'-'}</td><td>₹${total.toLocaleString('en-IN')}</td><td><span class="badge badge-${s==='received'?'rec':s==='preparing'?'prep':s==='outfordelivery'?'out':'del'}">${s}</span></td><td>${new Date(o.orderDate).toLocaleDateString('en-IN')}</td></tr>`;
      }).join('')||'<tr><td colspan="5">No orders</td></tr>';
    });
  </script>
</body>
</html>
