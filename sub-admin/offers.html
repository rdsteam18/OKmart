<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Offers & Banners | OK Mart Sub Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#6366f1">
  <!-- Auth Protection -->
  <script src="../js/sub-admin-auth.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #6366f1; --primary-dark: #4f46e5; --primary-light: #eef2ff;
      --bg: #f8fafc; --card: #ffffff; --text: #1a1e2b; --muted: #6b7280;
      --border: #e5e7eb; --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.04); --shadow-md: 0 8px 24px rgba(0,0,0,.06);
      --radius: 16px; --transition: all .2s ease;
    }
    
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .admin-layout { display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar { width: 260px; background: #1a1e2b; color: white; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; transition: transform .3s; }
    .sidebar-brand { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 10px; }
    .sidebar-logo { font-size: 1.3rem; font-weight: 700; }
    .sidebar-badge { background: var(--primary); padding: 3px 10px; border-radius: 20px; font-size: .65rem; font-weight: 600; text-transform: uppercase; }
    .sidebar-nav { flex: 1; padding: 20px 0; }
    .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: rgba(255,255,255,.7); text-decoration: none; font-weight: 500; transition: var(--transition); }
    .sidebar-nav a:hover { background: rgba(255,255,255,.06); color: white; }
    .sidebar-nav a.active { background: rgba(99,102,241,.12); color: #a5b4fc; border-left: 3px solid var(--primary); }
    .sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,.1); }
    .sidebar-footer button { width: 100%; padding: 12px; background: rgba(255,255,255,.08); border: none; color: rgba(255,255,255,.7); border-radius: 10px; cursor: pointer; font-weight: 500; }
    
    .mobile-header { display: none; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; align-items: center; justify-content: space-between; }
    .menu-toggle { background: var(--bg); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
    
    .main-content { flex: 1; margin-left: 260px; padding: 24px; max-width: 1200px; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 24px; }
    
    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--card); border-radius: 14px; padding: 4px; border: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 12px 20px; border: none; background: none; border-radius: 12px; font-weight: 600; font-size: .9rem; cursor: pointer; transition: var(--transition); color: var(--muted); }
    .tab-btn.active { background: var(--primary); color: white; box-shadow: var(--shadow-sm); }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .add-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    
    /* Cards */
    .card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .card-code { font-weight: 700; font-family: monospace; font-size: 1.1rem; color: var(--primary-dark); }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: .7rem; font-weight: 600; }
    .badge-active { background: #d1fae5; color: #065f46; }
    .badge-inactive { background: #fee2e2; color: #991b1b; }
    .card-desc { font-size: .9rem; margin-bottom: 8px; color: var(--text); }
    .card-info { font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
    .card-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-sm { padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: .75rem; font-weight: 500; border: 1px solid var(--border); background: var(--bg); }
    .btn-sm.edit:hover { background: var(--primary-light); }
    .btn-sm.delete:hover { background: #fee2e2; color: var(--danger); border-color: var(--danger); }
    
    .banner-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; }
    .banner-title { font-weight: 600; margin-bottom: 4px; }
    .banner-info { font-size: .8rem; color: var(--muted); }
    
    /* Permission Denied */
    .permission-denied { background: #fee2e2; color: #991b1b; padding: 12px 16px; border-radius: 12px; font-size: .85rem; font-weight: 500; margin-bottom: 12px; display: none; }
    .permission-denied.show { display: block; }
    
    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 200; display: none; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: var(--card); border-radius: 24px; width: 95%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 28px; animation: slideUp .3s ease; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .modal-header h2 { font-size: 1.2rem; font-weight: 700; }
    .modal-close { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); border: none; font-size: 1.2rem; cursor: pointer; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; font-size: .9rem; font-family: inherit; }
    .form-row { display: flex; gap: 12px; } .form-row .form-group { flex: 1; }
    .form-check { display: flex; align-items: center; gap: 8px; margin: 16px 0; }
    .form-check input { accent-color: var(--primary); width: 18px; height: 18px; }
    .save-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
    
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--text); color: white; padding: 12px 24px; border-radius: 40px; font-weight: 500; z-index: 300; opacity: 0; transition: .3s; }
    .toast.show { opacity: 1; bottom: 50px; } .toast.success { background: var(--success); } .toast.error { background: var(--danger); }
    
    @media (max-width: 768px) { 
      .sidebar { transform: translateX(-100%); position: fixed; top: 0; left: 0; bottom: 0; width: 260px; z-index: 1000; transition: transform .3s ease; display: block !important; }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
      .sidebar-overlay.open { display: block; }
      .main-content { margin-left: 0; padding: 75px 16px 20px; width: 100%; } 
      .mobile-header { display: flex; position: fixed; top: 0; left: 0; right: 0; height: 60px; background: white; z-index: 900; padding: 0 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); align-items: center; justify-content: space-between; } 
      .form-row { flex-direction: column; } 
      .menu-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="admin-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span class="sidebar-logo">🛒 OK Mart</span><span class="sidebar-badge">Sub Admin</span></div>
      <nav class="sidebar-nav">
        <a href="index.html">📊 Dashboard</a>
        <a href="orders.html">📋 Orders</a>
        <a href="products.html">📦 Products</a>
        <a href="offers.html" class="active">🏷️ Offers</a>
        <a href="customers.html">👥 Customers</a>
      </nav>
      <div class="sidebar-footer"><button onclick="subAdminLogout()">🚪 Logout</button></div>
    </aside>

    <!-- Mobile Header -->
    <div class="mobile-header">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <span style="font-weight:700;">Offers & Banners</span>
      <button class="menu-toggle" onclick="location.reload()">🔄</button>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <h1>🏷️ Offers & Banners</h1>
      
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('coupons')">🎟️ Coupons</button>
        <button class="tab-btn" onclick="switchTab('banners')">🖼️ Banners</button>
      </div>

      <!-- Permission Denied -->
      <div class="permission-denied" id="permissionDenied"></div>

      <!-- COUPONS TAB -->
      <div class="tab-content active" id="tab-coupons">
        <div class="header-row"><h2>Coupon Codes</h2><button class="add-btn" onclick="openCouponModal()">➕ Add Coupon</button></div>
        <div class="card-grid" id="couponsGrid"><p style="color:var(--muted);">Loading coupons...</p></div>
      </div>

      <!-- BANNERS TAB -->
      <div class="tab-content" id="tab-banners">
        <div class="header-row"><h2>Promo Banners</h2><button class="add-btn" onclick="openBannerModal()">➕ Add Banner</button></div>
        <div class="card-grid" id="bannersGrid"><p style="color:var(--muted);">Loading banners...</p></div>
      </div>
    </main>
  </div>

  <!-- Coupon Modal -->
  <div class="modal-overlay" id="couponModal">
    <div class="modal-card">
      <div class="modal-header"><h2 id="couponModalTitle">Add Coupon</h2><button class="modal-close" onclick="closeCouponModal()">✕</button></div>
      <form id="couponForm"><input type="hidden" id="couponId">
        <div class="form-group"><label>Code *</label><input type="text" id="cCode" required placeholder="e.g., SAVE20"></div>
        <div class="form-row">
          <div class="form-group"><label>Type *</label><select id="cType"><option value="flat">Flat (₹)</option><option value="percent">Percent (%)</option></select></div>
          <div class="form-group"><label>Discount *</label><input type="number" id="cDiscount" required placeholder="20"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Min Order (₹)</label><input type="number" id="cMin" placeholder="250"></div>
          <div class="form-group"><label>Max Discount</label><input type="number" id="cMax" placeholder="Optional"></div>
        </div>
        <div class="form-group"><label>Category *</label><select id="cCategory" required></select></div>
        <div class="form-group"><label>Description</label><input type="text" id="cDesc" placeholder="Save ₹20 on orders above ₹250"></div>
        <div class="form-row">
          <div class="form-group"><label>Usage Limit</label><input type="number" id="cUsage"></div>
          <div class="form-group"><label>Per User</label><input type="number" id="cPerUser"></div>
        </div>
        <div class="form-check"><input type="checkbox" id="cActive" checked><label>Active</label></div>
        <button type="submit" class="save-btn">💾 Save Coupon</button>
      </form>
    </div>
  </div>

  <!-- Banner Modal -->
  <div class="modal-overlay" id="bannerModal">
    <div class="modal-card">
      <div class="modal-header"><h2 id="bannerModalTitle">Add Banner</h2><button class="modal-close" onclick="closeBannerModal()">✕</button></div>
      <form id="bannerForm"><input type="hidden" id="bannerId">
        <div class="form-group"><label>Title *</label><input type="text" id="bTitle" required placeholder="Big Sale"></div>
        <div class="form-group"><label>Image URL *</label><input type="url" id="bImage" required placeholder="https://..."></div>
        <div class="form-group"><label>Link</label><input type="text" id="bLink" placeholder="/offers.html"></div>
        <div class="form-group"><label>Category *</label><select id="bCategory" required></select></div>
        <div class="form-group"><label>Show On</label><select id="bPage"><option value="home">Home Page</option><option value="category">Category Page</option></select></div>
        <div class="form-check"><input type="checkbox" id="bActive" checked><label>Active</label></div>
        <button type="submit" class="save-btn">💾 Save Banner</button>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Firebase Config -->
  <script src="../js/firebase.js"></script>
  
  <!-- Role System -->
  <script src="../js/role.js"></script>
  
  <!-- Offers Script -->
  <script>
    // ===== SUB ADMIN - OFFERS & BANNERS =====
    
    var allowedCategories = window.getAllowedCategories();
    var catIcons = { electronics: '📱', household: '🧹', personal: '🧴', dairy: '🥛', fruits: '🍎', snacks: '🍿', beverages: '🥤', grocery: '🧺', bakery: '🥐', vegetables: '🥬' };
    
    console.log('📂 Sub-admin categories for offers:', allowedCategories);
    
    // ========== BUILD CATEGORY DROPDOWNS ==========
    function buildCategoryDropdown(selectId) {
      var select = document.getElementById(selectId);
      if (!select) return;
      select.innerHTML = '<option value="">Select Category</option>';
      allowedCategories.forEach(function(cat) {
        var icon = catIcons[cat] || '📦';
        var label = cat.charAt(0).toUpperCase() + cat.slice(1);
        select.innerHTML += '<option value="' + cat + '">' + icon + ' ' + label + '</option>';
      });
    }
    
    buildCategoryDropdown('cCategory');
    buildCategoryDropdown('bCategory');
    
    // ========== TABS ==========
    window.switchTab = function(tab) {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
      
      if (tab === 'coupons') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('tab-coupons').classList.add('active');
      } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('tab-banners').classList.add('active');
      }
    };
    
    // ========== PERMISSION DENIED ==========
    function showPermissionDenied(type) {
      var el = document.getElementById('permissionDenied');
      el.textContent = '⚠️ You can only create ' + type + 's for: ' + allowedCategories.join(', ');
      el.classList.add('show');
      setTimeout(function() { el.classList.remove('show'); }, 4000);
    }
    
    // ========== COUPONS ==========
    var couponModal = document.getElementById('couponModal');
    var couponEditId = null;
    
    window.openCouponModal = function(c) {
      c = c || null;
      couponEditId = c ? c.id : null;
      document.getElementById('couponModalTitle').textContent = c ? 'Edit Coupon' : 'Add Coupon';
      document.getElementById('couponId').value = c ? c.id : '';
      document.getElementById('cCode').value = c ? c.code : '';
      document.getElementById('cType').value = c ? c.type : 'flat';
      document.getElementById('cDiscount').value = c ? c.discount : '';
      document.getElementById('cMin').value = c ? c.minOrder : '';
      document.getElementById('cMax').value = c ? c.maxDiscount : '';
      document.getElementById('cCategory').value = c ? c.category : '';
      document.getElementById('cDesc').value = c ? c.description : '';
      document.getElementById('cUsage').value = c ? c.usageLimit : '';
      document.getElementById('cPerUser').value = c ? c.perUserLimit : '';
      document.getElementById('cActive').checked = c ? c.active !== false : true;
      document.getElementById('permissionDenied').classList.remove('show');
      couponModal.classList.add('active');
    };
    
    function closeCouponModal() { couponModal.classList.remove('active'); }
    couponModal.addEventListener('click', function(e) { if (e.target === couponModal) closeCouponModal(); });
    
    document.getElementById('couponForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var category = document.getElementById('cCategory').value;
      
      if (!allowedCategories.includes(category)) {
        showPermissionDenied('coupon');
        return;
      }
      
      var data = {
        code: document.getElementById('cCode').value.toUpperCase().trim(),
        type: document.getElementById('cType').value,
        discount: Number(document.getElementById('cDiscount').value),
        minOrder: Number(document.getElementById('cMin').value) || 0,
        maxDiscount: Number(document.getElementById('cMax').value) || null,
        category: category,
        description: document.getElementById('cDesc').value.trim(),
        usageLimit: Number(document.getElementById('cUsage').value) || null,
        perUserLimit: Number(document.getElementById('cPerUser').value) || null,
        active: document.getElementById('cActive').checked
      };
      
      try {
        if (couponEditId) {
          await db.collection('offers').doc(couponEditId).update(data);
        } else {
          await db.collection('offers').add(data);
        }
        closeCouponModal();
        showToast(couponEditId ? '✅ Coupon updated!' : '✅ Coupon added!', 'success');
      } catch(err) {
        console.error(err);
        showToast('❌ Error saving', 'error');
      }
    });
    
    function deleteCoupon(id, category) {
      if (!allowedCategories.includes(category)) {
        showToast('❌ Permission denied', 'error');
        return;
      }
      if (confirm('Delete this coupon?')) {
        db.collection('offers').doc(id).delete().then(function() {
          showToast('🗑️ Deleted');
        });
      }
    }
    
    // Load coupons
    db.collection('offers').onSnapshot(function(snapshot) {
      var grid = document.getElementById('couponsGrid');
      var filtered = [];
      
      snapshot.forEach(function(doc) {
        var d = doc.data();
        d.id = doc.id;
        if (allowedCategories.includes(d.category) || !d.category) {
          filtered.push(d);
        }
      });
      
      if (filtered.length === 0) {
        grid.innerHTML = '<p style="color:var(--muted);">No coupons in your categories</p>';
        return;
      }
      
      grid.innerHTML = '';
      filtered.forEach(function(d) {
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = 
          '<div class="card-header">' +
            '<span class="card-code">' + d.code + '</span>' +
            '<span class="badge ' + (d.active !== false ? 'badge-active' : 'badge-inactive') + '">' + (d.active !== false ? 'Active' : 'Inactive') + '</span>' +
          '</div>' +
          '<div class="card-desc">' + (d.description || (d.type === 'flat' ? '₹' + d.discount + ' OFF' : d.discount + '% OFF')) + '</div>' +
          '<div class="card-info">📂 ' + (d.category || 'All') + ' · Min: ₹' + d.minOrder + (d.maxDiscount ? ' · Max: ₹' + d.maxDiscount : '') + '</div>' +
          '<div class="card-actions">' +
            '<button class="btn-sm edit">✏️ Edit</button>' +
            '<button class="btn-sm delete">🗑️ Delete</button>' +
          '</div>';
        
        // Add event listeners
        card.querySelector('.edit').addEventListener('click', function() {
          openCouponModal({
            id: d.id, code: d.code, type: d.type, discount: d.discount,
            minOrder: d.minOrder, maxDiscount: d.maxDiscount, category: d.category,
            description: d.description, usageLimit: d.usageLimit, perUserLimit: d.perUserLimit,
            active: d.active
          });
        });
        
        card.querySelector('.delete').addEventListener('click', function() {
          deleteCoupon(d.id, d.category);
        });
        
        grid.appendChild(card);
      });
    });
    
    // ========== BANNERS ==========
    var bannerModal = document.getElementById('bannerModal');
    var bannerEditId = null;
    
    window.openBannerModal = function(b) {
      b = b || null;
      bannerEditId = b ? b.id : null;
      document.getElementById('bannerModalTitle').textContent = b ? 'Edit Banner' : 'Add Banner';
      document.getElementById('bannerId').value = b ? b.id : '';
      document.getElementById('bTitle').value = b ? b.title : '';
      document.getElementById('bImage').value = b ? b.image : '';
      document.getElementById('bLink').value = b ? b.link : '';
      document.getElementById('bCategory').value = b ? b.category : '';
      document.getElementById('bPage').value = b ? b.page : 'home';
      document.getElementById('bActive').checked = b ? b.active !== false : true;
      document.getElementById('permissionDenied').classList.remove('show');
      bannerModal.classList.add('active');
    };
    
    function closeBannerModal() { bannerModal.classList.remove('active'); }
    bannerModal.addEventListener('click', function(e) { if (e.target === bannerModal) closeBannerModal(); });
    
    document.getElementById('bannerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var category = document.getElementById('bCategory').value;
      
      if (!allowedCategories.includes(category)) {
        showPermissionDenied('banner');
        return;
      }
      
      var data = {
        title: document.getElementById('bTitle').value.trim(),
        image: document.getElementById('bImage').value.trim(),
        link: document.getElementById('bLink').value.trim(),
        category: category,
        page: document.getElementById('bPage').value,
        active: document.getElementById('bActive').checked
      };
      
      try {
        if (bannerEditId) {
          await db.collection('banners').doc(bannerEditId).update(data);
        } else {
          await db.collection('banners').add(data);
        }
        closeBannerModal();
        showToast(bannerEditId ? '✅ Banner updated!' : '✅ Banner added!', 'success');
      } catch(err) {
        showToast('❌ Error saving', 'error');
      }
    });
    
    function deleteBanner(id, category) {
      if (!allowedCategories.includes(category)) {
        showToast('❌ Permission denied', 'error');
        return;
      }
      if (confirm('Delete this banner?')) {
        db.collection('banners').doc(id).delete().then(function() {
          showToast('🗑️ Deleted');
        });
      }
    }
    
    // Load banners
    db.collection('banners').onSnapshot(function(snapshot) {
      var grid = document.getElementById('bannersGrid');
      var filtered = [];
      
      snapshot.forEach(function(doc) {
        var d = doc.data();
        d.id = doc.id;
        if (allowedCategories.includes(d.category) || !d.category) {
          filtered.push(d);
        }
      });
      
      if (filtered.length === 0) {
        grid.innerHTML = '<p style="color:var(--muted);">No banners in your categories</p>';
        return;
      }
      
      grid.innerHTML = '';
      filtered.forEach(function(d) {
        var card = document.createElement('div');
        card.className = 'card banner-card';
        card.innerHTML = 
          '<img src="' + d.image + '" onerror="this.src=\'https://placehold.co/400x140\'">' +
          '<div class="banner-title">' + d.title + '</div>' +
          '<div class="banner-info">📂 ' + (d.category || 'All') + ' · 📍 ' + (d.page || 'home') + ' · <span class="badge ' + (d.active !== false ? 'badge-active' : 'badge-inactive') + '">' + (d.active !== false ? 'Active' : 'Inactive') + '</span></div>' +
          '<div class="card-actions">' +
            '<button class="btn-sm edit">✏️ Edit</button>' +
            '<button class="btn-sm delete">🗑️ Delete</button>' +
          '</div>';
        
        card.querySelector('.edit').addEventListener('click', function() {
          openBannerModal({
            id: d.id, title: d.title, image: d.image, link: d.link,
            category: d.category, page: d.page, active: d.active
          });
        });
        
        card.querySelector('.delete').addEventListener('click', function() {
          deleteBanner(d.id, d.category);
        });
        
        grid.appendChild(card);
      });
    });
    
    // ========== TOAST ==========
    function showToast(msg, type) {
      var toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.className = 'toast ' + (type || 'info');
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 3000);
    }
    
    window.toggleSidebar = function() {
      document.getElementById('sidebar')?.classList.toggle('open');
      document.getElementById('sidebarOverlay')?.classList.toggle('open');
    };
    
    console.log('✅ Sub-admin offers page ready');
  </script>
</body>
</html>
