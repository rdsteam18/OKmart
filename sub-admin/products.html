<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Products | Sub Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Auth Protection -->
  <script src="../js/sub-admin-auth.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1a1e2b;min-height:100vh}
    .layout{display:flex;min-height:100vh}
    .sidebar{width:250px;background:#1a1e2b;color:white;position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column}
    .sidebar-brand{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
    .sidebar-brand span{font-size:1.2rem;font-weight:700}
    .sidebar-badge{background:#6366f1;padding:3px 10px;border-radius:20px;font-size:.6rem}
    .sidebar-nav{flex:1;padding:20px 0}
    .sidebar-nav a{display:flex;align-items:center;gap:12px;padding:14px 24px;color:rgba(255,255,255,.7);text-decoration:none;font-weight:500}
    .sidebar-nav a:hover,.sidebar-nav a.active{background:rgba(255,255,255,.08);color:white}
    .sidebar-nav a.active{border-left:3px solid #6366f1}
    .sidebar-footer{padding:20px}
    .sidebar-footer button{width:100%;padding:12px;background:rgba(255,255,255,.1);border:none;color:white;border-radius:10px;cursor:pointer}
    .main-content{flex:1;margin-left:250px;padding:24px}
    h1{font-size:1.6rem;font-weight:800;margin-bottom:16px}
    .add-btn{background:#6366f1;color:white;border:none;padding:10px 20px;border-radius:10px;font-weight:600;cursor:pointer;margin-bottom:16px}
    table{width:100%;border-collapse:collapse;background:white;border-radius:16px;overflow:hidden}
    th{text-align:left;padding:12px;background:#f8fafc;font-size:.75rem;text-transform:uppercase;color:#6b7280}
    td{padding:10px 12px;border-bottom:1px solid #e5e7eb;font-size:.9rem}
    .prod-img{width:40px;height:40px;border-radius:8px;object-fit:cover}
    .btn-sm{padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.7rem;border:1px solid #e5e7eb;background:#f8fafc}
    .btn-del{background:#fee2e2;color:#ef4444;border-color:#ef4444}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
    .modal-overlay.active{display:flex}
    .modal-card{background:white;border-radius:20px;width:90%;max-width:500px;padding:24px;max-height:80vh;overflow-y:auto}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-weight:600;font-size:.85rem;margin-bottom:6px}
    .form-group input,.form-group select{width:100%;padding:10px 12px;background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:10px;font-size:.9rem}
    .form-row{display:flex;gap:12px}.form-row .form-group{flex:1}
    .save-btn{width:100%;padding:12px;background:#6366f1;color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer}
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1e2b;color:white;padding:12px 24px;border-radius:40px;z-index:300;opacity:0;transition:.3s}
    .toast.show{opacity:1;bottom:50px}.toast.success{background:#10b981}
    @media(max-width:768px){.sidebar{display:none}.main-content{margin-left:0;padding:16px}}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><span>🛒 OK Mart</span><span class="sidebar-badge">Sub Admin</span></div>
      <nav class="sidebar-nav">
        <a href="index.html">📊 Dashboard</a>
        <a href="products.html" class="active">📦 Products</a>
        <a href="orders.html">📋 Orders</a>
        <a href="offers.html">🏷️ Offers</a>
        <a href="customers.html">👥 Customers</a>
      </nav>
      <div class="sidebar-footer"><button onclick="subAdminLogout()">🚪 Logout</button></div>
    </aside>
    <main class="main-content">
      <h1>📦 Products</h1>
      <button class="add-btn" onclick="openModal()">➕ Add Product</button>
      <table><thead><tr><th>Img</th><th>Name</th><th>Price</th><th>Category</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="prodTable"></tbody></table>
    </main>
    <div class="modal-overlay" id="modal">
      <div class="modal-card">
        <h3 id="modalTitle">Add Product</h3>
        <form id="prodForm"><input type="hidden" id="prodId">
          <div class="form-group"><label>Name *</label><input type="text" id="pName" required></div>
          <div class="form-row"><div class="form-group"><label>Price *</label><input type="number" id="pPrice" required></div><div class="form-group"><label>MRP</label><input type="number" id="pMrp"></div></div>
          <div class="form-group"><label>Image URL *</label><input type="url" id="pImage" required></div>
          <div class="form-group"><label>Category *</label><select id="pCategory" required></select></div>
          <div class="form-row"><div class="form-group"><label>Unit</label><input type="text" id="pUnit"></div><div class="form-group"><label>Stock</label><input type="number" id="pStock" value="100"></div></div>
          <button type="submit" class="save-btn">💾 Save</button>
        </form>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="../js/firebase.js"></script>
  <script src="../js/role.js"></script>
  <script>
    const allowed=window.getAllowedCategories();
    const sel=document.getElementById('pCategory');
    allowed.forEach(c=>{sel.innerHTML+=`<option value="${c}">${c}</option>`;});
    let editId=null;
    
    function openModal(p=null){
      editId=p?.id||null;
      document.getElementById('modalTitle').textContent=p?'Edit':'Add';
      document.getElementById('prodId').value=p?.id||'';
      document.getElementById('pName').value=p?.name||'';
      document.getElementById('pPrice').value=p?.price||'';
      document.getElementById('pMrp').value=p?.mrp||'';
      document.getElementById('pImage').value=p?.image||'';
      document.getElementById('pCategory').value=p?.category||allowed[0];
      document.getElementById('pUnit').value=p?.unit||'';
      document.getElementById('pStock').value=p?.stock||100;
      document.getElementById('modal').classList.add('active');
    }
    document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))document.getElementById('modal').classList.remove('active');});
    
    document.getElementById('prodForm').addEventListener('submit',async function(e){
      e.preventDefault();
      const cat=document.getElementById('pCategory').value;
      if(!window.canAccessCategory(cat)){showToast('❌ Not allowed','error');return;}
      const data={name:document.getElementById('pName').value,price:Number(document.getElementById('pPrice').value),mrp:Number(document.getElementById('pMrp').value)||0,image:document.getElementById('pImage').value,category:cat,unit:document.getElementById('pUnit').value,stock:Number(document.getElementById('pStock').value),active:true};
      try{
        if(editId)await db.collection('products').doc(editId).update(data);
        else await db.collection('products').add({...data,createdAt:new Date().toISOString()});
        document.getElementById('modal').classList.remove('active');
        showToast(editId?'Updated!':'Added!','success');
      }catch(err){showToast('Error','error');}
    });
    
    function deleteProd(id,cat){if(!window.canAccessCategory(cat))return;if(confirm('Delete?'))db.collection('products').doc(id).delete().then(()=>showToast('Deleted'));}
    
    let q=db.collection('products');
    if(!allowed.includes('all'))q=q.where('category','in',allowed);
    q.onSnapshot(snap=>{
      const tb=document.getElementById('prodTable');
      if(snap.empty){tb.innerHTML='<tr><td colspan="6">No products</td></tr>';return;}
      tb.innerHTML='';
      snap.forEach(doc=>{
        const d=doc.data();
        tb.innerHTML+=`<tr><td><img src="${d.image}" class="prod-img" onerror="this.src=\'https://placehold.co/40\'"></td><td>${d.name}</td><td>₹${d.price}</td><td>${d.category}</td><td>${d.stock||0}</td><td><button class="btn-sm" onclick="openModal({id:'${doc.id}',name:'${d.name.replace(/'/g,"\\\'")}',price:${d.price},mrp:${d.mrp||0},image:'${d.image}',category:'${d.category}',unit:'${(d.unit||'').replace(/'/g,"\\\'")}',stock:${d.stock||0}})">✏️</button> <button class="btn-sm btn-del" onclick="deleteProd('${doc.id}','${d.category}')">🗑️</button></td></tr>`;
      });
    });
    
    function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(type||'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
  </script>
</body>
</html>
