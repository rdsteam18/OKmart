<!DOCTYPE html>
<html lang="en">
<head>
  <!-- PWA Meta Tags -->
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OK Mart">
<link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">

<!-- Theme Color -->
<meta name="theme-color" content="#2ecc71">
<meta name="msapplication-TileColor" content="#2ecc71">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Snacks & Munchies · OK Mart</title>
  
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/category.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header category-header">
    <div class="header-container">
      <div class="header-left">
        <a href="/index.html" class="back-button" aria-label="back to home">
          <span class="back-icon">←</span>
        </a>
        <a href="/index.html" class="logo-link">
          <span class="logo-text">🛒 OK Mart</span>
        </a>
      </div>
      <!-- Update cart icon in all pages -->
<a href="/cart.html" class="cart-icon-link" id="cartIcon" aria-label="cart">
  <span class="cart-icon">🛍️</span>
  <span class="cart-badge" id="cartCountPlaceholder">0</span>
</a>
    </div>
  </header>

  <main class="category-main">
    <div class="category-hero">
      <div class="category-icon">🍿</div>
      <h1 class="category-title" id="categoryTitle">Snacks & Munchies</h1>
      <p class="category-description" id="categoryDescription">Chips, namkeen, biscuits & more</p>
    </div>

    <div class="search-container">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="categorySearchInput" 
          class="search-input" 
          placeholder="Search in snacks..."
          autocomplete="off"
        >
        <button class="clear-search" id="clearCategorySearch" aria-label="clear search">✕</button>
      </div>
    </div>

    <div class="results-info">
      <span class="results-count" id="categoryResultsCount">0 items</span>
      <button class="sort-btn" id="sortToggleBtn" aria-label="sort">
        <span>📊 Sort</span>
      </button>
    </div>

    <div class="product-grid category-grid" id="categoryProductGrid">
      <div class="loading-state" id="categoryLoadingState">
        <div class="loading-spinner"></div>
        <p>Loading fresh products...</p>
      </div>
    </div>

    <div class="sort-dropdown" id="sortDropdown" style="display: none;">
      <button class="sort-option" data-sort="popular">🔥 Popular First</button>
      <button class="sort-option" data-sort="price-low">💰 Price: Low to High</button>
      <button class="sort-option" data-sort="price-high">💎 Price: High to Low</button>
      <button class="sort-option" data-sort="discount">🏷️ Best Discount</button>
    </div>
  </main>

  <div class="sticky-bottom-bar">
    <div class="bottom-bar-inner">
      <span class="delivery-message">🚀 delivery in 10 mins</span>
      <span class="min-order">min order ₹99</span>
    </div>
  </div>

  <a href="tel:+919982239821" class="floating-call-btn" aria-label="Call for support">
    <span class="call-icon">📞</span>
  </a>

  <script src="/js/common.js"></script>
  <script src="/js/category.js"></script>
  <script>
    // EXACT CATEGORY MATCH - "snacks" (lowercase)
    window.__OKMART_CATEGORY_CONFIG = {
      slug: 'snacks',
      displayName: 'Snacks & Munchies',
      description: 'Chips, namkeen, biscuits & more',
      icon: '🍿'
    };
  </script>
  <!-- PWA Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((registration) => {
          console.log('[PWA] Service Worker registered:', registration.scope);
        })
        .catch((error) => {
          console.log('[PWA] Service Worker registration failed:', error);
        });
    });
  }
</script>

<!-- PWA Install Prompt -->
<script src="/js/pwa.js"></script>
</body>
</html>
