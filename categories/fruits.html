<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  
  <title>Fresh Fruits · OK Mart</title>
  <meta name="description" content="Buy fresh fruits online - apples, bananas, oranges, grapes. Fast delivery from OK Mart.">
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2ecc71">
  
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/category.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header category-header">
    <div class="header-container">
      <div class="header-left">
        <a href="/index.html" class="back-button" aria-label="back to home">
          <span class="back-icon">←</span>
        </a>
        <a href="/index.html" class="logo-link">
          <span class="logo-text">🛒 OK Mart</span>
        </a>
      </div>
      <a href="/cart.html" class="cart-icon-link" id="cartIcon" aria-label="cart">
        <span class="cart-icon">🛍️</span>
        <span class="cart-badge" id="cartCountPlaceholder">0</span>
      </a>
    </div>
  </header>

  <main class="category-main">
    <div class="category-hero">
      <div class="category-icon">🍎</div>
      <h1 class="category-title" id="categoryTitle">Fresh Fruits</h1>
      <p class="category-description" id="categoryDescription">Fresh and juicy fruits delivered to your doorstep</p>
    </div>

    <div class="search-container">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="categorySearchInput" class="search-input" placeholder="Search fruits..." autocomplete="off">
        <button class="clear-search" id="clearCategorySearch" aria-label="clear search">✕</button>
      </div>
    </div>

    <div class="results-info">
      <span class="results-count" id="categoryResultsCount">0 items</span>
      <button class="sort-btn" id="sortToggleBtn" aria-label="sort">
        <span>📊 Sort</span>
      </button>
    </div>

    <div class="product-grid category-grid" id="categoryProductGrid">
      <div class="loading-state" id="categoryLoadingState">
        <div class="loading-spinner"></div>
        <p>Loading fresh fruits...</p>
      </div>
    </div>

    <div class="sort-dropdown" id="sortDropdown" style="display: none;">
      <button class="sort-option" data-sort="popular">🔥 Popular First</button>
      <button class="sort-option" data-sort="price-low">💰 Price: Low to High</button>
      <button class="sort-option" data-sort="price-high">💎 Price: High to Low</button>
      <button class="sort-option" data-sort="discount">🏷️ Best Discount</button>
    </div>
  </main>

  <div class="sticky-bottom-bar">
    <div class="bottom-bar-inner">
      <span class="delivery-message">🚀 delivery in 10 mins</span>
      <span class="min-order">min order ₹99</span>
    </div>
  </div>

  <a href="tel:+919982239821" class="floating-call-btn" aria-label="Call for support">
    <span class="call-icon">📞</span>
  </a>

  <script src="/js/common.js"></script>
  <script src="/js/category-loader.js"></script>
  <script>
    window.__OKMART_CATEGORY = 'fruits';
    window.__OKMART_JSON_FILE = '/data/fruits.json';
  </script>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
