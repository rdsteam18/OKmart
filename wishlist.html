<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>My Wishlist | OK Mart</title>
  <meta name="theme-color" content="#84c225">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#f8fafc;color:#1a1e2b;min-height:100vh}
    .container{max-width:480px;margin:0 auto;padding:0 16px 100px}
    .header{display:flex;align-items:center;gap:12px;padding:12px 0}
    .back-btn{width:40px;height:40px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.5rem;border:1px solid #e5e7eb}
    h1{font-size:1.3rem;font-weight:700}
    .wishlist-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
    .product-card{background:white;border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.03);position:relative}
    .product-card img{width:100%;border-radius:12px;margin-bottom:8px;aspect-ratio:1;object-fit:cover;background:#f1f5f9}
    .product-name{font-weight:600;font-size:.85rem;margin-bottom:4px}
    .product-price{font-weight:700;color:#5f930e}
    .remove-btn{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:white;border:1px solid #e5e7eb;cursor:pointer;font-size:.8rem}
    .add-cart-btn{width:100%;padding:8px;background:#f3f9eb;border:1.5px solid #84c225;color:#5f930e;border-radius:30px;font-weight:600;font-size:.75rem;cursor:pointer;margin-top:8px}
    .empty-state{text-align:center;padding:80px 20px}
    .empty-state span{font-size:4rem;opacity:.5;display:block;margin-bottom:16px}
    .shop-btn{display:inline-block;margin-top:20px;background:#84c225;color:white;padding:14px 28px;border-radius:40px;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><a href="/profile.html" class="back-btn">←</a><h1>My Wishlist</h1></div>
    <div class="wishlist-grid" id="wishlistGrid"></div>
    <div id="emptyState" class="empty-state" style="display:none;">
      <span>❤️</span><h2>Your wishlist is empty</h2><p>Save your favorite products here</p>
      <a href="/index.html" class="shop-btn">Browse Products →</a>
    </div>
  </div>

  <script src="/js/firebase.js"></script>
  <script src="/js/common.js"></script>
  <script>
    async function loadWishlist() {
      const wishlist = window.OKMart.getWishlist();
      const grid = document.getElementById('wishlistGrid');
      
      if (wishlist.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      
      grid.innerHTML = '';
      for (const item of wishlist) {
        try {
          const doc = await db.collection('products').doc(item.id).get();
          if (doc.exists) {
            const p = { id: doc.id, ...doc.data() };
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
              <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200'">
              <button class="remove-btn" onclick="removeWishlist('${p.id}')">🗑️</button>
              <div class="product-name">${p.name}</div>
              <div class="product-price">₹${p.price}</div>
              <button class="add-cart-btn" onclick="addToCart('${p.id}')">Add to Cart</button>
            `;
            grid.appendChild(card);
          }
        } catch(e) {}
      }
    }
    
    function removeWishlist(id) {
      window.OKMart.toggleWishlist({ id });
      loadWishlist();
    }
    
    async function addToCart(id) {
      const doc = await db.collection('products').doc(id).get();
      if (doc.exists) window.OKMart.addToCart({ id: doc.id, ...doc.data() });
    }
    
    loadWishlist();
  </script>
</body>
</html>
