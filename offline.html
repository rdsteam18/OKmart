<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline · OK Mart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7fdf9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .offline-container {
      text-align: center;
      max-width: 400px;
      background: white;
      padding: 40px 24px;
      border-radius: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    
    .offline-icon {
      font-size: 5rem;
      margin-bottom: 20px;
    }
    
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1e2a2e;
      margin-bottom: 12px;
    }
    
    p {
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    
    .retry-btn {
      background: #2ecc71;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    
    .retry-btn:hover {
      background: #27ae60;
      transform: translateY(-2px);
    }
    
    .cached-pages {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
    }
    
    .cached-pages h3 {
      font-size: 1rem;
      color: #1e2a2e;
      margin-bottom: 12px;
    }
    
    .cached-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    
    .cached-link {
      background: #f7fdf9;
      color: #2ecc71;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>No internet connection. Don't worry, you can still browse previously viewed pages.</p>
    
    <button class="retry-btn" onclick="location.reload()">
      🔄 Try Again
    </button>
    
    <div class="cached-pages">
      <h3>📦 Available Offline</h3>
      <div class="cached-links">
        <a href="/" class="cached-link">🏠 Home</a>
        <a href="/cart.html" class="cached-link">🛒 Cart</a>
        <a href="/categories/dairy.html" class="cached-link">🥛 Dairy</a>
        <a href="/categories/snacks.html" class="cached-link">🍿 Snacks</a>
        <a href="/track.html" class="cached-link">📦 Track</a>
      </div>
    </div>
  </div>
</body>
</html>
