<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Track Order | OK Mart</title>
  <meta name="theme-color" content="#2ecc71">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #2ecc71;
      --primary-dark: #27ae60;
      --primary-light: #e8f8ef;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1a1e2b;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --info: #3b82f6;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.04);
      --shadow-md: 0 8px 24px rgba(0,0,0,.06);
      --radius: 20px;
      --transition: all .2s ease;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
    }
    
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    /* Header */
    .app-header {
      background: var(--card);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--border);
    }
    
    .header-container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo-link {
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logo-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-dark);
    }
    
    .back-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 30px;
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      font-size: .85rem;
      transition: var(--transition);
    }
    
    .back-btn:hover {
      background: var(--border);
    }
    
    /* Main Content */
    .track-main {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      min-height: calc(100vh - 70px);
    }
    
    /* Loading State */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      text-align: center;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: pulse 1s ease infinite;
      margin-bottom: 20px;
    }
    
    /* Input Section */
    .input-section {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      text-align: center;
      animation: fadeIn .3s ease;
    }
    
    .input-section h2 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }
    
    .input-section p {
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: 20px;
    }
    
    .input-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .order-input {
      flex: 2;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-size: 1rem;
      font-family: monospace;
      transition: var(--transition);
    }
    
    .order-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    
    .track-btn {
      flex: 1;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .track-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(46,204,113,.3);
    }
    
    /* Order Details Card */
    .order-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 20px;
      animation: slideUp .4s ease;
    }
    
    .order-header {
      background: linear-gradient(135deg, var(--primary-light), var(--card));
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    
    .order-id {
      font-weight: 700;
      font-family: monospace;
      font-size: 1.1rem;
      color: var(--primary-dark);
    }
    
    .order-date {
      font-size: .75rem;
      color: var(--muted);
    }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: .75rem;
      font-weight: 600;
    }
    
    .status-pending { background: #fef3c7; color: #d97706; }
    .status-confirmed { background: #dbeafe; color: #2563eb; }
    .status-preparing { background: #fef3c7; color: #d97706; }
    .status-out_for_delivery { background: #e0e7ff; color: #4338ca; }
    .status-delivered { background: #d1fae5; color: #065f46; }
    .status-cancelled { background: #fee2e2; color: #dc2626; }
    
    /* Order Info */
    .order-info {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .info-label {
      color: var(--muted);
      font-size: .85rem;
    }
    
    .info-value {
      font-weight: 600;
    }
    
    /* Timeline */
    .timeline-section {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }
    
    .timeline-title {
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }
    
    .timeline::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 10px;
      width: 2px;
      height: calc(100% - 20px);
      background: var(--border);
    }
    
    .timeline-item {
      display: flex;
      gap: 16px;
      position: relative;
      z-index: 1;
    }
    
    .timeline-icon {
      width: 40px;
      height: 40px;
      background: var(--bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      border: 2px solid var(--border);
      transition: var(--transition);
    }
    
    .timeline-icon.completed {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    
    .timeline-icon.active {
      background: var(--primary-light);
      border-color: var(--primary);
      animation: pulse 1.5s ease infinite;
    }
    
    .timeline-content {
      flex: 1;
      padding-bottom: 8px;
    }
    
    .timeline-step {
      font-weight: 700;
      font-size: .95rem;
      margin-bottom: 4px;
    }
    
    .timeline-time {
      font-size: .7rem;
      color: var(--muted);
    }
    
    /* Map Section */
    .map-section {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }
    
    .map-container {
      height: 200px;
      border-radius: 16px;
      overflow: hidden;
      background: var(--bg);
      margin-top: 12px;
    }
    
    .map-placeholder {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg), var(--border));
      color: var(--muted);
    }
    
    /* Items Section */
    .items-section {
      padding: 20px;
    }
    
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }
    
    .order-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: var(--bg);
      border-radius: 14px;
    }
    
    .item-image {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      object-fit: cover;
      background: #e2e8f0;
    }
    
    .item-details {
      flex: 1;
    }
    
    .item-name {
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .item-price {
      font-size: .8rem;
      color: var(--muted);
    }
    
    .item-quantity {
      font-weight: 600;
      color: var(--primary-dark);
    }
    
    .summary {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }
    
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
    }
    
    .summary-total {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--primary-dark);
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 12px;
    }
    
    /* Action Buttons */
    .action-buttons {
      padding: 0 20px 20px;
      display: flex;
      gap: 12px;
    }
    
    .btn-whatsapp {
      flex: 1;
      background: #25D366;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: var(--transition);
    }
    
    .btn-home {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      transition: var(--transition);
    }
    
    .btn-whatsapp:hover, .btn-home:hover {
      transform: translateY(-2px);
    }
    
    /* Error State */
    .error-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card);
      border-radius: var(--radius);
    }
    
    .error-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: white;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 500;
      z-index: 300;
      opacity: 0;
      transition: all .3s ease;
    }
    
    .toast.show {
      opacity: 1;
      bottom: 50px;
    }
    
    /* Delivery Progress Bar */
    .delivery-progress {
      margin: 20px;
      background: var(--bg);
      border-radius: 30px;
      overflow: hidden;
    }
    
    .progress-bar {
      height: 8px;
      background: linear-gradient(90deg, var(--primary-light), var(--primary));
      width: 0%;
      transition: width .5s ease;
      border-radius: 30px;
      animation: shimmer 2s ease infinite;
      background-size: 200% 100%;
    }
    
    .progress-steps {
      display: flex;
      justify-content: space-between;
      padding: 12px 20px;
      font-size: .7rem;
      color: var(--muted);
    }
    
    .progress-step {
      text-align: center;
      flex: 1;
    }
    
    .progress-step.active {
      color: var(--primary);
      font-weight: 600;
    }
    
    /* Responsive */
    @media (max-width: 480px) {
      .track-main {
        padding: 16px;
      }
      
      .input-group {
        flex-direction: column;
      }
      
      .order-header {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<header class="app-header">
  <div class="header-container">
    <a href="index.html" class="logo-link">
      <span class="logo-text">🛒 OK Mart</span>
    </a>
    <a href="index.html" class="back-btn">← Back to Store</a>
  </div>
</header>

<main class="track-main">
  
  <!-- Loading State -->
  <div id="loadingState" class="loading-state" style="display: none;">
    <div class="loading-spinner"></div>
    <p>Loading order details...</p>
  </div>
  
  <!-- Input Section -->
  <div id="inputSection" class="input-section">
    <h2>🔍 Track Your Order</h2>
    <p>Enter your order ID to track delivery status</p>
    <div class="input-group">
      <input type="text" id="orderIdInput" class="order-input" placeholder="e.g., #ORD123456" autocomplete="off">
      <button class="track-btn" onclick="trackOrder()">Track Order →</button>
    </div>
  </div>
  
  <!-- Order Details Container -->
  <div id="orderContainer" style="display: none;"></div>
  
  <!-- Error State -->
  <div id="errorState" class="error-state" style="display: none;">
    <div class="error-icon">⚠️</div>
    <h3>Order Not Found</h3>
    <p>We couldn't find an order with that ID. Please check and try again.</p>
    <button class="track-btn" onclick="resetTracking()" style="margin-top: 20px;">Try Again</button>
  </div>

</main>

<div class="toast" id="toast"></div>

<script src="js/firebase.js"></script>
<script>
  // ===== REAL-TIME ORDER TRACKING SYSTEM =====
  
  let currentOrderId = null;
  let currentOrder = null;
  let unsubscribeOrder = null;
  let map = null;
  let mapMarker = null;
  
  // Get order ID from URL parameter
  function getOrderIdFromUrl() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('id');
  }
  
  // Initialize - check URL for order ID
  async function init() {
    const orderId = getOrderIdFromUrl();
    if (orderId) {
      document.getElementById('orderIdInput').value = orderId;
      await trackOrder(orderId);
    }
  }
  
  // Track Order Function
  window.trackOrder = async function(orderId = null) {
    const inputId = orderId || document.getElementById('orderIdInput').value.trim();
    if (!inputId) {
      showToast('Please enter an order ID', 'error');
      return;
    }
    
    // Clean order ID (remove # if present)
    let cleanId = inputId.replace(/^#/, '');
    
    showLoading(true);
    hideOrder();
    hideError();
    
    // Unsubscribe from previous listener
    if (unsubscribeOrder) {
      unsubscribeOrder();
      unsubscribeOrder = null;
    }
    
    try {
      // First check if order exists
      const orderDoc = await db.collection('orders').doc(cleanId).get();
      
      if (!orderDoc.exists) {
        showError();
        showLoading(false);
        return;
      }
      
      currentOrderId = cleanId;
      currentOrder = { id: orderDoc.id, ...orderDoc.data() };
      
      // Set up real-time listener
      unsubscribeOrder = db.collection('orders').doc(cleanId).onSnapshot((doc) => {
        if (doc.exists) {
          currentOrder = { id: doc.id, ...doc.data() };
          renderOrderTracking(currentOrder);
          showLoading(false);
          hideInputSection();
        } else {
          showError();
          showLoading(false);
        }
      });
      
    } catch (error) {
      console.error('Error tracking order:', error);
      showError();
      showLoading(false);
    }
  };
  
  // Render Order Tracking Page
  function renderOrderTracking(order) {
    const container = document.getElementById('orderContainer');
    const status = order.status || 'pending';
    const isDelivered = status === 'delivered';
    const isCancelled = status === 'cancelled';
    
    // Calculate delivery progress percentage
    const progressPercent = getProgressPercent(status);
    
    // Timeline steps
    const timelineHTML = renderTimeline(order);
    
    // Items HTML
    const itemsHTML = renderItems(order.items || []);
    
    // Format date
    const orderDate = order.orderDate?.toDate ? order.orderDate.toDate() : new Date(order.orderDate);
    
    container.innerHTML = `
      <!-- Order Header -->
      <div class="order-card">
        <div class="order-header">
          <div>
            <div class="order-id">${order.orderId || '#' + order.id.slice(0, 8).toUpperCase()}</div>
            <div class="order-date">Placed on ${orderDate.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
          </div>
          <div class="status-badge status-${status === 'out_for_delivery' ? 'out_for_delivery' : status}">
            ${getStatusIcon(status)} ${getStatusText(status)}
          </div>
        </div>
        
        <!-- Delivery Progress -->
        ${!isCancelled ? `
          <div class="delivery-progress">
            <div class="progress-bar" style="width: ${progressPercent}%"></div>
            <div class="progress-steps">
              <div class="progress-step ${progressPercent >= 25 ? 'active' : ''}">📋 Order</div>
              <div class="progress-step ${progressPercent >= 50 ? 'active' : ''}">🍳 Prep</div>
              <div class="progress-step ${progressPercent >= 75 ? 'active' : ''}">🛵 Delivery</div>
              <div class="progress-step ${progressPercent >= 100 ? 'active' : ''}">✅ Done</div>
            </div>
          </div>
        ` : ''}
        
        <!-- Customer Info -->
        <div class="order-info">
          <div class="info-row">
            <span class="info-label">👤 Customer Name</span>
            <span class="info-value">${order.customerName || order.name || 'N/A'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">📞 Phone Number</span>
            <span class="info-value">${order.customerPhone || order.phone || 'N/A'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">📍 Delivery Address</span>
            <span class="info-value">${order.customerAddress || order.address || 'N/A'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">📮 Pincode</span>
            <span class="info-value">${order.pincode || 'N/A'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">🚚 Delivery Type</span>
            <span class="info-value">${order.deliveryType === 'quick' ? '⚡ Quick (10-15 mins)' : '📅 Scheduled'}</span>
          </div>
        </div>
        
        <!-- Map Section -->
        ${order.location?.lat && !isCancelled ? `
          <div class="map-section">
            <div class="timeline-title">📍 Delivery Location</div>
            <div id="trackMap" class="map-container"></div>
          </div>
        ` : ''}
        
        <!-- Timeline -->
        <div class="timeline-section">
          <div class="timeline-title">⏱️ Order Timeline</div>
          <div class="timeline">
            ${timelineHTML}
          </div>
        </div>
        
        <!-- Order Items -->
        <div class="items-section">
          <div class="timeline-title">🛍️ Order Items (${order.items?.length || 0})</div>
          <div class="items-list">
            ${itemsHTML}
          </div>
          <div class="summary">
            <div class="summary-row">
              <span>Subtotal</span>
              <span>₹${order.subtotal || calculateSubtotal(order.items)}</span>
            </div>
            <div class="summary-row">
              <span>Delivery Charge</span>
              <span>₹${order.deliveryCharge || 0}</span>
            </div>
            ${order.discount ? `<div class="summary-row" style="color: var(--primary);"><span>Discount</span><span>-₹${order.discount}</span></div>` : ''}
            <div class="summary-row summary-total">
              <span>Total Paid</span>
              <span>₹${order.total || 0}</span>
            </div>
          </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
          <a href="https://wa.me/${order.customerPhone || order.phone}" target="_blank" class="btn-whatsapp">💬 WhatsApp Support</a>
          <a href="index.html" class="btn-home">🏠 Continue Shopping</a>
        </div>
      </div>
    `;
    
    container.style.display = 'block';
    
    // Initialize map if coordinates exist
    if (order.location?.lat && order.location?.lng && !isCancelled) {
      setTimeout(() => initTrackingMap(order.location.lat, order.location.lng, status), 100);
    }
  }
  
  // Render Timeline
  function renderTimeline(order) {
    const status = order.status || 'pending';
    const createdAt = order.orderDate?.toDate ? order.orderDate.toDate() : new Date(order.orderDate);
    const confirmedAt = order.confirmedAt?.toDate ? order.confirmedAt.toDate() : null;
    const preparingAt = order.preparingAt?.toDate ? order.preparingAt.toDate() : null;
    const outForDeliveryAt = order.outForDeliveryAt?.toDate ? order.outForDeliveryAt.toDate() : null;
    const deliveredAt = order.deliveredAt?.toDate ? order.deliveredAt.toDate() : null;
    
    const steps = [
      { key: 'pending', title: 'Order Placed', icon: '📋', time: createdAt, completed: true },
      { key: 'confirmed', title: 'Order Confirmed', icon: '✅', time: confirmedAt, completed: status !== 'pending' && status !== 'cancelled' },
      { key: 'preparing', title: 'Preparing Your Order', icon: '🍳', time: preparingAt, completed: status === 'preparing' || status === 'out_for_delivery' || status === 'delivered' },
      { key: 'out_for_delivery', title: 'Out for Delivery', icon: '🛵', time: outForDeliveryAt, completed: status === 'out_for_delivery' || status === 'delivered' },
      { key: 'delivered', title: 'Delivered', icon: '🎉', time: deliveredAt, completed: status === 'delivered' }
    ];
    
    let currentReached = false;
    
    return steps.map(step => {
      let isCompleted = step.completed;
      let isActive = false;
      
      if (!currentReached && !isCompleted && step.key !== 'delivered') {
        isActive = true;
        currentReached = true;
      }
      
      if (status === 'cancelled') {
        isCompleted = false;
        isActive = false;
      }
      
      const timeStr = step.time ? step.time.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';
      
      return `
        <div class="timeline-item">
          <div class="timeline-icon ${isCompleted ? 'completed' : (isActive ? 'active' : '')}">
            ${step.icon}
          </div>
          <div class="timeline-content">
            <div class="timeline-step">${step.title}</div>
            ${timeStr ? `<div class="timeline-time">${timeStr}</div>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }
  
  // Render Order Items
  function renderItems(items) {
    if (!items || items.length === 0) {
      return '<div style="text-align:center;color:var(--muted);">No items found</div>';
    }
    
    return items.map(item => `
      <div class="order-item">
        <img src="${item.image || 'https://via.placeholder.com/55'}" class="item-image" onerror="this.src='https://via.placeholder.com/55'">
        <div class="item-details">
          <div class="item-name">${item.name}</div>
          <div class="item-price">₹${item.price} × ${item.quantity}</div>
        </div>
        <div class="item-quantity">₹${(item.price * item.quantity).toFixed(2)}</div>
      </div>
    `).join('');
  }
  
  // Initialize Tracking Map
  function initTrackingMap(lat, lng, status) {
    const mapContainer = document.getElementById('trackMap');
    if (!mapContainer) return;
    
    if (map) {
      map.remove();
      map = null;
    }
    
    map = L.map('trackMap').setView([lat, lng], 14);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);
    
    // Destination marker
    const destinationIcon = L.divIcon({
      html: '📍',
      className: 'custom-marker',
      iconSize: [30, 30],
      popupAnchor: [0, -15]
    });
    
    mapMarker = L.marker([lat, lng], { icon: destinationIcon }).addTo(map);
    mapMarker.bindPopup('<b>Delivery Location</b><br>Your order will be delivered here').openPopup();
    
    // Add circle for delivery radius (500m)
    L.circle([lat, lng], {
      radius: 500,
      color: '#2ecc71',
      fillColor: '#2ecc71',
      fillOpacity: 0.1
    }).addTo(map);
    
    // If order is out for delivery, add animated delivery marker
    if (status === 'out_for_delivery') {
      // Simulate delivery person location (average location)
      const deliveryLat = lat + 0.002;
      const deliveryLng = lng - 0.001;
      
      const deliveryIcon = L.divIcon({
        html: '🛵',
        className: 'custom-marker delivery-marker',
        iconSize: [30, 30]
      });
      
      const deliveryMarker = L.marker([deliveryLat, deliveryLng], { icon: deliveryIcon }).addTo(map);
      deliveryMarker.bindPopup('<b>Delivery Partner</b><br>On the way!').openPopup();
      
      // Fit bounds to show both markers
      const bounds = L.latLngBounds([[lat, lng], [deliveryLat, deliveryLng]]);
      map.fitBounds(bounds, { padding: [50, 50] });
    } else {
      map.setView([lat, lng], 15);
    }
  }
  
  // Helper Functions
  function getProgressPercent(status) {
    switch(status) {
      case 'pending': return 10;
      case 'confirmed': return 25;
      case 'preparing': return 50;
      case 'out_for_delivery': return 75;
      case 'delivered': return 100;
      default: return 0;
    }
  }
  
  function getStatusIcon(status) {
    const icons = {
      pending: '⏳',
      confirmed: '✅',
      preparing: '🍳',
      out_for_delivery: '🛵',
      delivered: '🎉',
      cancelled: '❌'
    };
    return icons[status] || '📋';
  }
  
  function getStatusText(status) {
    const texts = {
      pending: 'Pending',
      confirmed: 'Confirmed',
      preparing: 'Preparing',
      out_for_delivery: 'Out for Delivery',
      delivered: 'Delivered',
      cancelled: 'Cancelled'
    };
    return texts[status] || status;
  }
  
  function calculateSubtotal(items) {
    if (!items) return 0;
    return items.reduce((sum, item) => sum + (item.price * (item.quantity || 1)), 0);
  }
  
  function showLoading(show) {
    document.getElementById('loadingState').style.display = show ? 'flex' : 'none';
  }
  
  function hideOrder() {
    document.getElementById('orderContainer').style.display = 'none';
  }
  
  function hideError() {
    document.getElementById('errorState').style.display = 'none';
  }
  
  function showError() {
    document.getElementById('errorState').style.display = 'block';
    document.getElementById('inputSection').style.display = 'block';
  }
  
  function hideInputSection() {
    document.getElementById('inputSection').style.display = 'none';
  }
  
  window.resetTracking = function() {
    if (unsubscribeOrder) {
      unsubscribeOrder();
      unsubscribeOrder = null;
    }
    currentOrderId = null;
    document.getElementById('inputSection').style.display = 'block';
    document.getElementById('orderContainer').style.display = 'none';
    document.getElementById('errorState').style.display = 'none';
    document.getElementById('orderIdInput').value = '';
  };
  
  function showToast(msg, type) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = `toast ${type}`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }
  
  // Enter key support
  document.getElementById('orderIdInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') trackOrder();
  });
  
  // Initialize
  init();
  
  console.log('✅ Order tracking system ready!');
</script>
</body>
</html>
