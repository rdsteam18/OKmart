<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Categories | OK Mart</title>
  <meta name="description" content="Explore store categories available on OK Mart.">
  <meta name="theme-color" content="#006b22">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/a/AVvXsEjqUODVL4iyLalUMIzsfwPSpjOSA_8OEz7zn7WiCOxVySl8TqcLxulYNt7tBT9C85tto_EoafNkIMbgV1AMPkOJjkeZ52VLY5PR02z06GFwwFPb9WQBAun4WHcd3JB2Heky3Q2WdDGPy8DGZn7suo0_8RdY7Wd7i7wTMA4osYIiL6NZ1CbuPJHGzmeX">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/home.css">

  <style>
    .categories-view-page {
      background: #f7f7f7;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .cat-dir-header {
      background: linear-gradient(135deg, #006b22 0%, #16a34a 60%, #84c225 100%);
      padding: 14px 16px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 107, 34, 0.15);
    }

    .cat-back-btn {
      color: #ffffff;
      font-size: 1.3rem;
      font-weight: 800;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .cat-dir-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
    }

    .categories-card-section {
      background: #ffffff;
      padding: 16px 14px 20px;
      margin: 12px;
      border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      border: 1px solid #f0f0f0;
    }

    .categories-sec-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .categories-icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px 10px;
    }

    @media (min-width: 640px) {
      .categories-icon-grid {
        grid-template-columns: repeat(6, 1fr);
        gap: 16px 12px;
      }
    }

    @media (min-width: 1024px) {
      .categories-icon-grid {
        grid-template-columns: repeat(8, 1fr);
        gap: 20px 14px;
      }
    }

    .category-icon-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .category-icon-tile:active {
      transform: scale(0.92);
    }

    .category-icon-bubble {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #f0fdf4;
      border: 1.5px solid #dcfce7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
    }

    .category-icon-tile:hover .category-icon-bubble {
      background: #006b22;
      border-color: #006b22;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 107, 34, 0.2);
    }

    .category-icon-tile:hover .category-icon-bubble span {
      transform: scale(1.1);
    }

    .category-icon-name {
      font-size: 0.75rem;
      font-weight: 700;
      color: #374151;
      text-align: center;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 26px;
    }

    .category-item-count {
      font-size: 0.65rem;
      font-weight: 600;
      color: #16a34a;
      margin-top: 1px;
    }

    /* Skeleton loader for categories */
    .skeleton-bubble {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: skeletonShimmer 1.5s infinite;
      margin-bottom: 6px;
    }
  </style>
</head>

<body class="categories-view-page">
  <div class="app-container">

    <!-- Header -->
    <header class="cat-dir-header">
      <button class="cat-back-btn" onclick="if(history.length>1){history.back();}else{location.href='/';}" aria-label="Back">
        <span>←</span>
      </button>
      <h1 class="cat-dir-title">Shop by Category</h1>
    </header>

    <!-- Main Categories Section (Loaded Dynamically from Firebase) -->
    <main style="padding-top: 6px;">
      <section class="categories-card-section">
        <h2 class="categories-sec-title">
          <span>📂</span>
          <span>All Store Categories</span>
        </h2>
        
        <div class="categories-icon-grid" id="categoriesIconGrid">
          <!-- Shimmering Skeleton while loading -->
          <div class="category-icon-tile">
            <div class="skeleton-bubble"></div>
            <div style="width: 50px; height: 10px; background: #e5e7eb; border-radius: 4px;"></div>
          </div>
          <div class="category-icon-tile">
            <div class="skeleton-bubble"></div>
            <div style="width: 50px; height: 10px; background: #e5e7eb; border-radius: 4px;"></div>
          </div>
          <div class="category-icon-tile">
            <div class="skeleton-bubble"></div>
            <div style="width: 50px; height: 10px; background: #e5e7eb; border-radius: 4px;"></div>
          </div>
          <div class="category-icon-tile">
            <div class="skeleton-bubble"></div>
            <div style="width: 50px; height: 10px; background: #e5e7eb; border-radius: 4px;"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-navbar">
      <a href="/" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="/categories.html" class="nav-item active">
        <span class="nav-icon">📂</span>
        <span>Categories</span>
      </a>
      <a href="/search.html" class="nav-item">
        <span class="nav-icon">🔍</span>
        <span>Search</span>
      </a>
      <a href="/track-order.html" class="nav-item">
        <span class="nav-icon">📦</span>
        <span>Track</span>
      </a>
      <a href="/cart.html" class="nav-item">
        <span class="nav-icon">🛒</span>
        <span>Cart</span>
        <span class="nav-badge" id="catBottomCartCount">0</span>
      </a>
      <a href="/profile.html" class="nav-item">
        <span class="nav-icon">👤</span>
        <span>Account</span>
      </a>
    </nav>

  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase.js"></script>
  <script src="/js/common.js"></script>

  <script>
    // Known Category Icon Mapping
    const CATEGORY_MAP = {
      'dairy': { name: 'Dairy & Breakfast', icon: '🥛' },
      'fruits': { name: 'Fresh Fruits', icon: '🍎' },
      'vegetables': { name: 'Fresh Vegetables', icon: '🥬' },
      'snacks': { name: 'Munchies & Snacks', icon: '🍿' },
      'beverages': { name: 'Cold Drinks & Juices', icon: '🥤' },
      'grocery': { name: 'Atta, Dal & Grocery', icon: '🌾' },
      'personal-care': { name: 'Personal Care', icon: '🧴' },
      'personal': { name: 'Personal Care', icon: '🧴' },
      'household': { name: 'Cleaning & Household', icon: '🧹' },
      'bakery': { name: 'Bakery & Bread', icon: '🍞' },
      'icecream': { name: 'Ice Cream & Frozen', icon: '🍦' },
      'electronics': { name: 'Electronics & Mobile', icon: '📱' },
      'energy-drinks': { name: 'Energy Drinks', icon: '⚡' }
    };

    async function loadDatabaseCategories() {
      const grid = document.getElementById('categoriesIconGrid');
      if (!grid) return;

      try {
        const snap = await db.collection('products').where('active', '==', true).get();
        const catCounts = {};

        snap.forEach(doc => {
          const p = doc.data();
          const cat = (p.category || 'grocery').toLowerCase();
          catCounts[cat] = (catCounts[cat] || 0) + 1;
        });

        // Unique category IDs present in database
        const activeCategories = Object.keys(catCounts);

        if (activeCategories.length === 0) {
          // Fallback standard categories if database is empty
          activeCategories.push('beverages', 'fruits', 'vegetables', 'dairy', 'grocery', 'snacks', 'household', 'personal-care', 'bakery');
        }

        grid.innerHTML = activeCategories.map(catId => {
          const meta = CATEGORY_MAP[catId] || { 
            name: catId.charAt(0).toUpperCase() + catId.slice(1).replace('-', ' '), 
            icon: '🛍️' 
          };
          const count = catCounts[catId] || 0;

          return `
            <a href="/categories/${catId}.html" class="category-icon-tile">
              <div class="category-icon-bubble">
                <span>${meta.icon}</span>
              </div>
              <span class="category-icon-name">${meta.name}</span>
              ${count > 0 ? `<span class="category-item-count">${count} items</span>` : ''}
            </a>
          `;
        }).join('');

      } catch (err) {
        console.warn('Error loading categories from Firestore:', err);
        // Fallback
        const fallback = ['beverages', 'fruits', 'vegetables', 'dairy', 'grocery', 'snacks', 'household', 'personal-care', 'bakery'];
        grid.innerHTML = fallback.map(catId => {
          const meta = CATEGORY_MAP[catId];
          return `
            <a href="/categories/${catId}.html" class="category-icon-tile">
              <div class="category-icon-bubble"><span>${meta.icon}</span></div>
              <span class="category-icon-name">${meta.name}</span>
            </a>
          `;
        }).join('');
      }
    }

    // Update bottom nav cart count
    function updateCartCount() {
      try {
        const cart = JSON.parse(localStorage.getItem('okmart_cart') || '[]');
        const count = cart.reduce((s, i) => s + (i.quantity || 1), 0);
        const el = document.getElementById('catBottomCartCount');
        if (el) el.textContent = count;
      } catch(e) {}
    }

    updateCartCount();
    loadDatabaseCategories();
  </script>
</body>
</html>
