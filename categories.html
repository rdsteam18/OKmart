<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Categories | OK Mart</title>
  <meta name="description" content="Explore store categories available on OK Mart.">
  <meta name="theme-color" content="#006b22">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/a/AVvXsEjqUODVL4iyLalUMIzsfwPSpjOSA_8OEz7zn7WiCOxVySl8TqcLxulYNt7tBT9C85tto_EoafNkIMbgV1AMPkOJjkeZ52VLY5PR02z06GFwwFPb9WQBAun4WHcd3JB2Heky3Q2WdDGPy8DGZn7suo0_8RdY7Wd7i7wTMA4osYIiL6NZ1CbuPJHGzmeX">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/qc.css">

  <style>
    .categories-view-page {
      background: #f7f7f7;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .cat-dir-header {
      background: linear-gradient(135deg, #006b22 0%, #16a34a 60%, #84c225 100%);
      padding: 14px 16px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 107, 34, 0.15);
    }

    .cat-back-btn {
      color: #ffffff;
      font-size: 1.3rem;
      font-weight: 800;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .cat-dir-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
    }

    .categories-card-section {
      background: #ffffff;
      padding: 16px 14px 20px;
      margin: 12px;
      border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      border: 1px solid #f0f0f0;
    }

    .categories-sec-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .categories-icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px 10px;
    }

    @media (min-width: 640px) {
      .categories-icon-grid {
        grid-template-columns: repeat(6, 1fr);
        gap: 16px 12px;
      }
    }

    @media (min-width: 1024px) {
      .categories-icon-grid {
        grid-template-columns: repeat(8, 1fr);
        gap: 20px 14px;
      }
    }

    .category-icon-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .category-icon-tile:active {
      transform: scale(0.92);
    }

    .category-icon-bubble {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      /* Soft pink tile like the quick-commerce reference; photo fills it */
      background: #fdf2f8;
      border: 1.5px solid #fbcfe8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
      overflow: hidden;
    }

    .category-icon-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .category-icon-tile:hover .category-icon-bubble {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 107, 34, 0.2);
    }

    .category-icon-tile:hover .category-icon-bubble span {
      transform: scale(1.1);
    }

    .category-icon-name {
      font-size: 0.75rem;
      font-weight: 700;
      color: #374151;
      text-align: center;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 26px;
    }

    .category-item-count {
      font-size: 0.65rem;
      font-weight: 600;
      color: #16a34a;
      margin-top: 1px;
    }

    /* Skeleton loader for categories */
    .skeleton-bubble {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: skeletonShimmer 1.5s infinite;
      margin-bottom: 6px;
    }
  </style>
</head>

<body class="categories-view-page">
  <div class="app-container">

    <!-- Header -->
    <header class="cat-dir-header">
      <button class="cat-back-btn" onclick="if(history.length>1){history.back();}else{location.href='/';}" aria-label="Back">
        <span>←</span>
      </button>
      <h1 class="cat-dir-title">Shop by Category</h1>
    </header>

    <!-- Search pill (same look as homepage / search page) -->
    <div class="qc-search-wrap">
      <div class="qc-search-pill" onclick="window.location.href='/search.html'">
        <span class="search-pill-icon">🔍</span>
        <input type="text" class="search-main-input" placeholder="Search in OKmart" readonly>
        <button class="mic-search-icon-btn" aria-label="Voice Search">🎙️</button>
      </div>
    </div>

    <!-- Grouped Category Sections (Loaded Dynamically from Firebase) -->
    <main style="padding-top: 6px;">
      <div id="categoryGroupsContainer">
        <div style="padding: 24px; text-align: center; color: #888;">Loading categories...</div>
      </div>
    </main>

    <!-- Floating Bottom Navigation (Categories active) -->
    <nav class="qc-bottom-nav">
      <a href="/index.html" class="qc-nav-item">
        <span class="qc-nav-icon"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5.5h5V20"/></svg></span>
        <span>Home</span>
      </a>
      <a href="/categories.html" class="qc-nav-item active">
        <span class="qc-nav-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>
        <span>Categories</span>
      </a>
      <a href="/buy-again.html" class="qc-nav-item">
        <span class="qc-nav-icon"><svg viewBox="0 0 24 24"><path d="M5.5 8h13l-1 12h-11L5.5 8Z"/><path d="M9 10.5V6.5a3 3 0 0 1 6 0v4"/><path d="M17.5 4.5a3.2 3.2 0 1 1-2.4 1.1"/><path d="M17.6 2.6v1.9h-1.9"/></svg></span>
        <span>Buy Again</span>
      </a>
      <a href="/cart.html" class="qc-nav-item">
        <span class="qc-nav-icon"><svg viewBox="0 0 24 24"><path d="M5.5 8h13l-1 12h-11L5.5 8Z"/><path d="M9 10.5V6.5a3 3 0 0 1 6 0v4"/></svg></span>
        <span>Basket</span>
        <span class="qc-nav-badge" id="bottomNavCartCount">0</span>
      </a>
    </nav>

  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/qc-nav.js"></script>

  <script>
    // Known Category Icon Mapping
    const CATEGORY_MAP = {
      'dairy': { name: 'Dairy & Breakfast', icon: '🥛' },
      'fruits': { name: 'Fresh Fruits', icon: '🍎' },
      'vegetables': { name: 'Fresh Vegetables', icon: '🥬' },
      'snacks': { name: 'Munchies & Snacks', icon: '🍿' },
      'beverages': { name: 'Cold Drinks & Juices', icon: '🥤' },
      'grocery': { name: 'Atta, Dal & Grocery', icon: '🌾' },
      'personal-care': { name: 'Personal Care', icon: '🧴' },
      'personal': { name: 'Personal Care', icon: '🧴' },
      'household': { name: 'Cleaning & Household', icon: '🧹' },
      'bakery': { name: 'Bakery & Bread', icon: '🍞' },
      'icecream': { name: 'Ice Cream & Frozen', icon: '🍦' },
      'electronics': { name: 'Electronics & Mobile', icon: '📱' },
      'energy-drinks': { name: 'Energy Drinks', icon: '⚡' }
    };

    // Group headings (reference-style) mapped from real category IDs.
    // Unknown future categories fall into "More categories".
    const CATEGORY_GROUPS = [
      { title: 'Grocery', ids: ['fruits', 'vegetables', 'grocery', 'dairy'] },
      { title: 'Snacks & drinks', ids: ['snacks', 'beverages', 'bakery', 'icecream', 'energy-drinks'] },
      { title: 'Home & personal', ids: ['household', 'personal-care', 'personal', 'electronics'] }
    ];

    // Category images saved from the admin panel (Firestore 'categories'
    // collection, doc id = category id, field 'image'). Empty = emoji tile.
    // Loaded best-effort: any failure leaves this empty and the page renders
    // exactly as before.
    let categoryImages = {};

    async function loadCategoryImages() {
      try {
        const snap = await db.collection('categories').get();
        const map = {};
        snap.forEach(doc => {
          const img = (doc.data().image || '').trim();
          if (img) map[doc.id] = img;
        });
        categoryImages = map;
      } catch (err) {
        console.warn('Category images unavailable, using emoji tiles:', err);
        categoryImages = {};
      }
    }

    function categoryTile(catId) {
      const meta = CATEGORY_MAP[catId] || {
        name: catId.charAt(0).toUpperCase() + catId.slice(1).replace('-', ' '),
        icon: '🛍️'
      };
      // Photo tile when the admin saved an image link for this category;
      // a dead link swaps back to the emoji tile automatically.
      const img = categoryImages[catId];
      const bubble = img
        ? `<img src="${img.replace(/"/g, '%22')}" alt="" loading="lazy" class="category-icon-photo" onerror="this.onerror=null;var s=document.createElement('span');s.textContent='${meta.icon}';this.replaceWith(s);">`
        : `<span>${meta.icon}</span>`;
      // Same destination as before: the per-category page.
      return `
        <a href="/categories/${catId}.html" class="category-icon-tile">
          <div class="category-icon-bubble">${bubble}</div>
          <span class="category-icon-name">${meta.name}</span>
        </a>
      `;
    }

    function renderGroupedCategories(activeCategories) {
      const container = document.getElementById('categoryGroupsContainer');
      if (!container) return;
      const remaining = [...activeCategories];
      let html = '';
      for (const group of CATEGORY_GROUPS) {
        const ids = group.ids.filter(id => remaining.includes(id));
        ids.forEach(id => {
          const i = remaining.indexOf(id);
          if (i > -1) remaining.splice(i, 1);
        });
        if (ids.length === 0) continue;
        html += `
          <section class="qc-cat-group">
            <h2 class="qc-cat-group-title">${group.title}</h2>
            <div class="categories-icon-grid">
              ${ids.map(categoryTile).join('')}
            </div>
          </section>
        `;
      }
      if (remaining.length > 0) {
        html += `
          <section class="qc-cat-group">
            <h2 class="qc-cat-group-title">More categories</h2>
            <div class="categories-icon-grid">
              ${remaining.map(categoryTile).join('')}
            </div>
          </section>
        `;
      }
      container.innerHTML = html || '<div style="padding: 24px; text-align: center; color: #888;">No categories found</div>';
    }

    async function loadDatabaseCategories() {
      // Category photos first (best-effort, never blocks the page).
      await loadCategoryImages();
      try {
        const snap = await db.collection('products').where('active', '==', true).get();
        const seen = new Set();
        snap.forEach(doc => {
          const cat = (doc.data().category || 'grocery').toLowerCase();
          seen.add(cat);
        });
        let activeCategories = [...seen];
        if (activeCategories.length === 0) {
          // Fallback standard categories if database is empty
          activeCategories = ['beverages', 'fruits', 'vegetables', 'dairy', 'grocery', 'snacks', 'household', 'personal-care', 'bakery'];
        }
        renderGroupedCategories(activeCategories);
      } catch (err) {
        console.warn('Error loading categories from Firestore:', err);
        renderGroupedCategories(['beverages', 'fruits', 'vegetables', 'dairy', 'grocery', 'snacks', 'household', 'personal-care', 'bakery']);
      }
    }

    loadDatabaseCategories();
  </script>
</body>
</html>
